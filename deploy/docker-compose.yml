services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: vulnserve
      POSTGRES_PASSWORD: vulnserve
      POSTGRES_DB: vulnserve
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vulnserve"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  pgdata:
