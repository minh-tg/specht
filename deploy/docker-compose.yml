services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: specht
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-specht}
      POSTGRES_DB: specht
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U specht"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  server:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    ports:
      - "${SERVER_PORT:-8080}:8080"
    environment:
      DATABASE_URL: >-
        postgres://specht:${POSTGRES_PASSWORD:-specht}@db:5432/specht?sslmode=${POSTGRES_SSLMODE:-disable}
      JWT_SECRET: ${JWT_SECRET}
      SERVER_ADDR: :8080
      LOG_LEVEL: ${LOG_LEVEL:-info}
      DB_MIGRATE: "true"
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173}
      # CVE Feed Watcher (opt-in; off by default)
      WATCHER_ENABLE: ${WATCHER_ENABLE:-false}
      INVENTORY_TTL: ${INVENTORY_TTL:-2160h}
      WATCHER_POLL_INTERVAL: ${WATCHER_POLL_INTERVAL:-6h}
      WATCHER_OSV_ENDPOINT: >-
        ${WATCHER_OSV_ENDPOINT:-https://api.osv.dev/v1/querybatch}
      WATCHER_BATCH_SIZE: ${WATCHER_BATCH_SIZE:-100}
      WATCHER_COLD_START_WINDOW: ${WATCHER_COLD_START_WINDOW:-full}
      WATCHER_SLACK_URL: ${WATCHER_SLACK_URL:-}
      WATCHER_SLACK_SIGNING_SECRET: ${WATCHER_SLACK_SIGNING_SECRET:-}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
