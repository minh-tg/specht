apiVersion: v1
kind: Secret
metadata:
  name: {{ include "specht.fullname" . | quote }}
  labels:
    app.kubernetes.io/name: {{ include "specht.name" . | quote }}
    app.kubernetes.io/instance: {{ .Release.Name | quote }}
type: Opaque
stringData:
  # The postgresql subchart's service is named <release>-postgresql.
  # An empty password fails here with a clear message instead of
  # rendering a broken connection string (js/empty-password FP: the
  # values default is intentionally empty to force explicit configuration).
  database-url: {{ printf "postgres://%s:%s@%s-postgresql:5432/%s?sslmode=%s" .Values.postgresql.user (required "postgresql.password must be set via --set postgresql.password=... (or an external secret)" .Values.postgresql.password) .Release.Name .Values.postgresql.database (.Values.postgresql.sslmode | default "require") | quote }}
