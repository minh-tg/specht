apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "specht.fullname" . }}
  labels:
    app.kubernetes.io/name: {{ include "specht.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "specht.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "specht.name" . }}
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      automountServiceAccountToken: false
      # Pod-level defaults: the image already runs as non-root (USER specht),
      # so enforce it here too rather than relying on the default context
      # (KSV-0118). No runAsUser: the image-assigned UID is not fixed.
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: {{ .Chart.Name }}
          image: "{{ .Values.image.repository }}:{{ required "image.tag must be set to a pinned release tag" .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: 8080
              name: http
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "specht.fullname" . }}
                  key: database-url
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "specht.fullname" . }}
                  key: jwt-secret
            - name: SERVER_ADDR
              value: {{ .Values.env.SERVER_ADDR | quote }}
            - name: LOG_LEVEL
              value: {{ .Values.env.LOG_LEVEL | quote }}
            - name: DB_MIGRATE
              value: {{ .Values.env.DB_MIGRATE | quote }}
            - name: CORS_ORIGINS
              value: {{ .Values.env.CORS_ORIGINS | quote }}
            - name: INVENTORY_TTL
              value: {{ .Values.env.INVENTORY_TTL | quote }}
            - name: WATCHER_ENABLE
              value: {{ .Values.env.WATCHER_ENABLE | quote }}
            - name: WATCHER_POLL_INTERVAL
              value: {{ .Values.env.WATCHER_POLL_INTERVAL | quote }}
            - name: WATCHER_OSV_ENDPOINT
              value: {{ .Values.env.WATCHER_OSV_ENDPOINT | quote }}
            - name: WATCHER_BATCH_SIZE
              value: {{ .Values.env.WATCHER_BATCH_SIZE | quote }}
            - name: WATCHER_COLD_START_WINDOW
              value: {{ .Values.env.WATCHER_COLD_START_WINDOW | quote }}
            - name: WATCHER_SLACK_URL
              value: {{ .Values.watcher.slackUrl | quote }}
            - name: WATCHER_SLACK_SIGNING_SECRET
              value: {{ .Values.watcher.slackSigningSecret | quote }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
