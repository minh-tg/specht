apiVersion: v1
kind: Secret
metadata:
  name: {{ include "vulnserve.fullname" . }}
  labels:
    app.kubernetes.io/name: {{ include "vulnserve.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
type: Opaque
stringData:
  database-url: {{ printf "postgres://%s:%s@%s-postgresql:5432/%s?sslmode=disable" .Values.postgresql.user .Values.postgresql.password .Release.Name .Values.postgresql.database | quote }}
