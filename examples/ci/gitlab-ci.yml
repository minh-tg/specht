# Specht gate for GitLab CI.
#
# Same three steps as the GitHub Actions template: scan with Trivy, wrap the
# raw JSON in a Specht ingest envelope (branch/commit/environment/owner),
# pipe it to `specht-adapter` for ingest + gate evaluation.
#
# Exit codes: 0 gate passed, 1 threshold breached (job fails with the
# blocking findings in the log), 2 usage/runtime error.
#
# Required CI/CD variables (masked where secret):
#   SPECHT_API_URL (variable), SPECHT_API_KEY (masked), SPECHT_PROJECT
#   (variable). SPECHT_OWNER is optional and pins the responsible team.
#
# Local reproduction: same trivy + jq + specht-adapter lines with
# API_URL/API_KEY exported.

stages: [scan, gate]

variables:
  SPECHT_ENVIRONMENT: ci

trivy-scan:
  stage: scan
  image:
    name: aquasec/trivy:0.59.0
    entrypoint: [""]
  script:
    - trivy fs --format json --output trivy-results.json --severity UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL .
  artifacts:
    paths: [trivy-results.json]
    expire_in: 30 days
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

specht-gate:
  stage: gate
  image: golang:1.26-bookworm
  needs: [trivy-scan]
  script:
    - |
      jq -n \
        --arg project "$SPECHT_PROJECT" \
        --arg branch "$CI_COMMIT_REF_NAME" \
        --arg commit "$CI_COMMIT_SHA" \
        --arg env "$SPECHT_ENVIRONMENT" \
        --arg owner "$SPECHT_OWNER" \
        --slurpfile raw trivy-results.json \
        '{project: $project, scanner: "trivy",
          branch: $branch, commit_sha: $commit,
          environment: $env, owner: $owner,
          raw_data: $raw[0]}' \
      | go run ./cmd/adapter -project "$SPECHT_PROJECT" -tool trivy
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
