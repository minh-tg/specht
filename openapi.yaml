  /api/v1/findings/{findingID}/reachability:
    post:
      tags: [Reachability]
      operationId: upsertReachability
      summary: Record a reachability assessment
      description: |
        Upserts in place, so one finding has at most one assessment. An expert
        `not_reachable` claim exempts the finding from the gate — including the
        ingress gate and the watcher's `require_triage` mode — until the
        assessment is lifted.
      x-auth: session
      security:
        - sessionAuth: []
      parameters:
        - $ref: "#/components/parameters/FindingID"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpsertReachabilityRequest" }
      responses:
