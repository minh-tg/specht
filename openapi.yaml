      responses:
        "204": { $ref: "#/components/responses/NoContent" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/SessionRequired" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/teams/{id}/members:
