  /api/v1/users/{id}/role:
    put:
      tags: [Users]
      operationId: changeUserRole
      summary: Change an account's global role
      description: |
        Session admins only. The change reaches sessions that are already
        open: the account's token generation advances, so its old tokens stop
        working and the person signs in again to get the new role. The last
        active admin cannot be demoted, and the seeded system account
        (`system@specht.local`) cannot be changed at all; both answer 409.
      x-auth: session
      x-required-role: admin
      security:
        - sessionAuth: []
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ChangeRoleRequest" }
      responses:
        "200":
          description: The updated account.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UserProfile" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/SessionRequired" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /api/v1/users/{id}/reset-link:
    post:
      tags: [Users]
      operationId: createPasswordResetLink
      summary: Issue a password reset link for an account
      description: |
        For a person who is locked out when the instance has no mail
        transport. The response carries a relative link (`/reset/<token>`) that
        is shown once: only a hash of the token is stored. A new link retires
        the earlier ones for the account. Accounts that have no local password
        (they sign in through SSO) answer 409 `no_local_password`, deactivated
        accounts 409 `account_deactivated`, and the system account 409
        `system_account`.
      x-auth: session
      x-required-role: admin
      security:
        - sessionAuth: []
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "201":
          description: The link.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PasswordResetLink" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/SessionRequired" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /api/v1/users/{id}/deactivate:
    post:
      tags: [Users]
      operationId: deactivateUser
      summary: Deactivate an account
      description: |
        Ends the account's access without deleting it. Open sessions stop at
        their next request, refresh tokens are revoked, and sign-in is refused
        until the account is reactivated; the refusal looks like a wrong
        password. History and memberships stay. Every API key the account
        created is revoked in the same step, in every project, and stays
        revoked when the account is reactivated. An admin cannot deactivate
        themselves, the last active admin cannot be deactivated, and the
        seeded system account (`system@specht.local`) cannot be deactivated;
        each answers 409.

        A deactivated account does not count as a project admin. When the
        account is the only admin who can sign in on one or more projects,
        the call answers 409 `sole_project_admin` and the message lists
        their slugs; nothing changes. Send `{"force": true}` to deactivate
        anyway. The body is optional.
      x-auth: session
      x-required-role: admin
      security:
        - sessionAuth: []
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                force:
                  type: boolean
                  default: false
                  description: Deactivate even if the account is the only active admin of a project.
      responses:
        "200":
          description: The deactivated account.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UserProfile" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/SessionRequired" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /api/v1/users/{id}/reactivate:
    post:
      tags: [Users]
      operationId: reactivateUser
      summary: Reactivate an account
      description: Lets a deactivated account sign in again.
      x-auth: session
      x-required-role: admin
      security:
        - sessionAuth: []
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: The reactivated account.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UserProfile" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/SessionRequired" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/reports:
    post:
      tags: [Reports]
      operationId: ingestReport
      summary: Ingest a scanner report
      description: |
        The core write path. The raw scanner output is hashed together with
        the commit; re-posting identical bytes for the same project and
        commit returns the stored report with `replayed: true` and a freshly
        evaluated verdict at `200`, writing nothing. Identical bytes for a
        different commit ingest as a new report. The payload is parsed
        by the named scanner, findings are upserted by fingerprint, and the gate
        is evaluated inline so the response is the post-ingest verdict. A parse
        failure persists no report row.

        Set `scan_mode: incremental` with `base_revision` to classify findings
        against a baseline; `gate_introduced_only: true` then scopes the verdict
        to what the change introduced. When a baseline cannot be resolved the
        scan falls back to full and explains itself in `fallback_reason`.

        A NUL character (the JSON escape `\u0000`) in a string of `raw_data` is
        dropped before the report is read, because the database cannot store it.
        In a field name it refuses the report with `malformed_report`, since
        dropping it would rename the field. A NUL in any other text field of the
        request is refused with `400 invalid_field`, and the message names the
        field.

        The metadata fields have limits, and a value over one, or one that holds
        a control character (a newline, a tab, an escape), is refused the same
        way: `commit_sha` at most 64 characters from letters, digits, `.`, `_` and
        `-`; `branch` at most 255 bytes; `environment` at most 64; `owner`,
        `digest`, `base_revision` and the `artifact_*` fields at most 255;
        `changed_files` at most 5000 entries of at most 1024 bytes each. A
        refused request writes nothing, and a failed ingest leaves no
        environment, target or artifact row behind.

        Name the project first. The server reads only the start of the body (64
        KiB) to find `project`, and checks that the caller may ingest into it
        before it reads or decodes the rest, so a caller without access gets
        `403` at once. A body that does not name its project within that start
        is refused with `400 missing_field`; put `project` before `raw_data`.
        The project must have one value: a body that repeats the key with
        another value is refused with `400 invalid_field`.

        The whole body must arrive within 30 seconds, otherwise the answer is
        `408 request_timeout`. Ingests share a memory budget
        (`INGEST_MEMORY_BUDGET`, 2 GiB by default): each reserves 64 bytes per
        byte of `raw_data` while it runs. One caller (a user, or an API key) may
        have at most half of `INGEST_MAX_CONCURRENCY` ingests at once, and so
        may one project, however many callers it has. Each also has an
        allowance of half the budget that its ingests share, but one large report
        can still reserve more than half of the whole budget while it runs. An
        ingest that cannot get its place, a free slot or its share of the memory
        within 15 seconds is answered `503 ingest_busy` with `Retry-After`; a
        caller or project that is over its own limit never delays another.
        Once started, an ingest finishes even if the client hangs up.
      x-required-scope: ingest
      security:
        - sessionAuth: []
        - apiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/IngestRequest" }
      responses:
        "200":
          description: |
            Identical bytes for the same project and commit: the stored report
            is returned with its freshly evaluated verdict and `replayed: true`.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/IngestResponse" }
        "201":
          description: Ingested and evaluated.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/IngestResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/ProjectAccessDenied" }
        "404": { $ref: "#/components/responses/NotFound" }
        "408":
          description: The request body did not arrive within 30 seconds. Nothing was stored.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              example: { error: { code: request_timeout, message: the request body did not arrive in time } }
        "409":
          description: |
            Identical report bytes for the same commit, but the stored report
            could not be found for a replay (for example, a concurrent retention
            purge removed it).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              example: { error: { code: duplicate_report, message: report already exists for this project and data } }
        "413": { $ref: "#/components/responses/BodyTooLarge" }
        "422":
          description: |
            The report was refused and nothing was stored. `error.code` says why:

            - `unrecognized_format`: the file is not the named scanner's output.
              The message names the scanner it looks like when one fits.
            - `malformed_report`: the file is that scanner's format but cannot be read,
              or a field name in it holds a NUL character.
            - `unknown_scanner`: no scanner has that name. `GET /api/v1/scanners` lists them.
            - `too_many_findings`: the report holds more findings and packages than
              one report may (the server's `INGEST_MAX_FINDINGS`, 100000 by default).
              The message names the limit. Split the report and ingest each part.
            - `ingest_failed`: any other failure, such as a bad revision.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              examples:
                wrongScanner:
                  summary: A Grype report sent as Trivy
                  value: { error: { code: unrecognized_format, message: "The file is not trivy output. It looks like grype output; choose grype as the scanner." } }
                unreadable:
                  summary: Right format, content that cannot be read
                  value: { error: { code: malformed_report, message: "The grype report could not be read. Check that the file is complete and came from a current version of the tool." } }
                tooMany:
                  summary: A report past the finding limit
                  value: { error: { code: too_many_findings, message: "The trivy report has more than 100000 findings, the most one report may hold. Split it into smaller reports (for example one per module or directory) and ingest each." } }
                other:
                  summary: Any other failure
                  value: { error: { code: ingest_failed, message: report ingestion failed } }
        "503":
          description: |
            Too many ingests are running, or the memory budget stays taken, or the
            caller already has its share of both in use, for 15 seconds. Nothing
            was stored. Retry after `Retry-After` seconds.
          headers:
            Retry-After:
              description: Seconds to wait before retrying.
              schema: { type: integer, minimum: 1 }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              example: { error: { code: ingest_busy, message: "too many ingests in progress, retry shortly" } }

  /api/v1/projects/{slug}/reports:
    get:
      tags: [Reports]
      operationId: listReports
      summary: List a project's reports
      description: |
        With `limit=1` and a `branch`, this answers "what is the newest report
        for this branch", which is how a client waits for the next scan to land.
        The response carries a weak `ETag`; send it back as `If-None-Match` to
        get `304 Not Modified` with no body while nothing has changed.
      x-required-scope: read
      security:
        - sessionAuth: []
        - apiKeyAuth: []
      parameters:
        - $ref: "#/components/parameters/Slug"
        - name: branch
          in: query
          description: Exact branch name. Omit for every branch.
          schema: { type: string, maxLength: 255, example: feature/refund-retry }
        - name: commit
          in: query
          description: Commit id, 7 to 64 hexadecimal characters. Exact match unless commit_prefix is true.
          schema: { type: string, pattern: "^[0-9a-fA-F]{7,64}$", example: 3f9a1c2 }
        - name: commit_prefix
          in: query
          description: Match commit as a case-insensitive prefix. Requires commit when true.
          schema: { type: boolean, default: false }
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
      responses:
        "200":
          description: The reports, newest first.
          headers:
            ETag:
              description: Weak validator of the list. Changes when any listed report changes, including its status.
              schema: { type: string }
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Report" }
        "304":
          description: The list is unchanged since the `If-None-Match` version. No body.
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }


  /api/v1/projects/{slug}/reports/{id}:
    delete:
      tags: [Reports]
      operationId: deleteReport
      summary: Delete a report
      description: |
        Removes the report with its occurrences and inventory, in one
        transaction, and settles the findings it was evidence for:

        - an open or reopened finding that no other report shows becomes
          `archived`: readable with its history, but not counted, not blocking
          and not aging. A `report_deleted` event records who did it.
        - a finding the report introduced is attributed to the earliest report
          that still shows it.
        - fixed findings stay fixed.

        A later scan that sees an archived finding again opens it afresh. The
        retention purge uses the same routine. The count of archived findings
        comes back in `X-Archived-Findings`. A report that is still processing
        answers `409 report_processing`. Needs the project admin role and a
        session (API keys are refused).
      security:
        - sessionAuth: []
      parameters:
        - $ref: "#/components/parameters/Slug"
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "204":
          description: Deleted.
          headers:
            X-Archived-Findings:
              description: How many findings lost their only evidence and were archived.
              schema: { type: integer }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
  /api/v1/reports/{id}:
    get:
      tags: [Reports]
      operationId: getReport
      summary: Read a report
      description: A foreign report is indistinguishable from a missing one.
      x-required-scope: read
      security:
        - sessionAuth: []
        - apiKeyAuth: []
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: The report.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Report" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/projects/{slug}/findings:
    get:
      tags: [Findings]
      operationId: listFindings
      summary: List a project's findings
      description: |
        Every filter is a comma-separated list, and separate filters intersect.
        An unknown value in `severity`, `status`, `kind`, `environment` or
        `target` simply selects nothing. `analysis_state`, `sort` and `dir`
        are checked and refused with 400 when they hold an unknown value.

        The order holds across pages: ties are broken by severity, creation
        time and id, so a page boundary never repeats or skips a finding.
      x-required-scope: read
      security:
        - sessionAuth: []
        - apiKeyAuth: []
      parameters:
        - $ref: "#/components/parameters/Slug"
        - name: severity
          in: query
          description: Comma-separated severities (critical, high, medium, low, unknown). `unknown` is a finding the scanner did not rate.
          schema: { type: string, example: "critical,high" }
        - name: status
          in: query
          description: >-
            Comma-separated lifecycle states (open, fixed, reopened, archived). Without it the list
            leaves out archived findings, which lost their only evidence when a report was deleted.
          schema: { type: string, example: open }
        - name: kind
          in: query
          description: Comma-separated finding kinds (sca, sast, iac, secret, dast, image_config, license, cve_watcher).
          schema: { type: string, example: "sca,sast" }
        - name: environment
          in: query
          description: Comma-separated environment names.
          schema: { type: string }
        - name: target
          in: query
          description: Comma-separated target names.
          schema: { type: string }
        - name: analysis_state
          in: query
          description: |
            Comma-separated analysis states (unanalyzed, in_triage, exploitable,
            false_positive, not_affected, accepted_risk, wont_fix). A finding nobody has
            looked at counts as `unanalyzed`.
          schema: { type: string, example: "unanalyzed,in_triage" }
        - name: q
          in: query
          description: Text to find in the title or the fingerprint, which carries the CVE id and package for dependency findings. Case-insensitive, matched literally, at most 100 characters.
          schema: { type: string, maxLength: 100, example: CVE-2025-20006 }
        - name: sort
          in: query
          description: Sort key. `severity` is the default.
          schema: { type: string, enum: [severity, first_seen, last_seen, title], default: severity }
        - name: dir
          in: query
          description: Sort direction. Defaults to `desc`, or `asc` for `title`. For `first_seen`, `asc` lists the oldest findings first.
          schema: { type: string, enum: [asc, desc] }
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
      responses:
        "200":
          description: |
            The matching findings. `X-Total-Count` carries the size of the
            filtered set, independent of `limit`/`offset`.
          headers:
            X-Total-Count:
              description: Size of the filtered set across every page.
              schema: { type: integer }
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Finding" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/findings/{id}:
    get:
      tags: [Findings]
      operationId: getFinding
      summary: Read a finding
      description: Includes scan context, remediation, location, suggestion, and CVE intel when known.
      x-required-scope: read
      security:
        - sessionAuth: []
        - apiKeyAuth: []
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: The finding.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Finding" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/ProjectAccessDenied" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      tags: [Findings]
      operationId: triageFinding
      summary: Record an analyst decision
      description: |
        Moves the finding's triage standing and returns the resulting gate
        effect. `state` is deliberately absent: it tracks the scan lifecycle and
        only ingest, verification, and the expiry sweeps move it.

        States that ignore the gate (`false_positive`, `not_affected`,
        `accepted_risk`, `wont_fix`) require a `reason`; `accepted_risk` and
        `wont_fix` also require `analysis_expires_at`.

        The event this writes keeps a snapshot of the analysis fields it
        replaced, and the response names that event in `event_id` so the
        decision can be undone with `POST /api/v1/findings/{id}/analysis/undo`.
        `expected_state` makes the write conditional on the finding's current
        analysis state; the write is also refused with `analysis_conflict` when
        the finding changed while the request was being handled.
      x-auth: session
      security:
        - sessionAuth: []
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TriageRequest" }
      responses:
        "200":
          description: Decided.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TriageResult" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: The finding's analysis state is not the one the request expected.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              example: { error: { code: analysis_conflict, message: The finding was triaged by someone else since you loaded it. } }
        "422": { $ref: "#/components/responses/Unprocessable" }

  /api/v1/findings/{id}/analysis/undo:
    post:
      tags: [Findings]
      operationId: undoTriage
      summary: Undo the latest analysis decision
      description: |
        Puts the finding's analysis back to what it was before the named
        event: state, reason, expiry, source and the manual and review flags.
        The undo is recorded as a new `analysis_changed` event that names the
        one it reverses (`changes.undo_of`); the original event stays in the
        history.

        Only the finding's newest analysis event can be undone, and only while
        the finding is still in the state that event set. Anyone who may triage
        the project may undo, not only the person who made the change.

        Events written by bulk triage, by a scan's review flag or before this
        endpoint existed carry no snapshot and answer `undo_unavailable`.
      x-auth: session
      security:
        - sessionAuth: []
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UndoTriageRequest" }
      responses:
        "200":
          description: The analysis was restored. `event_id` names the new undo event.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TriageResult" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: |
            The change cannot be undone. `analysis_conflict`: the event is not
            the finding's newest analysis event, or the finding is no longer in
            the state it set. `undo_unavailable`: the event has no snapshot of
            the earlier analysis. `previous_expiry_passed`: the earlier decision
            has already expired.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              example: { error: { code: analysis_conflict, message: This is no longer the latest triage change on the finding so it cannot be undone. } }

  /api/v1/findings/bulk-analysis:
    post:
      tags: [Findings]
      operationId: bulkTriage
      summary: Apply one decision to many findings
      description: |
        Same analysis-state vocabulary and validation as the single-finding
        path, applied atomically across up to 1000 findings. Partial success is
        not reported: any invalid id, unknown finding, or missing reason fails
        the whole batch.
      x-auth: session
      security:
        - sessionAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BulkTriageRequest" }
      responses:
        "200":
          description: Applied.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BulkTriageResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/Unprocessable" }

  /api/v1/findings/{id}/events:
    get:
      tags: [Findings]
      operationId: listFindingEvents
      summary: Read a finding's audit trail
      description: State changes, triage decisions, and system events left by the expiry sweeps.
      x-required-scope: read
      security:
        - sessionAuth: []
        - apiKeyAuth: []
      parameters:
        - $ref: "#/components/parameters/Id"
        - name: type
          in: query
          description: |
            Keep only events of these types. Repeat the parameter or separate values with
            commas (`type=analysis_changed,comment`). Omit for every type.
          style: form
          explode: true
          schema: { type: array, items: { type: string } }
        - name: limit
          in: query
          description: Page size. Default 50, maximum 500. A malformed, negative, or oversized value falls back to the default.
          schema: { type: integer, minimum: 0, maximum: 500, default: 50 }
        - $ref: "#/components/parameters/Offset"
      responses:
        "200":
          description: The events, newest first.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/FindingEvent" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/findings/{id}/cve:
    get:
      tags: [Findings]
      operationId: getFindingCve
      summary: Read the CVE evaluation details of a finding
      description: |
        Every CVSS vector the finding's scan reports carry, each scored and split
        into its metrics; EPSS and CISA KEV from the intel feeds; CWE identifiers,
        published and modified dates, and https reference links. Every value names
        its source in `provenance`: the scan report (tool, report, observation
        time), the CVE watcher, an external provider (name and fetch time), or an
        intel feed.

        The scan report is the primary source. External providers are asked only
        when they are configured (`CVE_DETAIL_PROVIDERS`) and the reports are
        incomplete for this CVE: they carry no valid CVSS v3.0, v3.1 or v4.0
        vector, or carry neither a CWE nor a published date. Provider values are
        listed after the report's and never replace them. Only the CVE identifier
        is sent to a provider.

        The read never waits on a provider. A missing answer is fetched in the
        background and the response says `pending: true`; read again later to
        see it. Metric keys and values are sent as the vector spells them, in
        vector order; clients supply the labels.
      x-required-scope: read
      security:
        - sessionAuth: []
        - apiKeyAuth: []
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: The CVE details.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CveDetail" }
              example:
                cve_id: CVE-2024-3094
                pending: false
                cvss:
                  - version: "3.1"
                    vector: CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:C/C:H/I:H/A:H
                    base_score: 10.0
                    reported_score: 10.0
                    severity: critical
                    valid: true
                    metrics:
                      - { group: base, key: AV, value: N }
                      - { group: base, key: AC, value: L }
                      - { group: base, key: PR, value: N }
                      - { group: base, key: UI, value: N }
                      - { group: base, key: S, value: C }
                      - { group: base, key: C, value: H }
                      - { group: base, key: I, value: H }
                      - { group: base, key: A, value: H }
                    provenance:
                      kind: scan_report
                      tool: grype
                      report_id: 5d1c2b3a-0000-4000-8000-000000000001
                      observed_at: "2026-10-14T08:00:00Z"
                      detail: nvd
                epss:
                  probability: 0.85
                  percentile: 0.991
                  date: "2026-10-14"
                  provenance: { kind: feed, provider: epss, fetched_at: "2026-10-15T07:00:00Z" }
                kev:
                  listed: true
                  date_added: "2024-04-01"
                  due_date: "2024-04-22"
                  known_ransomware_use: Unknown
                  provenance: { kind: feed, provider: kev, fetched_at: "2026-10-15T07:00:00Z" }
                cwes:
                  - id: CWE-506
                    provenance: { kind: scan_report, tool: trivy, report_id: 5d1c2b3a-0000-4000-8000-000000000002, observed_at: "2026-10-14T08:00:00Z" }
                published_at:
                  value: "2024-03-29T17:15:21Z"
                  provenance: { kind: provider, provider: nvd, fetched_at: "2026-10-15T07:00:00Z" }
                modified_at: null
                references: []
                providers:
                  - { name: nvd, status: found, fetched_at: "2026-10-15T07:00:00Z" }
                  - { name: vulncheck, status: disabled }
                  - { name: osv, status: disabled }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404":
          description: The finding does not exist, or its vulnerability_id is not a CVE identifier.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              examples:
                notFound:
                  value: { error: { code: not_found, message: finding not found } }
                notCve:
                  value: { error: { code: not_cve, message: "This finding has no CVE identifier, so there are no CVE details to show." } }

  /api/v1/findings/{id}/verify:
    post:
      tags: [Findings]
      operationId: verifyFix
      summary: Ask whether the finding is still present
      description: |
        Compares the finding against the latest **complete** scan of the same
        scope. Returns `still_present`, `inconclusive` when the newest evidence
        cannot vouch for completeness, or `verified_fixed`, which also moves the
        scan-derived state to `fixed` while leaving any analyst decision intact.
      x-auth: session
      security:
        - sessionAuth: []
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: The verdict.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/VerifyResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/findings/{id}/patch-preview:
    get:
      tags: [Previews]
      operationId: previewPatch
      summary: Plan a remediation patch
      description: |
        Plans a dependency bump without applying anything. Findings whose class
        has no mechanical fix return `supported: false` with a reason instead of
        a partial patch.
      x-required-scope: read
      security:
        - sessionAuth: []
        - apiKeyAuth: []
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: The plan or a refusal.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PatchPreview" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/ProjectAccessDenied" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/findings/{id}/notify-preview:
    get:
      tags: [Previews]
      operationId: previewNotification
      summary: Plan a tracker notification
      description: Plans the issue or message that would be created, without calling any tracker.
      x-required-scope: read
      security:
        - sessionAuth: []
        - apiKeyAuth: []
      parameters:
        - $ref: "#/components/parameters/Id"
        - name: channel
          in: query
          required: true
          description: "`issue` or `message`. Any other value is not an error: the response is a refusal with a reason."
          schema: { type: string, enum: [issue, message] }
        - name: target
          in: query
          required: true
          description: Integration and scope to notify, as `integration:scope`.
          schema: { type: string }
        - name: linked
          in: query
          description: Set when the finding is already linked, so the plan describes an update. A value that is not a boolean returns `invalid_linked`.
          schema: { type: boolean }
      responses:
        "200":
          description: The plan or a refusal.
          content:
            application/json:
