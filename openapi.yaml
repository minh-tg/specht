        "201":
          description: Granted.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProjectMember" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/v1/projects/{slug}/environments:
