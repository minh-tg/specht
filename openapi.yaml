      responses:
        "200":
          description: The signoff.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Signoff" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/projects/{slug}/gate:
    get:
      tags: [Gate]
      operationId: getGateStatus
      summary: Evaluate the deployment gate
      description: |
        With no `severity` parameter the project's effective policy supplies the
        floor. With `introduced_only` the verdict covers only the findings
        `report_id` introduced, so pre-existing debt on the long-lived branch
        never fails a pull request. A `report_id` that is missing and one that
        belongs to another project both answer 403 `project_access_denied`, so
        report ids cannot be probed. A malformed one answers 400 `invalid_id`.
        A report that is processing or failed answers 409 `report_not_completed`;
        it cannot supply a passing verdict.
      x-required-scope: read
      security:
        - sessionAuth: []
        - apiKeyAuth: []
      parameters:
        - $ref: "#/components/parameters/Slug"
        - name: severity
          in: query
          description: Overrides the policy floor. A list floors at its lowest-named severity.
          schema: { type: string, example: "high,critical" }
        - name: introduced_only
          in: query
          description: Scope the verdict to what one report introduced.
          schema: { type: boolean }
        - name: report_id
          in: query
          description: Required when `introduced_only` is set.
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: The verdict.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GateStatus" }
        "409":
          description: The report is not completed, so no verdict is available.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/projects/{slug}/pr-check:
    get:
      tags: [Gate]
      operationId: previewPRCheck
      summary: Plan the pull-request check
      description: |
        Returns the conclusion and annotations a provider check would publish,
        with no side effects — nothing is created, updated, or posted.
        A commit that no completed scan carries is refused with 404 rather than
        planned as a passing check. An explicit report that is processing or failed
        answers 409 `report_not_completed`. A `report_id` that is missing and one that
        belongs to another project both answer 403 `project_access_denied`, so
        report ids cannot be probed. A malformed one answers 400 `invalid_id`.
      x-required-scope: read
      security:
        - sessionAuth: []
        - apiKeyAuth: []
      parameters:
        - $ref: "#/components/parameters/Slug"
        - name: commit
          in: query
          required: true
          description: The commit under review.
          schema: { type: string }
        - name: provider
          in: query
          description: The CI provider whose annotation format to emit. Empty selects `github`, the only provider this build registers.
          schema: { type: string, enum: [github], default: github }
        - name: report_id
          in: query
          description: Ties the check to one exact scan; otherwise scoped by commit.
          schema: { type: string, format: uuid }
        - name: severity
          in: query
          description: Floor for the findings the check considers. Omitted, the project policy floor applies; a value can only tighten that floor.
          schema: { type: string }
      responses:
        "200":
          description: The plan.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PRCheckPreview" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/ProjectAccessDenied" }
        "404":
          description: No completed scan carries the commit, so there is no evidence to plan a check from. Scan the commit first.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              example: { error: { code: no_report_for_commit, message: no completed scan report carries this commit; scan it before requesting a check } }
        "409":
          description: The report is not completed, so no verdict is available.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /api/v1/policy-templates:
    get:
      tags: [Policy]
      operationId: listPolicyTemplates
      summary: List policy templates
      description: Any signed-in person can read the list, so a project admin can pick a template to link. Changing templates stays with global admins.
      x-auth: session
      security:
        - sessionAuth: []
      responses:
        "200":
          description: The templates.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/PolicyTemplate" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/SessionRequired" }
    post:
      tags: [Policy]
      operationId: createPolicyTemplate
      summary: Create a policy template
      description: |
        The definition is a flat string map. An unknown key or value is rejected
        with `400 invalid_policy` rather than being dropped, so a typo can never
        silently widen a floor. Redefining an existing name bumps its version.
      x-auth: session
      x-required-role: admin
      security:
        - sessionAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PolicyTemplateRequest" }
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PolicyTemplate" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/SessionRequired" }
        "409":
          description: A template with that name already exists.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              example: { error: { code: policy_conflict, message: policy template already exists } }

  /api/v1/policy-templates/{id}:
    put:
      tags: [Policy]
      operationId: updatePolicyTemplate
      summary: Redefine a policy template
      description: Bumps the template's version.
      x-auth: session
      x-required-role: admin
      security:
        - sessionAuth: []
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PolicyTemplateRequest" }
      responses:
        "200":
          description: Updated.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PolicyTemplate" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/SessionRequired" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: The new name collides with another template.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
    delete:
      tags: [Policy]
      operationId: deletePolicyTemplate
      summary: Delete a policy template
      description: Projects linked to it fall back to their overrides and then the default.
      x-auth: session
      x-required-role: admin
      security:
        - sessionAuth: []
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "204": { $ref: "#/components/responses/NoContent" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/SessionRequired" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/projects/{slug}/policy:
    get:
      tags: [Policy]
      operationId: getEffectivePolicy
      summary: Read the effective policy
      description: Returns the resolved policy plus which layer supplied each value.
      x-required-scope: read
      security:
        - sessionAuth: []
        - apiKeyAuth: []
      parameters:
        - $ref: "#/components/parameters/Slug"
      responses:
        "200":
          description: The effective policy.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PolicyEffective" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/ProjectAccessDenied" }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      tags: [Policy]
      operationId: setProjectPolicy
      summary: Link a policy template
      description: Precedence is override > template > default.
      x-auth: session
      security:
        - sessionAuth: []
      parameters:
        - $ref: "#/components/parameters/Slug"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SetPolicyRequest" }
      responses:
        "200":
          description: The resulting effective policy.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PolicyEffective" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/projects/{slug}/policy/overrides:
    put:
      tags: [Policy]
      operationId: setProjectPolicyOverrides
      summary: Set per-project overrides
      description: Overrides win over the linked template. An invalid key or value is rejected.
      x-auth: session
      security:
        - sessionAuth: []
      parameters:
        - $ref: "#/components/parameters/Slug"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SetPolicyOverridesRequest" }
      responses:
        "200":
          description: The resulting effective policy.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PolicyEffective" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/v1/projects/{slug}/waivers:
    get:
      tags: [Waivers]
      operationId: listWaivers
      summary: List a project's waivers
      description: |
        Newest first, including pending requests. Only approved waivers count in the gate.
        Each waiver carries its conditions, contexts and finding targets, so a screen can
        tell which findings a pending request covers without reading each waiver.
      x-required-scope: read
      security:
        - sessionAuth: []
        - apiKeyAuth: []
      parameters:
        - $ref: "#/components/parameters/Slug"
        - name: status
          in: query
          required: false
          description: Comma-separated review states to keep. Omit for all.
          schema:
            type: string
            example: pending,rejected
      responses:
        "200":
          description: The waivers.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Waiver" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    post:
      tags: [Waivers]
      operationId: createWaiver
      summary: Create a waiver
      description: |
        A waiver suppresses the findings it targets, or the findings its
        conditions match, until it expires or is disabled. An expiry sweep
        disables it automatically and records why.

        The caller needs the project manager or admin role. The waiver is
        approved on creation. It must say what it covers: at least one
        condition, context or target, or `scope: "all"` with none of those.
        To ask for a waiver without that role, use `POST /waivers/requests`.

        Every finding, environment, target and artifact id must belong to the
        project. An id that is missing and an id of another project both answer
        404, and a malformed id answers 400. A context names at least one of
        `environment_id`, `target_id` and `artifact_id`.
      x-auth: session
      security:
        - sessionAuth: []
      parameters:
        - $ref: "#/components/parameters/Slug"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateWaiverRequest" }
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Waiver" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/InternalError" }

  /api/v1/projects/{slug}/waivers/requests:
    post:
      tags: [Waivers]
      operationId: requestWaiver
      summary: Ask for a waiver
      description: |
        Files a pending request to waive specific findings. Any project member
        can ask; the caller must be a signed-in person, not an API key. The
        request does not change the gate until a project manager or admin
        approves it. A request needs a reason, an expiry no more than 90 days
        away, and at least one finding of this project. A second pending
        request for the same finding is refused.
      x-required-scope: read
      x-auth: session
      security:
        - sessionAuth: []
      parameters:
        - $ref: "#/components/parameters/Slug"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RequestWaiverRequest" }
      responses:
        "201":
          description: The pending request.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Waiver" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "500": { $ref: "#/components/responses/InternalError" }

  /api/v1/projects/{slug}/waivers/{id}/approve:
    post:
      tags: [Waivers]
      operationId: approveWaiver
      summary: Approve a waiver request
      description: |
        Moves a pending request to approved, after which it counts in the gate.
        Needs the project manager or admin role. The requester cannot approve
        their own request, except a global admin, whose approval is marked
        `self_approved` in the audit event. An expired request cannot be
        approved.
      x-auth: session
      security:
        - sessionAuth: []
      parameters:
        - $ref: "#/components/parameters/Slug"
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: "#/components/schemas/WaiverDecisionRequest" }
      responses:
        "200":
          description: The approved waiver.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Waiver" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /api/v1/projects/{slug}/waivers/{id}/reject:
    post:
      tags: [Waivers]
      operationId: rejectWaiver
      summary: Reject a waiver request
      description: Moves a pending request to rejected. Needs the project manager or admin role and a note that tells the requester why.
      x-auth: session
      security:
        - sessionAuth: []
      parameters:
        - $ref: "#/components/parameters/Slug"
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/WaiverRejectRequest" }
      responses:
        "200":
          description: The rejected waiver.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Waiver" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /api/v1/projects/{slug}/waivers/{id}/withdraw:
    post:
      tags: [Waivers]
      operationId: withdrawWaiver
      summary: Withdraw a waiver request
      description: The requester takes back a pending request. Nobody else can withdraw it.
      x-auth: session
      security:
        - sessionAuth: []
      parameters:
        - $ref: "#/components/parameters/Slug"
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: The withdrawn waiver.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Waiver" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /api/v1/projects/{slug}/waivers/{id}:
    get:
      tags: [Waivers]
      operationId: getWaiver
      summary: Read a waiver
      x-required-scope: read
      security:
        - sessionAuth: []
        - apiKeyAuth: []
      parameters:
        - $ref: "#/components/parameters/Slug"
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: The waiver with its conditions, contexts, and finding targets.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Waiver" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      tags: [Waivers]
      operationId: updateWaiver
      summary: Update a waiver
      description: |
        `expires_at` is a tri-state: omitting it keeps the stored expiry, `""`
        clears it, and an RFC 3339 value sets it.

        Scope ids follow the same rules as on create: an id outside the project
        answers 404, whether it is missing or belongs to another project.
      x-auth: session
      security:
        - sessionAuth: []
      parameters:
        - $ref: "#/components/parameters/Slug"
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateWaiverRequest" }
      responses:
        "200":
          description: Updated.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Waiver" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      tags: [Waivers]
      operationId: deleteWaiver
      summary: Delete a waiver
      description: The gate re-blocks the findings it was suppressing.
      x-auth: session
      security:
        - sessionAuth: []
      parameters:
        - $ref: "#/components/parameters/Slug"
        - $ref: "#/components/parameters/Id"
      responses:
        "204": { $ref: "#/components/responses/NoContent" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/projects/{slug}/waivers/{id}/toggle:
    post:
      tags: [Waivers]
      operationId: toggleWaiver
      deprecated: true
      summary: Enable or disable a waiver (deprecated)
      description: |
        Disables an active waiver, or re-enables a disabled one, without deleting it.
        The flip is blind: two callers can undo each other. Use `revoke` and `restore`,
        which name the wanted state. Only an approved waiver flips (`waiver_not_approved`),
        and a disabled waiver whose expiry has passed stays off (`waiver_expired`).
      x-auth: session
      security:
        - sessionAuth: []
      parameters:
        - $ref: "#/components/parameters/Slug"
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: The waiver in its new state.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Waiver" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/WaiverSwitchConflict" }

  /api/v1/projects/{slug}/waivers/{id}/revoke:
    post:
      tags: [Waivers]
      operationId: revokeWaiver
      summary: Revoke an approved waiver
      description: |
        Switches an approved waiver off, so it stops counting in the gate. The call names
        the wanted state: revoking a waiver that is already off returns it unchanged and
        adds no history entry. A `revoked` event records who did it and when, and the audit
        log gets `waiver.revoke`. Needs the project manager or admin role.

        Send `expected_updated_at` with the `updated_at` you last saw to make the call
        conditional. A waiver written since then answers `waiver_changed`.
      x-auth: session
      security:
        - sessionAuth: []
      parameters:
        - $ref: "#/components/parameters/Slug"
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: "#/components/schemas/WaiverSwitchRequest" }
      responses:
        "200":
          description: The waiver, switched off.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Waiver" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/WaiverSwitchConflict" }

  /api/v1/projects/{slug}/waivers/{id}/restore:
    post:
      tags: [Waivers]
      operationId: restoreWaiver
      summary: Restore a revoked waiver
      description: |
        Switches a revoked waiver back on, so it counts in the gate again. Restoring a
        waiver that is already on returns it unchanged and adds no history entry. A
        `restored` event records who did it and when, and the audit log gets
        `waiver.restore`. Needs the project manager or admin role.

        A waiver whose expiry has passed cannot be restored (`waiver_expired`); extend its
        expiry first. `expected_updated_at` works as it does for `revoke`.
      x-auth: session
      security:
        - sessionAuth: []
      parameters:
        - $ref: "#/components/parameters/Slug"
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: "#/components/schemas/WaiverSwitchRequest" }
      responses:
        "200":
          description: The waiver, switched on.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Waiver" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/WaiverSwitchConflict" }

  /api/v1/projects/{slug}/waivers/{id}/events:
    get:
      tags: [Waivers]
      operationId: listWaiverEvents
      summary: Read a waiver's audit trail
      description: "`created`, `updated`, `revoked`, `restored`, `enabled`, `disabled`, and `auto_disabled` events. `enabled` and `disabled` come from the deprecated toggle."
      x-required-scope: read
      security:
        - sessionAuth: []
        - apiKeyAuth: []
      parameters:
        - $ref: "#/components/parameters/Slug"
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: The events.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/WaiverEvent" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/v1/projects/{slug}/waivers/check-match:
    post:
      tags: [Waivers]
      operationId: checkWaiverMatch
      summary: Would an active waiver suppress this finding?
      description: |
        Evaluates the project's active waivers against one finding — the same
        live check the gate performs, exposed for pipeline diagnostics.
      x-required-scope: read
      security:
        - sessionAuth: []
        - apiKeyAuth: []
      parameters:
        - $ref: "#/components/parameters/Slug"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CheckMatchRequest" }
      responses:
        "200":
          description: The answer.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CheckMatchResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/ProjectAccessDenied" }
        "500": { $ref: "#/components/responses/InternalError" }

  /api/v1/teams:
    get:
      tags: [Teams]
      operationId: listTeams
      summary: List teams
      description: >-
        Returns the teams the caller belongs to and the teams linked to a
        project the caller can reach, directly or through a team. A team linked
        only to projects the caller cannot reach is left out, so one tenant's
        team names are not visible to another. Global admins see every team. An
        account with no project and no team gets an empty list.
      x-auth: session
      security:
        - sessionAuth: []
      responses:
        "200":
          description: The teams.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Team" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/SessionRequired" }
    post:
      tags: [Teams]
      operationId: createTeam
      summary: Create a team
      description: Company-wide teams can only be created by global administrators.
      x-required-role: admin
      security:
        - sessionAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateTeamRequest" }
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Team" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409":
          description: A team with that name already exists.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              example: { error: { code: team_conflict, message: team already exists } }

  /api/v1/teams/{id}:
    delete:
      tags: [Teams]
      operationId: deleteTeam
      summary: Delete a team
      description: Deleting a team revokes every access its project links conferred.
      x-auth: session
      x-required-role: admin
      security:
        - sessionAuth: []
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "204": { $ref: "#/components/responses/NoContent" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/SessionRequired" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/teams/{id}/members:
    get:
      tags: [Teams]
      operationId: listTeamMembers
      summary: List a team's roster
      description: |
        A signed-in account can read the roster of a team it can see: one it
        belongs to, or one linked to a project it can reach (see `listTeams`).
        A team it cannot see answers `404 not_found`, exactly like a team that
        does not exist, so team ids cannot be probed. Global admins see every
        team. Every member carries a `display_name` (omitted when the person
        never set one). `user_email` is returned only to global admins and to
        admins of this team. A project-scoped API key is refused with 403.
      x-auth: session
      security:
        - sessionAuth: []
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: The roster, sorted by display name, then email.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/TeamMember" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    post:
      tags: [Teams]
      operationId: addTeamMember
      summary: Add or re-role a team member
      description: >-
        Needs team admin or global admin. A caller who cannot see the team gets
        `404 not_found`, the answer for a team that does not exist; a caller who
        can see it but does not administer it gets 403.
      x-auth: session
      security:
        - sessionAuth: []
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MemberGrantRequest" }
      responses:
        "201":
          description: Added.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TeamMember" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/teams/{id}/members/{userID}:
    delete:
      tags: [Teams]
      operationId: removeTeamMember
      summary: Remove a team member
      description: >-
        Needs team admin or global admin. A caller who cannot see the team gets
        `404 not_found`, the answer for a team that does not exist; a caller who
        can see it but does not administer it gets 403.
      x-auth: session
      security:
        - sessionAuth: []
      parameters:
        - $ref: "#/components/parameters/Id"
        - name: userID
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "204": { $ref: "#/components/responses/NoContent" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/projects/{slug}/teams:
    get:
      tags: [Teams]
      operationId: listProjectTeams
      summary: List a project's team links
      x-required-scope: read
      security:
        - sessionAuth: []
        - apiKeyAuth: []
      parameters:
        - $ref: "#/components/parameters/Slug"
      responses:
        "200":
          description: The links.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ProjectTeam" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    post:
      tags: [Teams]
      operationId: linkProjectTeam
      summary: Link a team to a project
      description: >-
        Confers the team's membership as project access for as long as the link
        lasts. Linking at manager or admin needs a direct project role at or
        above the linked role; a caller whose rank comes only from a team link
        may link at member level.
      x-auth: session
      security:
        - sessionAuth: []
      parameters:
        - $ref: "#/components/parameters/Slug"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AddMemberRequest" }
      responses:
        "201":
          description: Linked.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProjectTeam" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/projects/{slug}/teams/{teamID}:
    delete:
      tags: [Teams]
      operationId: unlinkProjectTeam
      summary: Unlink a team from a project
      x-auth: session
      security:
        - sessionAuth: []
      parameters:
        - $ref: "#/components/parameters/Slug"
        - name: teamID
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "204": { $ref: "#/components/responses/NoContent" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/v1/projects/{slug}/members:
    get:
      tags: [Project members]
      operationId: listProjectMembers
      summary: List direct project grants
      x-required-scope: read
      security:
        - sessionAuth: []
        - apiKeyAuth: []
      parameters:
        - $ref: "#/components/parameters/Slug"
      responses:
        "200":
          description: The grants.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ProjectMember" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    post:
      tags: [Project members]
      operationId: addProjectMember
      summary: Grant a user access
      description: >-
        Re-granting an existing member updates their role. A malformed
        `user_id` is `400 invalid_id`, a role outside the project vocabulary is
        `400 invalid_role`, demoting the only project admin is `400 last_admin`,
        and a user that does not exist is `404 user_not_found`. Granting
        manager or admin needs a direct project role at or above the role
        granted: a rank that comes only from a team link is `403` for those
        roles, because the grant would outlive the link. Granting member
        follows the caller's effective role.
      x-auth: session
      security:
        - sessionAuth: []
      parameters:
        - $ref: "#/components/parameters/Slug"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MemberGrantRequest" }
      responses:
        "201":
          description: Granted.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProjectMember" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/InternalError" }

  /api/v1/projects/{slug}/member-suggestions:
    get:
      tags: [Project members]
      operationId: suggestProjectMembers
      summary: Suggest people to add as direct members
      description: >-
        Autocomplete for adding a direct project member. Matches active
        accounts whose email starts with `q`, or whose display name has a word
        (after a space, or at the start) that starts with `q`, ignoring case.
        `%`, `_` and `\` in `q` match only themselves. Returns at most 8 people,
        ordered by email, and leaves out disabled accounts, the system account
        and people who are already direct members of the project.

        `q` is trimmed. A missing `q`, or one under 3 characters, returns
        `200 []`. A `q` over 64 characters, or one that is not valid UTF-8 or
        contains a control character, is `400 invalid_query`. Needs the project
        manager role or above and a session: a project API key is `403
        insufficient_role` from the session check, and a session below manager
        is `403 project_access_denied`. A missing project is `404` only for an
        instance admin; everyone else gets `403 project_access_denied`. The
        answer is always `[]` while anyone could hold an account under a name
        they chose: while open self-registration is enabled
        (`registration.enabled` in `/api/v1/capabilities`), and while SSO is on
        with `SSO_ALLOW_UNVERIFIED_EMAIL=true`.

        Rate limited per user to 30 requests a minute with a burst of 10, on
        every deployment, whether or not the general rate limit is enabled.
        Over the limit is `429` with `Retry-After`.
      security:
        - sessionAuth: []
      parameters:
        - $ref: "#/components/parameters/Slug"
        - name: q
          in: query
          required: false
          description: Start of an email address or of a display-name word. Missing is the same as empty.
          schema: { type: string, maxLength: 64 }
      responses:
        "200":
          description: The suggested people, possibly none.
          content:
            application/json:
              schema:
                type: array
                maxItems: 8
                items: { $ref: "#/components/schemas/MemberSuggestion" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/ProjectAccessDenied" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "500": { $ref: "#/components/responses/InternalError" }

  /api/v1/projects/{slug}/members/{userID}:
    delete:
      tags: [Project members]
      operationId: removeProjectMember
      summary: Remove a project member
      description: Revokes direct membership. Managers may remove members; removing admins requires project admin authority. The last project admin cannot be removed.
      x-auth: session
      security:
        - sessionAuth: []
      parameters:
        - $ref: "#/components/parameters/Slug"
        - name: userID
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "204": { $ref: "#/components/responses/NoContent" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/InternalError" }

  /api/v1/projects/{slug}/invites:
    get:
      tags: [Invites]
      operationId: listInvites
      summary: List a project's open invite links
      description: >-
        Links that are not used, revoked or expired, newest first. The token is
        never shown again after creation, so the entries carry no `link`.
        Needs the project manager role or above, and a session (API keys are refused).
      security:
        - sessionAuth: []
      parameters:
        - $ref: "#/components/parameters/Slug"
      responses:
        "200":
          description: The open invites.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Invite" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    post:
      tags: [Invites]
      operationId: createInvite
      summary: Create an invite link
      description: >-
        Returns the link once, with `Cache-Control: no-store`. Only a hash of the
        token is stored. The invited role is `member` or `manager` and cannot
        exceed the caller's own project role, the same ceiling as adding a member
        directly. A `manager` invite needs a direct project role of manager or
        above; a caller whose rank comes only from a team link may invite at
        member level. `expires_in_days` is 1 to 30 and defaults to 7. With `email`
        set, only that address can accept. A project holds at most 100 open
        links (`409 too_many_invites`). Needs the project manager role or above.
        No email is sent: pass the link on yourself.
      security:
        - sessionAuth: []
      parameters:
        - $ref: "#/components/parameters/Slug"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateInviteRequest" }
      responses:
        "201":
          description: Created. `link` is a path on this server, `/invite/<token>`.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Invite" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /api/v1/projects/{slug}/invites/{id}:
    delete:
      tags: [Invites]
      operationId: revokeInvite
      summary: Revoke an invite link
      description: A manager cannot revoke a link that carries a role above their own.
      security:
        - sessionAuth: []
      parameters:
        - $ref: "#/components/parameters/Slug"
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "204": { $ref: "#/components/responses/NoContent" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/invites/{token}:
    get:
      tags: [Invites]
      operationId: lookupInvite
      summary: See what an invite link is for
      description: >-
        Public, for the accept page. Returns only the project name, the role and
        the address the invite is bound to. A link that is unknown, used, revoked
        or expired answers the same `404`, so this cannot be used to probe.
        Shares the credential rate limit.
      security: []
      parameters:
        - $ref: "#/components/parameters/InviteToken"
      responses:
        "200":
          description: The invite.
          headers:
            Cache-Control:
              description: no-store
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/InviteLookup" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /api/v1/invites/{token}/accept:
    post:
      tags: [Invites]
      operationId: acceptInvite
      summary: Create an account through an invite link
      description: >-
        Public, and it works while self-service registration is closed. Creates
        the account (global role `member`), adds it to the project with the
        invited role, marks the link used and signs the account in, all in one
        transaction. A failed attempt leaves the link usable. If the invite is
        bound to an address, a different one is `403 invite_email_mismatch`. An
        address that already has an account answers `422 registration_failed`,
        the same as registration, so the link cannot reveal who is registered.
        People who already have an account use `/join`.

        Password rules: at least 8 characters and at most 72 bytes of UTF-8 (some characters, such as emoji, take more than one), at least one visible character, and not on a list of about 2,000 commonly used passwords (`400 password_too_common`). It must also differ from the account's email address, the part before the @, and its display name (`400 password_matches_account`).
        The password is judged before the link is spent. An address with a
        character the reader cannot see answers `400 invalid_email_characters`,
        and the link stays usable.
      security: []
      parameters:
        - $ref: "#/components/parameters/InviteToken"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AcceptInviteRequest" }
      responses:
        "201":
          description: Account created and signed in.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AcceptInviteResponse" }
        "400":
          description: The request is malformed, the password is refused (`password_too_common`, `password_matches_account`), or the address holds a character the reader cannot see (`invalid_email_characters`).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "413": { $ref: "#/components/responses/BodyTooLarge" }
        "422":
          description: Registration failed (generic).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              example: { error: { code: registration_failed, message: registration failed } }
        "429": { $ref: "#/components/responses/RateLimited" }

  /api/v1/invites/{token}/join:
    post:
      tags: [Invites]
      operationId: joinInvite
      summary: Join a project with the signed-in account
      description: >-
        For a person who already has an account. Adds the caller to the project
        with the invited role and marks the link used. A stronger role the
        caller already holds in the project is kept. API keys are refused.
      security:
        - sessionAuth: []
      parameters:
        - $ref: "#/components/parameters/InviteToken"
      responses:
        "200":
          description: Joined.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/JoinInviteResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/projects/{slug}/watcher:
    get:
      tags: [Watcher]
      operationId: getProjectWatcher
      summary: Read a project's CVE watcher settings and status
      description: |
        The project's own switch and interval, the range the server accepts,
        and what they amount to: `effective_enabled` is false when the server
        does not run the watcher, and `status` says in one word why the
        project is or is not being polled (`disabled`, `server_off`,
        `waiting`, `ok`, `stale`, `failing`). Any project member can read it.
      x-required-scope: read
      security:
        - sessionAuth: []
        - apiKeyAuth: []
      parameters:
        - $ref: "#/components/parameters/Slug"
      responses:
        "200":
          description: The settings and status.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProjectWatcher" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      tags: [Watcher]
      operationId: updateProjectWatcher
      summary: Change a project's CVE watcher settings
      description: |
        Send `enabled`, `interval_seconds`, or both; a field you leave out
        stays as it is, and `interval_seconds: null` returns the interval to
        its default. The interval must lie between `min_interval_seconds`
        (the server's polling cadence, never above the default of one hour)
        and seven days. Switching a project on while the server has the
        watcher off is allowed and stored; the response shows
        `effective_enabled: false` until the server runs it. The daemon picks
        the change up at its next cycle, without a restart. Needs the project
        admin role and a session (API keys are refused).
      security:
        - sessionAuth: []
      parameters:
        - $ref: "#/components/parameters/Slug"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ProjectWatcherUpdate" }
      responses:
        "200":
          description: The settings after the change.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProjectWatcher" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/projects/{slug}/environments:
    get:
      tags: [Context]
      operationId: listEnvironments
      summary: List environments
      description: Materialized from ingest-supplied context.
      x-required-scope: read
      security:
        - sessionAuth: []
        - apiKeyAuth: []
      parameters:
        - $ref: "#/components/parameters/Slug"
      responses:
        "200":
          description: The environments.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Environment" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "500": { $ref: "#/components/responses/InternalError" }

  /api/v1/projects/{slug}/environments/{id}:
    put:
      tags: [Context]
      operationId: updateEnvironment
      summary: Classify an environment
      description: |
        Sets the tier, internet exposure and data sensitivity of an environment
        that a scan created. A scan names an environment and Specht creates it
        with defaults; later scans never overwrite what is set here. Requires a
        project admin or a global admin, and works for a signed-in person only.
      x-auth: session
      security:
        - sessionAuth: []
      parameters:
        - $ref: "#/components/parameters/Slug"
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EnvironmentUpdateRequest" }
      responses:
        "200":
          description: The environment as stored.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Environment" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/ProjectAccessDenied" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/InternalError" }

  /api/v1/projects/{slug}/targets:
    get:
      tags: [Context]
      operationId: listTargets
      summary: List scan targets
      description: Repositories, images, and other scanned subjects, with their owner when known.
      x-required-scope: read
      security:
        - sessionAuth: []
        - apiKeyAuth: []
      parameters:
        - $ref: "#/components/parameters/Slug"
      responses:
        "200":
          description: The targets.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Target" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/v1/projects/{slug}/artifacts:
    get:
      tags: [Context]
      operationId: listArtifacts
      summary: List build artifacts
      description: Container images, SBOMs, and other artifacts seen by scans.
      x-required-scope: read
      security:
        - sessionAuth: []
        - apiKeyAuth: []
      parameters:
        - $ref: "#/components/parameters/Slug"
      responses:
        "200":
          description: The artifacts.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Artifact" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "500": { $ref: "#/components/responses/InternalError" }

  /api/v1/projects/{slug}/stats:
    get:
      tags: [Insights]
      operationId: getProjectStats
      summary: Read the project roll-up
      description: |
        Counts findings by severity, with the blocking subset, and open or
        reopened findings by analysis state, plus waiver and report totals and
        the newest report.
      x-required-scope: read
      security:
        - sessionAuth: []
        - apiKeyAuth: []
      parameters:
        - $ref: "#/components/parameters/Slug"
      responses:
        "200":
          description: The roll-up.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProjectStats" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/ProjectAccessDenied" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/InternalError" }

  /api/v1/projects/{slug}/aging:
    get:
      tags: [Insights]
      operationId: getAging
      summary: Read the aging and SLA snapshot
      description: |
        Buckets open findings by age (`new` under 7 days, `aging` under 30,
        `stale` under 90, `debt` beyond), reports which have passed their
        severity's SLA, and trends new findings over the trailing twelve weeks.
        Closed findings (fixed) take no part in the buckets.

        The SLA table is critical 7 days, high 30, medium 90, low 180, unknown
        90. Only open and reopened findings can be overdue.
      x-required-scope: read
      security:
        - sessionAuth: []
        - apiKeyAuth: []
      parameters:
        - $ref: "#/components/parameters/Slug"
      responses:
        "200":
          description: The snapshot.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AgingResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/ProjectAccessDenied" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/InternalError" }

  /api/v1/admin/status:
    get:
      tags: [Admin]
      operationId: getAdminStatus
      summary: Read the platform snapshot
      x-auth: session
      x-required-role: admin
      security:
        - sessionAuth: []
      responses:
        "200":
          description: The snapshot.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminStatus" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/SessionRequired" }

  /api/v1/admin/retention/preview:
    get:
      tags: [Admin]
      operationId: previewRetention
      summary: Preview a retention purge
      description: Reports how many settled reports fall outside the window, deleting nothing.
      x-auth: session
      x-required-role: admin
      security:
        - sessionAuth: []
      parameters:
        - name: days
          in: query
          required: true
          description: Retention window in days, 1–3650.
          schema: { type: integer, minimum: 1, maximum: 3650 }
      responses:
        "200":
          description: The preview.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RetentionPreview" }
        "400":
          description: The window is missing or out of range.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              example: { error: { code: invalid_window, message: days must be between 1 and 3650 } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/SessionRequired" }

  /api/v1/admin/retention/purge:
    post:
      tags: [Admin]
      operationId: purgeRetention
      summary: Purge reports outside the window
      description: Deletes settled reports past the window. Findings survive their reports.
      x-auth: session
      x-required-role: admin
      security:
        - sessionAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PurgeRetentionRequest" }
      responses:
        "200":
          description: The result.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RetentionResult" }
        "400":
          description: The window is out of range.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              example: { error: { code: invalid_window, message: older_than_days must be between 1 and 3650 } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/SessionRequired" }
        "500": { $ref: "#/components/responses/InternalError" }

  /api/v1/watcher/status:
    get:
      tags: [Watcher]
      operationId: getWatcherStatus
      summary: Read the CVE watcher's health
      description: |
        Daemon-wide state, so it is session-admin only — a project key is
        refused. Reports the last successful and attempted polls, the last
        error, consecutive failures, and whether the watermark is stale.
      x-auth: session
      x-required-role: admin
      security:
        - sessionAuth: []
      responses:
        "200":
          description: The health snapshot.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WatcherStatus" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/SessionRequired" }
        "500": { $ref: "#/components/responses/InternalError" }

components:
  securitySchemes:
    sessionAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        Session JWT from `/auth/login`, `/auth/refresh`, or the SSO callback.
        Carries a role: `admin`, `manager`, or `member`. Rejected on routes
        marked `x-auth: session` only when the credential is actually an API
        key — a session is always accepted there.
    apiKeyAuth:
      type: http
      scheme: bearer
      description: |
        Project-scoped API key from `/auth/apikeys`, always prefixed `vuln_`.
        Carries the scopes `ingest` and `read` (the API mints no other scope, and
        a key stored with any other scope is refused with 401), and is bound to one
        project, so it can never read another. Routes marked `x-auth: session`
        refuse it outright.

  parameters:
    Slug:
      name: slug
      in: path
      required: true
      description: Project slug. Chosen by the caller and unique across the platform; lowercase with hyphens is the convention, but the server only requires it to be non-empty.
      schema: { type: string, example: my-app }
    InviteToken:
      name: token
      in: path
      required: true
      description: The token from an invite link, the part after `/invite/`.
      schema: { type: string }
    Id:
      name: id
      in: path
      required: true
      description: Resource identifier.
      schema: { type: string, format: uuid }
    FindingID:
      name: findingID
      in: path
      required: true
      description: Finding identifier.
      schema: { type: string, format: uuid }
    Limit:
      name: limit
      in: query
      description: Page size. Default 20, maximum 500. A malformed, negative, or oversized value falls back to the default.
      schema: { type: integer, minimum: 0, maximum: 500, default: 20 }
    Offset:
      name: offset
      in: query
      description: Items to skip. A malformed, negative, or out-of-range value falls back to 0.
      schema: { type: integer, minimum: 0, maximum: 2147483647, default: 0 }

  responses:
    NoContent:
      description: Done; no body.
    BadRequest:
      description: The request body or parameters were rejected.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          examples:
            invalidJson:
              value: { error: { code: invalid_json, message: invalid request body } }
            missingField:
              value: { error: { code: missing_field, message: name and slug are required } }
            invalidId:
              value: { error: { code: invalid_id, message: invalid finding id format } }
    Unauthorized:
      description: Missing or invalid credential.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          examples:
            missingToken:
              value: { error: { code: missing_token, message: authorization header required } }
            invalidToken:
              value: { error: { code: invalid_token, message: invalid or expired token } }
    Forbidden:
      description: Authenticated but not allowed.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          examples:
            insufficientRole:
              value: { error: { code: insufficient_role, message: requires admin role } }
            insufficientScope:
              value: { error: { code: insufficient_scope, message: API key does not have the required scope for this route } }
    SessionRequired:
      description: This route needs an authenticated session; project API keys are refused.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          example: { error: { code: insufficient_role, message: session authentication required } }
    ProjectAccessDenied:
      description: |
        The caller is not a member of the project, or the key is bound to another one.
        The message depends on the credential: a project key is told it does not have
        access to this project; a signed-in user gets "project not found or you do not
        have access", which does not reveal whether the project exists.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          example: { error: { code: project_access_denied, message: project access denied } }
    NotFound:
      description: The resource does not exist, or is not visible to the caller.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          example: { error: { code: not_found, message: not found } }
    Conflict:
      description: The request conflicts with the current state of the resource.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          example: { error: { code: waiver_not_pending, message: waiver is not pending } }
    WaiverSwitchConflict:
      description: |
        The waiver cannot be switched as asked: `waiver_changed` (it was written after
        `expected_updated_at`), `waiver_expired` (its expiry has passed, so it cannot be
        switched on) or `waiver_not_approved` (only an approved waiver can be revoked or
        restored).
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          example: { error: { code: waiver_changed, message: the waiver changed since you loaded it } }
    BodyTooLarge:
      description: The request body exceeded the size cap.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          example: { error: { code: body_too_large, message: request body too large } }
    RateLimited:
      description: Too many requests from this address; retry later.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          example: { error: { code: rate_limited, message: "rate limit exceeded, retry later" } }
    Unprocessable:
      description: The request was understood but rejected on a domain rule.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          examples:
            reasonRequired:
              value: { error: { code: reason_required, message: reason is required for this analysis state } }
            expiryRequired:
              value: { error: { code: expiry_required, message: expiry is required for accepted_risk and wont_fix } }
            invalidState:
              value: { error: { code: invalid_state, message: invalid analysis state } }
    InternalError:
      description: Unexpected server error.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          example: { error: { code: internal_error, message: internal server error } }

  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              description: Stable machine-readable code; branch on this, not on `message`.
              example: not_found
            message: { type: string, example: project not found }

    Health:
      type: object
      required: [status, version, commit]
      properties:
        status: { type: string, example: ok }
        version: { type: string, example: 1.0.0 }
        commit: { type: string, example: 54b60df }

    Ready:
      type: object
      required: [status]
      properties:
        status: { type: string, enum: [ready, unavailable] }

    Version:
      type: object
      required: [version, commit]
      properties:
        version: { type: string }
        commit: { type: string }

    Capabilities:
      type: object
      required: [registration, sso, setup, version, commit]
      properties:
        setup:
          type: object
          required: [required]
          properties:
            required:
              type: boolean
              description: True while the server has no global admin and waits for its first administrator. The client shows the setup screen instead of sign-in.
        registration:
          type: object
          required: [enabled]
          properties:
            enabled: { type: boolean, description: False when self-service registration answers 403. }
        sso:
          type: object
          required: [enabled]
          properties:
            enabled: { type: boolean }
            login_path:
              type: string
              description: Where the browser goes to start SSO. Present only when SSO is enabled.
              example: /api/v1/auth/sso/login
        version: { type: string }
        commit: { type: string }

    SetupRequest:
      type: object
      required: [token, email, password]
      properties:
        token: { type: string, description: The setup token from the server log or `SETUP_TOKEN`. }
        email: { type: string, format: email, maxLength: 254 }
        password: { type: string, format: password, minLength: 8, maxLength: 72 }
        display_name: { type: string, maxLength: 100, description: At most 100 characters after trimming. }

    Invite:
      type: object
      required: [id, role, created_at, expires_at]
      properties:
        id: { type: string, format: uuid }
        role: { type: string, enum: [member, manager] }
        email:
          type: string
          format: email
          description: Present when the invite is bound to an address.
        created_by:
          type: string
          description: Email of the person who made the link. Present in listings.
        created_at: { type: string, format: date-time }
        expires_at: { type: string, format: date-time }
        link:
          type: string
          description: Path to open on this server, `/invite/<token>`. Present only in the response to creation.
          example: /invite/q3Zk0wY1b8Vn4hPq6m1xT0o2u5rA7sLdC9eFgHiJkLm

    CreateInviteRequest:
      type: object
      required: [role]
      properties:
        role: { type: string, enum: [member, manager] }
        email: { type: string, format: email, maxLength: 254, description: Bind the link to one address. }
        expires_in_days: { type: integer, minimum: 1, maximum: 30, default: 7 }

    InviteLookup:
      type: object
      required: [project_name, role]
      properties:
        project_name: { type: string }
        role: { type: string, enum: [member, manager] }
        email: { type: string, format: email, description: Present when the invite is bound to an address. }

    AcceptInviteRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email, maxLength: 254 }
        password: { type: string, format: password, minLength: 8, maxLength: 72 }
        display_name: { type: string, maxLength: 100, description: At most 100 characters after trimming. }

    AcceptInviteResponse:
      allOf:
        - $ref: "#/components/schemas/AuthResponse"
        - type: object
          required: [project_slug, role]
          properties:
            project_slug: { type: string }
            role: { type: string, enum: [member, manager, admin] }

    JoinInviteResponse:
      type: object
      required: [project_slug, role]
      properties:
        project_slug: { type: string }
        role: { type: string, enum: [member, manager, admin], description: The role held now; a stronger existing role is kept. }

    ProjectWatcher:
      type: object
      required: [enabled, interval_seconds, default_interval_seconds, min_interval_seconds, max_interval_seconds, server_enabled, effective_enabled, effective_interval_seconds, status, healthy]
      properties:
        enabled: { type: boolean, description: The project's own switch. }
        interval_seconds: { type: integer, description: The project's own polling interval. }
        default_interval_seconds: { type: integer, description: What a reset returns the interval to. }
        min_interval_seconds: { type: integer, description: The shortest interval the server accepts. }
        max_interval_seconds: { type: integer, description: The longest interval the server accepts, seven days. }
        server_enabled: { type: boolean, description: Whether the server runs the watcher at all. }
        effective_enabled: { type: boolean, description: "`enabled` and `server_enabled`: whether the project is polled." }
        effective_interval_seconds: { type: integer }
        last_poll_at:
          type: string
          format: date-time
          description: When the project's last poll finished. Absent before the first.
        status:
          type: string
          enum: [disabled, server_off, waiting, ok, stale, failing]
          description: >-
            `disabled` the project's switch is off; `server_off` the server does not
            run the watcher; `waiting` on, no poll has finished yet; `ok`; `stale` the
            last poll is older than the interval explains; `failing` the watcher's
            recent polls are failing.
        healthy: { type: boolean, description: False when the status is `stale` or `failing`. }

    ProjectWatcherUpdate:
      type: object
      additionalProperties: false
      properties:
        enabled: { type: boolean }
        interval_seconds:
          type: [integer, "null"]
          description: Seconds between polls; `null` returns it to the default.
          minimum: 1
          maximum: 604800

    EmailPasswordRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email, maxLength: 254 }
        password: { type: string, format: password, minLength: 8 }

    RefreshRequest:
      type: object
      required: [refresh_token]
      properties:
        refresh_token: { type: string }

    AuthResponse:
      type: object
      required: [token, user_id, email]
      properties:
        token: { type: string, description: "Access token for `Authorization: Bearer`." }
        refresh_token: { type: string, description: Absent on refresh responses that do not rotate. }
        user_id: { type: string, format: uuid }
        email: { type: string, format: email }

    UserProfile:
      type: object
      required: [id, email, role, disabled, created_at]
      properties:
        id: { type: string, format: uuid }
        email: { type: string, format: email }
        display_name:
          type: string
          description: Omitted when the account has no display name.
        role:
          type: string
          description: |
            The stored account role. `member` is the legacy value written by
            self-service registration; token issuance maps it to `viewer`, and
            an operator promotion writes `admin`.
          enum: [admin, member]
        disabled:
          type: boolean
          description: True for a deactivated account, which keeps its history and memberships but cannot sign in.
        disabled_at:
          type: string
          format: date-time
          description: When the account was deactivated. Present only while it is.
        created_at: { type: string, format: date-time }

    ChangeRoleRequest:
      type: object
      required: [role]
      properties:
        role: { type: string, enum: [admin, member] }

    ResetPasswordRequest:
      type: object
      required: [token, password]
      properties:
        token: { type: string, description: The part of the link after `/reset/`. }
        password:
          type: string
          format: password
          minLength: 8
          maxLength: 72

    PasswordResetLink:
      type: object
      required: [link, expires_at]
      properties:
        link: { type: string, description: A path on this instance, for example `/reset/abc`. }
        expires_at: { type: string, format: date-time }

    ChangePasswordRequest:
      type: object
      required: [current_password, new_password]
      properties:
        current_password: { type: string, format: password }
        new_password:
          type: string
          format: password
          minLength: 8
          maxLength: 72
          description: Must differ from the current password.

    ProfileUpdateRequest:
      type: object
      properties:
        display_name:
          type: [string, "null"]
          maxLength: 100
          description: Omit to leave unchanged; `""` clears it. At most 100 characters after trimming; a longer name is refused with 400 `invalid_display_name`.

    ApiKey:
      type: object
      required: [id, name, key_prefix, created_at]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        key_prefix: { type: string, example: vuln }
        raw_key:
          type: string
          description: The secret. Present only in the creation response.
          example: vuln_9f8c7d6e5b4a39281706
        last_four: { type: [string, "null"] }
        created_at: { type: string, format: date-time }
        expires_at: { type: [string, "null"], format: date-time }
        creator_is_member:
          type: boolean
          description: |
            Present in the key list only. `false` when the person who created
            the key is no longer a direct or team member of the project. The
            key keeps working: removing a person never revokes their keys, so a
            CI key can outlive them on purpose. A global admin who created a
            key without being a member also reads `false`. Revoke the key with
            `DELETE /api/v1/auth/apikeys/{id}` when it should go too.

    CreateApiKeyRequest:
      type: object
      required: [project, name]
      properties:
        project: { type: string, description: Slug of the project the key is bound to. }
        name: { type: string }
        expires_at:
          type: string
          description: RFC 3339. Omit for a key that never expires.
          example: "2026-12-31T00:00:00Z"

    Project:
      type: object
      required: [id, slug, name, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        slug: { type: string }
        name: { type: string }
        description: { type: [string, "null"] }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        role:
          type: string
          enum: [admin, manager, member]
          description: |
            The signed-in caller's effective role on the project, including
            roles conferred by team membership. A global admin is `admin`
            everywhere. Legacy roles are reported as their modern equivalents.
            Present only when reading a single project as a person, not for
            API keys or in list responses.
        permissions: { $ref: "#/components/schemas/ProjectPermissions" }

    ProjectPermissions:
      type: object
      description: |
        What the caller may do on the project, for showing and hiding controls.
        The server checks the role again on every request.
      required: [request_waiver, manage_waivers, approve_waivers, manage_members, manage_ci, triage]
      properties:
        request_waiver: { type: boolean, description: Ask for a waiver. Every project member. }
        manage_waivers: { type: boolean, description: Create, edit, delete and toggle waivers. }
        approve_waivers: { type: boolean, description: Approve or reject waiver requests. }
        manage_members: { type: boolean, description: Add and remove members, up to the caller's own role. }
        manage_ci: { type: boolean, description: Create, list and revoke the project's API keys. }
        triage: { type: boolean, description: Change analysis state and reachability. }

    CreateProjectRequest:
      type: object
      required: [name, slug]
      properties:
        name: { type: string }
        slug:
          type: string
          description: Unique URL-safe identifier for the project, 3 to 48 characters of lowercase letters and digits with single hyphens between groups (`^[a-z0-9]+(-[a-z0-9]+)*$`). Names the server or the web app already uses as a first path segment (`admin`, `api`, `api-keys`, `assets`, `ingest`, `login`, `projects`, `register`, `teams`) are reserved. A rejected slug returns `invalid_slug`.
          example: my-app
        description: { type: string }

    UpdateProjectRequest:
      type: object
      properties:
        name: { type: [string, "null"], description: Omit to leave unchanged. }
        description: { type: [string, "null"], description: Omit to leave unchanged. }

    Scanner:
      type: object
      required: [name, display_name, version, finding_kinds, scan_types, provides_packages, supports_auto_detection, formats]
      properties:
        name: { type: string, example: trivy, description: The identifier to send as `scanner`. }
        display_name: { type: string, example: Trivy, description: What people call the tool. }
        version: { type: string }
        formats:
          type: array
          description: The files this scanner reads and how to produce them.
          items: { $ref: "#/components/schemas/ScannerFormat" }
        finding_kinds:
          type: array
          items: { type: string, enum: [sca, sast, iac, secret, dast, image_config, license, cve_watcher] }
        scan_types:
          type: array
          items: { type: string, example: image }
        provides_packages: { type: boolean }
        supports_auto_detection: { type: boolean }

    ScannerFormat:
      type: object
      required: [name, extensions, command, tested_with]
      properties:
        name: { type: string, example: SARIF }
        extensions:
          type: array
          items: { type: string, example: .sarif }
          description: File extensions the upload page accepts for this format.
        command: { type: string, example: "semgrep scan --sarif -o semgrep.sarif", description: How to produce the file. }
        tested_with: { type: string, example: Semgrep 1.172.0, description: The tool version the parser was checked against. }
        note: { type: string, description: Something a person should know, such as a limit of the tool. }

    IngestRequest:
      type: object
      required: [project, scanner, raw_data]
      properties:
        project: { type: string, description: Project slug. }
        scanner:
          type: string
          description: Registered scanner name.
          example: trivy
        scanner_version: { type: string, description: Recorded for provenance. }
        parser_version: { type: string, description: Recorded for provenance. }
        raw_data:
          description: The scanner's output, byte for byte. JSONL may be sent as a JSON array.
          oneOf:
            - type: object
            - type: array
        branch: { type: string, maxLength: 255 }
        commit_sha:
          type: string
          maxLength: 64
          pattern: "^[0-9A-Za-z._-]*$"
        base_revision:
          type: string
          maxLength: 255
          description: Required when `scan_mode` is `incremental`; the revision to compare against.
        changed_files:
          type: array
          maxItems: 5000
          items: { type: string, maxLength: 1024 }
        scan_mode: { type: string, enum: [full, incremental], default: full }
        gate_severity: { type: string, description: Comma-separated override for the post-ingest threshold check. }
        gate_status: { type: string, description: Comma-separated status override for the post-ingest threshold check. }
        gate_introduced_only:
          type: boolean
          description: Scope the post-ingest threshold check to what this report introduced.
        environment: { type: string, maxLength: 64, description: Deployment environment. Derived from the report when empty. }
        owner: { type: string, maxLength: 255, description: "Repository identity as `provider://owner/repo`." }
        digest: { type: string, maxLength: 255, description: "Content digest of the scanned artifact, e.g. `sha256:...`." }
        artifact_name: { type: string, maxLength: 255 }
        artifact_version: { type: string, maxLength: 255 }
        artifact_type: { type: string, maxLength: 255, example: container-image }

    IngestResponse:
      type: object
      required: [report_id, total_findings, threshold_breached, scan_mode, introduced_count, pre_existing_count, replayed]
      properties:
        report_id: { type: string, format: uuid }
        total_findings: { type: integer, description: "Every entry the scanner reported, before fingerprint deduplication." }
        threshold_breached: { type: boolean }
        scan_mode: { type: string, enum: [full, incremental], description: The mode actually used. }
        fallback_reason:
          type: string
          description: Present when an incremental scan had to fall back to full.
          enum: [unsupported_scanner, missing_baseline]
        introduced_count: { type: integer }
        pre_existing_count: { type: integer }
        replayed:
          type: boolean
          description: True when identical bytes for the same commit returned an existing report instead of ingesting again.

    Report:
      type: object
      required: [id, project_id, tool_name, scan_type, status, created_at, raw_data_expired]
      properties:
        id: { type: string, format: uuid }
        project_id: { type: string, format: uuid }
        tool_name: { type: string, example: trivy }
        tool_version: { type: [string, "null"] }
        scan_type: { type: string, example: image }
        scan_target: { type: [string, "null"] }
        status: { type: string, enum: [processing, completed, failed] }
        total_findings: { type: [integer, "null"] }
        branch: { type: [string, "null"] }
        commit_sha: { type: [string, "null"] }
        base_revision: { type: string }
        scan_mode: { type: string, enum: [full, incremental] }
        changed_files:
          type: array
          items: { type: string }
        error_message:
          type: string
          description: Fixed, sanitized reason a failed report failed. Absent unless status is failed.
        created_at: { type: string, format: date-time }
        completed_at: { type: [string, "null"], format: date-time }
        raw_data_expired:
          type: boolean
          description: True once the retention sweep cleared the raw report payload (`raw_data`, kept for RAW_RETENTION_DAYS). The report row, its findings and their summaries are kept.
        raw_data_expires_at:
          type: [string, "null"]
          format: date-time
          description: The date the retention window ended for the payload, which is created_at plus RAW_RETENTION_DAYS. Null while the payload is kept and when no window is set.

    Finding:
      type: object
      required: [id, project_id, finding_kind, fingerprint, current_title, current_severity, state, analysis_state, gate_effect, first_seen_at, last_seen_at]
      properties:
        id: { type: string, format: uuid }
        project_id: { type: string, format: uuid }
        finding_kind: { type: string, enum: [sca, sast, iac, secret, dast, image_config, license, cve_watcher] }
        fingerprint: { type: string, description: Stable identity across scans; the dedupe key. }
        current_title: { type: string }
        current_severity:
          type: string
          enum: [critical, high, medium, low, unknown]
          description: "`unknown` means the scanner did not rate the finding; it has rank 0 and never gates."
        current_score: { type: [number, "null"], description: CVSS score when the scanner supplied one. }
        state:
          type: string
          description: Scan lifecycle. Moved only by ingest, verification, and the expiry sweeps.
        triage_status: { type: string }
        analysis_state:
          type: string
          description: The analyst's standing.
          enum: [unanalyzed, in_triage, exploitable, false_positive, not_affected, accepted_risk, wont_fix]
        gate_effect: { type: string, enum: [block, ignore] }
        analysis_reason:
          type: string
          description: The reason recorded with the current analysis state. Absent when none was given.
        analysis_expires_at:
          type: string
          format: date-time
          description: When the analysis state lapses and the expiry sweep resets it. Absent when it does not expire.
        analysis_source:
          type: string
          enum: [system, manual, bulk, auto_rule]
          description: Who set the current analysis state.
        manual_override: { type: boolean, description: A person set the current analysis state. }
        review_required: { type: boolean, description: "A later scan changed the finding (higher severity or a new fix), so the state should be looked at again." }
        first_seen_at: { type: string, format: date-time }
        last_seen_at: { type: string, format: date-time }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        introduced_by_report_id: { type: string, format: uuid }
        introduced_commit_sha: { type: string }
        context: { $ref: "#/components/schemas/FindingContext" }
        raw_data_expired:
          type: boolean
          description: "Set on GET /findings/{id} and absent from list responses. True when the report of the finding's latest observation has had its raw payload cleared by the retention sweep."
        raw_data_expires_at:
          type: string
          format: date-time
          description: "Set on GET /findings/{id} when raw_data_expired is true and a retention window is set: the date the window ended for that report. Absent otherwise."
        remediation: { $ref: "#/components/schemas/Remediation" }
        location: { $ref: "#/components/schemas/Location" }
        suggestion: { $ref: "#/components/schemas/Suggestion" }
        intel:
          $ref: "#/components/schemas/Intel"
          description: Present for CVE-shaped findings whose identifier a configured feed knows.

    FindingContext:
      type: object
      properties:
        target_name: { type: string }
        target_kind: { type: string }
        target_owner: { type: string }
        environment_name: { type: string }
        branch: { type: string }
        commit_sha: { type: string }
        source_link: { type: string, format: uri }

    Remediation:
      type: object
      properties:
        summary: { type: string }
        url: { type: string, format: uri }
        source: { type: string }
        fallback: { type: boolean }

    Location:
      type: object
      properties:
        file: { type: string }
        start_line: { type: integer }
        end_line: { type: integer }
        resource: { type: string }
        summary: { type: string }

    Suggestion:
      type: object
      required: [action, confidence]
      properties:
        action: { type: string }
        target: { type: string }
        detail: { type: string }
        confidence: { type: string, enum: [low, medium, high] }
        source: { type: string }

    Intel:
      type: object
      required: [cve_id, kev, sources, fetched_at]
      properties:
        cve_id: { type: string, example: CVE-2026-1234 }
        epss:
          type: [number, "null"]
          minimum: 0
          maximum: 1
          description: EPSS exploit probability.
        epss_date: { type: string }
        kev: { type: boolean, description: Listed in CISA's Known Exploited Vulnerabilities catalog. }
        kev_added: { type: string }
        sources:
          type: array
          items: { type: string, example: epss }
        fetched_at: { type: string, format: date-time }
        stale:
          type: boolean
          description: True when a refresh failed and the served record is past its TTL.

    FindingEvent:
      type: object
      required: [id, finding_id, user_id, event_type, created_at]
      properties:
        id: { type: string, format: uuid }
        finding_id: { type: string, format: uuid }
        user_id: { type: string, description: Empty for system events left by the expiry sweeps. }
        user_name: { type: string, description: "The actor's display name, or their email when they set none; \"System\" for automated actions. Left out for API keys." }
        event_type: { type: string, example: state_changed }
        old_value: { type: string }
        new_value: { type: string }
        comment: { type: string }
        changes:
          type: string
          description: Base64-encoded JSON with the structured detail of the change.
        created_at: { type: string, format: date-time }

    TriageRequest:
      type: object
      required: [analysis_state]
      properties:
        analysis_state:
          type: string
          enum: [unanalyzed, in_triage, exploitable, false_positive, not_affected, accepted_risk, wont_fix]
        reason:
          type: string
          description: Required for states that ignore the gate. At most 4096 bytes (`reason_too_long` otherwise).
        analysis_expires_at:
          type: string
          format: date-time
          description: Required for `accepted_risk` and `wont_fix`; the expiry sweep resets those findings.
        expected_state:
          type: string
          description: When set, the write applies only while the finding is still in this analysis state; otherwise it fails with 409 `analysis_conflict`.

    TriageResult:
      type: object
      required: [finding_id, analysis_state, gate_effect]
      properties:
        finding_id: { type: string, format: uuid }
        analysis_state: { type: string }
        gate_effect: { type: string, enum: [block, ignore] }
        event_id:
          type: string
          format: uuid
          description: The finding event this decision wrote. Absent in bulk results.

    UndoTriageRequest:
      type: object
      required: [event_id]
      properties:
        event_id:
          type: string
          format: uuid
          description: The `event_id` a triage response returned, naming the decision to take back.

    BulkTriageRequest:
      type: object
      required: [finding_ids, analysis_state]
      properties:
        finding_ids:
          type: array
          maxItems: 1000
          items: { type: string, format: uuid }
        analysis_state: { type: string }
        reason: { type: string, description: "At most 4096 bytes (`reason_too_long` otherwise); it is stored on every finding's event." }
        analysis_expires_at: { type: string, format: date-time }

    BulkTriageResponse:
      type: object
      required: [results]
      properties:
        results:
          type: array
          items: { $ref: "#/components/schemas/TriageResult" }

    VerifyResponse:
      type: object
      required: [finding_id, outcome, detail]
      properties:
        finding_id: { type: string, format: uuid }
        outcome: { type: string, enum: [still_present, verified_fixed, inconclusive] }
        report_id:
          type: string
          format: uuid
          description: The report that supplied the verdict.
        detail: { type: string }

    PatchPreview:
      type: object
      required: [supported]
      properties:
        supported: { type: boolean }
        reason: { type: string, description: "Why no patch was planned, when `supported` is false." }
        proposal: { $ref: "#/components/schemas/PatchProposal" }

    PatchProposal:
      type: object
      required: [id, finding_id, class, confidence, rationale, evidence, edits, apply_mode, verify_by]
      properties:
        id: { type: string }
        finding_id: { type: string, format: uuid }
        class: { type: string, example: dependency-bump }
        confidence: { type: string, enum: [low, medium, high] }
        rationale: { type: string }
        evidence: { $ref: "#/components/schemas/PatchEvidence" }
        edits:
          type: array
          items: { $ref: "#/components/schemas/PatchFileEdit" }
        apply_mode: { type: string }
        verify_by: { type: string }

    PatchEvidence:
      type: object
      properties:
        report_id: { type: string, format: uuid }
        scanner: { type: string }
        commit_sha: { type: string }
        package: { type: string }
        installed_version: { type: string }
        fixed_version: { type: string }
        manifest_file: { type: string }

    PatchFileEdit:
      type: object
      required: [operation, package, to_version]
      properties:
        file: { type: string }
        operation: { type: string, enum: [bump] }
        package: { type: string }
        from_version: { type: string }
        to_version: { type: string }

    NotifyPreview:
      type: object
      required: [supported]
      properties:
        supported: { type: boolean }
        reason: { type: string, description: "Why nothing would be sent, when `supported` is false." }
        plan: { $ref: "#/components/schemas/NotifyPlan" }

    NotifyPlan:
      type: object
      required: [id, channel, target, action, title, body, links, dedupe_key, reason]
      properties:
        id: { type: string }
        channel: { type: string, enum: [issue, message] }
        target: { type: string }
        action: { type: string, enum: [create, update] }
        title: { type: string }
        body: { type: string }
        links: { $ref: "#/components/schemas/NotifyLinks" }
        dedupe_key: { type: string }
        reason: { type: string }

    NotifyLinks:
      type: object
      properties:
        finding: { type: string, format: uri }
        project: { type: string, format: uri }
        fix: { type: string, format: uri }

    Evidence:
      type: object
      required: [id, finding_id, type, url, description, created_at]
      properties:
        id: { type: string, format: uuid }
        finding_id: { type: string, format: uuid }
        type: { type: string, example: ticket }
        url: { type: string }
        description: { type: string }
        uploaded_by: { type: [string, "null"], format: uuid }
        created_at: { type: string, format: date-time }

    CreateEvidenceRequest:
      type: object
      required: [type]
      properties:
        type: { type: string, description: "Evidence kind, for example `ticket`, `screenshot`, or `log`." }
        url: { type: string, format: uri }
        description: { type: string }

    Reachability:
      type: object
      required: [id, finding_id, state, evidence, assessed_by, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        finding_id: { type: string, format: uuid }
        state: { type: string, enum: [reachable, not_reachable, unknown, not_applicable], description: "Expert verdict. `not_reachable` exempts the finding from the gate." }
        evidence: { type: string }
        assessed_by: { type: string, format: uuid }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    UpsertReachabilityRequest:
      type: object
      required: [state]
      properties:
        state: { type: string, enum: [reachable, not_reachable, unknown, not_applicable] }
        evidence: { type: string }

    Signoff:
      type: object
      required: [id, finding_id, status, reviewed_by, comment, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        finding_id: { type: string, format: uuid }
        status: { type: string, enum: [pending, approved, rejected] }
        reviewed_by: { type: string, format: uuid }
        comment: { type: string }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    UpsertSignoffRequest:
      type: object
      required: [status]
      properties:
        status: { type: string, enum: [pending, approved, rejected] }
        comment: { type: string }

    GateStatus:
      type: object
      required: [threshold_breached, blocking_count]
      properties:
        threshold_breached:
          type: boolean
          description: The pipeline verdict. True means at least one finding blocks.
        blocking_count: { type: integer, format: int64 }
        blocked_by:
          type: array
          description: IDs of the findings that block.
          items: { type: string, format: uuid }
        blocked_by_reachability:
          type: object
          description: Each blocked finding's latest reachability assessment.
          additionalProperties: { type: string }
        waived_count: { type: integer, description: Blocking findings silenced by an active waiver. }
        waived_finding_ids:
          type: array
          description: IDs of the blocking findings an active waiver silences; always an array, possibly empty.
          items: { type: string, format: uuid }
        policy: { $ref: "#/components/schemas/PolicyEffective" }

    PolicyEffective:
      type: object
      required: [template_version, severity_floor, severity_source, watcher_gate, watcher_source]
      properties:
        template_name: { type: [string, "null"] }
        template_version: { type: integer }
        severity_floor: { type: string, enum: [critical, high, medium, low] }
        severity_source:
          type: string
          description: The layer that supplied the floor.
          enum: [default, template, override]
        watcher_gate: { type: string, enum: [require_triage, immediate, off] }
        watcher_source: { type: string, enum: [default, template, override] }

    PRCheckPreview:
      type: object
      required: [provider, commit_sha, conclusion, title, summary, annotations, summary_counts, truncated, total_mappable, waived_count]
      properties:
        provider: { type: string, enum: [github] }
        commit_sha: { type: string }
        report_id: { type: string, format: uuid }
        conclusion: { type: string, enum: [success, failure, neutral] }
        title: { type: string }
        summary: { type: string }
        annotations:
          type: array
          items: { $ref: "#/components/schemas/PRCheckAnnotation" }
        summary_counts:
          type: object
          additionalProperties: { type: integer }
        truncated: { type: boolean }
        total_mappable: { type: integer }
        supersedes: { type: string }
        waived_count: { type: integer }

    PRCheckAnnotation:
      type: object
      required: [external_id, finding_id, file, start_line, end_line, level, title, message]
      properties:
        external_id: { type: string }
        finding_id: { type: string, format: uuid }
        file: { type: string }
        start_line: { type: integer }
        end_line: { type: integer }
        level: { type: string, enum: [info, warning, error] }
        title: { type: string }
        message: { type: string }

    PolicyTemplate:
      type: object
      required: [id, name, description, definition, version]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        description: { type: string }
        definition:
          type: object
          description: Flat string map of policy keys to values.
          additionalProperties: { type: string }
        version: { type: integer }

    PolicyTemplateRequest:
      type: object
      required: [name, definition]
      properties:
        name: { type: string }
        description: { type: string }
        definition:
          type: object
          additionalProperties: { type: string }

    SetPolicyRequest:
      type: object
      required: [template_name]
      properties:
        template_name: { type: string, description: Empty unlinks the template. }

    SetPolicyOverridesRequest:
      type: object
      required: [overrides]
      properties:
        overrides:
          type: object
          additionalProperties: { type: string }

    Waiver:
      type: object
      required: [id, project_id, name, description, enabled, status, scope_all, reason, decision_note, conditions, contexts, targets, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        project_id: { type: string, format: uuid }
        name: { type: string }
        description: { type: string }
        enabled: { type: boolean }
        status:
          type: string
          enum: [pending, approved, rejected, withdrawn]
          description: Review state. Only approved waivers count in the gate.
        scope_all:
          type: boolean
          description: True for a waiver that covers every finding of the project.
        reason: { type: string, description: The requester's justification. Empty for waivers created directly. }
        requested_by: { type: string, format: uuid, description: User who asked for the waiver. Absent for waivers created directly. }
        requested_by_name: { type: string, description: "The requester's display name, or their email when they set none. Left out for API keys." }
        requested_at: { type: string, format: date-time }
        decided_by: { type: string, format: uuid }
        decided_by_name: { type: string, description: "The decider's display name, or their email when they set none. Left out for API keys." }
        decided_at: { type: string, format: date-time }
        decision_note: { type: string }
        expires_at: { type: [string, "null"], format: date-time }
        conditions:
          type: array
          items: { $ref: "#/components/schemas/WaiverCondition" }
        contexts:
          type: array
          items: { $ref: "#/components/schemas/WaiverContext" }
        targets:
          type: array
          items: { $ref: "#/components/schemas/WaiverFindingTarget" }
        created_at: { type: string, format: date-time }
        updated_at:
          type: string
          format: date-time
          description: Version of the waiver, with microseconds. Send it back unchanged as `expected_updated_at` on `revoke` or `restore`.
          example: "2026-10-15T09:12:44.123456Z"

    WaiverSwitchRequest:
      type: object
      properties:
        expected_updated_at:
          type: string
          format: date-time
          description: The `updated_at` the caller last saw. When set, the call fails with `waiver_changed` if the waiver was written after it.

    WaiverCondition:
      type: object
      required: [id, field, operator, value]
      properties:
        id: { type: string, format: uuid }
        field: { type: string, example: component.purl }
        operator: { type: string, example: equals }
        value: { type: string }

    WaiverContext:
      type: object
      required: [id]
      properties:
        id: { type: string, format: uuid }
        environment_id: { type: string, format: uuid }
        target_id: { type: string, format: uuid }
        artifact_id: { type: string, format: uuid }

    WaiverFindingTarget:
      type: object
      required: [id, finding_id]
      properties:
        id: { type: string, format: uuid }
        finding_id: { type: string, format: uuid }

    CreateWaiverRequest:
      type: object
      required: [name]
      properties:
        name: { type: string }
        description: { type: string }
        scope:
          type: string
          enum: [all]
          description: |
            Send `all` for a waiver that covers every finding of the project,
            with no conditions, contexts or target_ids. Omit it when the
            waiver names a scope. A waiver with neither is refused.
        expires_at:
          type: string
          description: RFC 3339. Omit for a waiver that never expires.
          example: "2026-12-31T00:00:00Z"
        conditions:
          type: array
          items:
            type: object
            required: [field, operator, value]
            properties:
              field: { type: string }
              operator: { type: string }
              value: { type: string }
        contexts:
          type: array
          items:
            type: object
            properties:
              environment_id: { type: string, format: uuid }
              target_id: { type: string, format: uuid }
              artifact_id: { type: string, format: uuid }
        target_ids:
          type: array
          description: Finding IDs this waiver suppresses directly.
          items: { type: string, format: uuid }

    UpdateWaiverRequest:
      type: object
      properties:
        name: { type: string }
        description: { type: string }
        scope:
          type: string
          enum: [all]
          description: Send `all` when the update leaves the waiver with no conditions, contexts or targets and it should cover everything. An update that would leave no scope without it is refused.
        expires_at:
          type: [string, "null"]
          description: |
            Tri-state: omit to keep the stored expiry, send `""` to clear it,
            send an RFC 3339 value to set it.
        conditions:
          type: array
          items:
            type: object
            required: [field, operator, value]
            properties:
              field: { type: string }
              operator: { type: string }
              value: { type: string }
        contexts:
          type: array
          items:
            type: object
            properties:
              environment_id: { type: string, format: uuid }
              target_id: { type: string, format: uuid }
              artifact_id: { type: string, format: uuid }
        target_ids:
          type: array
          items: { type: string, format: uuid }

    RequestWaiverRequest:
      type: object
      required: [target_ids, reason, expires_at]
      properties:
        target_ids:
          type: array
          minItems: 1
          maxItems: 50
          description: Findings of this project to waive.
          items: { type: string, format: uuid }
        reason: { type: string, maxLength: 1000 }
        expires_at:
          type: string
          format: date-time
          description: RFC 3339, in the future and no more than 90 days ahead.

    WaiverDecisionRequest:
      type: object
      properties:
        note: { type: string, description: Optional comment shown with the decision. }

    WaiverRejectRequest:
      type: object
      required: [note]
      properties:
        note: { type: string, description: Why the request was rejected. }

    WaiverEvent:
      type: object
      required: [id, waiver_id, event_type, created_at]
      properties:
        id: { type: string, format: uuid }
        waiver_id: { type: string, format: uuid }
        event_type:
          type: string
          enum: [created, updated, revoked, restored, enabled, disabled, auto_disabled, requested, approved, rejected, withdrawn, auto_rejected]
        actor_id: { type: string, format: uuid }
        actor_name: { type: string, description: "The actor's display name, or their email when they set none; \"System\" for automated actions. Left out for API keys." }
        metadata:
          description: Event-specific detail, such as the reason an expiry sweep disabled the waiver.
        created_at: { type: string, format: date-time }

    CheckMatchRequest:
      type: object
      required: [finding_id]
      properties:
        finding_id: { type: string, format: uuid }

    CheckMatchResponse:
      type: object
      required: [matched]
      properties:
        matched: { type: boolean }

    Team:
      type: object
      required: [id, name, description]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        description: { type: string }

    CreateTeamRequest:
      type: object
      required: [name]
      properties:
        name: { type: string }
        description: { type: string }

    TeamMember:
      type: object
      required: [team_id, user_id, role]
      properties:
        team_id: { type: string, format: uuid }
        user_id: { type: string, format: uuid }
        user_email:
          type: string
          format: email
          description: Only for global admins and admins of the team.
        display_name: { type: string }
        role: { type: string, enum: [admin, member] }

    AddMemberRequest:
      type: object
      required: [user_id, role]
      properties:
        user_id: { type: string, format: uuid }
        role: { type: string, enum: [admin, manager, member] }

    MemberGrantRequest:
      type: object
      required: [role]
      description: |
        Names the person by account id or by email address; send exactly one.
        An address with no account answers 404 `user_not_found`, the same as an
        unknown id, and only callers allowed to add members get that answer.
      properties:
        user_id: { type: string, format: uuid }
        email: { type: string, format: email, maxLength: 254 }
        role: { type: string, enum: [admin, manager, member] }

    ProjectTeam:
      type: object
      required: [project_id, team_id, team_name, role]
      properties:
        project_id: { type: string, format: uuid }
        team_id: { type: string, format: uuid }
        team_name: { type: string }
        role: { type: string, enum: [admin, manager, member] }

    ProjectMember:
      type: object
      required: [project_id, user_id, role, created_at]
      properties:
        project_id: { type: string, format: uuid }
        user_id: { type: string, format: uuid }
        role: { type: string, enum: [admin, manager, member] }
        created_at: { type: string, format: date-time }
        email: { type: string, format: email, description: The member's address. Sent to a signed-in person only, never to an API key. }
        display_name: { type: string, description: The member's display name, when they have one. Sent to a signed-in person only, never to an API key. }

    MemberSuggestion:
      type: object
      required: [user_id, email, display_name]
      properties:
        user_id: { type: string, format: uuid }
        email: { type: string, format: email }
        display_name: { type: string, description: The person's self-chosen display name, empty when they have none. Show it as secondary text; the email identifies the person. }

    Environment:
      type: object
      required: [id, project_id, name, tier, internet_facing, data_sensitivity, created_at]
      properties:
        id: { type: string, format: uuid }
        project_id: { type: string, format: uuid }
        name: { type: string }
        tier: { type: string, enum: [production, staging, development, test] }
        internet_facing: { type: boolean }
        data_sensitivity: { type: string, enum: [public, internal, confidential, restricted] }
        created_at: { type: string, format: date-time }

    EnvironmentUpdateRequest:
      type: object
      required: [tier, internet_facing, data_sensitivity]
      properties:
        tier: { type: string, enum: [production, staging, development, test] }
        internet_facing: { type: boolean }
        data_sensitivity: { type: string, enum: [public, internal, confidential, restricted] }

    Target:
      type: object
      required: [id, project_id, name, kind, created_at]
      properties:
        id: { type: string, format: uuid }
        project_id: { type: string, format: uuid }
        name: { type: string }
        kind: { type: string, example: container-image }
        locator: { type: string }
        created_at: { type: string, format: date-time }

    Artifact:
      type: object
      required: [id, project_id, artifact_type, name, created_at]
      properties:
        id: { type: string, format: uuid }
        project_id: { type: string, format: uuid }
        target_id: { type: string, format: uuid }
        artifact_type: { type: string, example: container-image }
        name: { type: string }
        version: { type: string }
        digest: { type: string }
        locator: { type: string }
        created_at: { type: string, format: date-time }

    ProjectStats:
      type: object
      required: [total_findings, blocking_count, waiver_count, pending_waiver_count, report_count, by_severity, by_analysis_state]
      properties:
        total_findings:
          type: integer
          description: Open and reopened findings; fixed and archived findings are not counted.
        blocking_count:
          type: integer
          description: >-
            Findings the gate holds back right now, so the number always equals
            the gate's `blocking_count`: open findings at or above the policy's
            severity floor, admitted by source policy, not exempted by a
            reachability assessment and not covered by an approved waiver.
        waiver_count: { type: integer, description: Approved, enabled waivers only. }
        pending_waiver_count: { type: integer, description: Waiver requests waiting for a decision. }
        report_count: { type: integer }
        by_severity:
          type: array
          description: Counts per severity among the project's open and reopened findings (fixed and archived findings are not counted).
          items: { $ref: "#/components/schemas/SeverityCount" }
        by_analysis_state:
          type: array
          description: Counts per analysis state among the project's open and reopened findings (findings already fixed are not counted), ordered by state name; empty when there are none. A missing analysis state counts as unanalyzed.
          items: { $ref: "#/components/schemas/AnalysisStateCount" }
        latest_report: { $ref: "#/components/schemas/Report" }

    SeverityCount:
      type: object
      required: [severity, count, blocking_count]
      properties:
        severity: { type: string }
        count: { type: integer }
        blocking_count:
          type: integer
          description: The gate's blockers of this severity. The values add up to the project's `blocking_count`.

    AnalysisStateCount:
      type: object
      required: [state, count]
      properties:
        state: { type: string }
        count: { type: integer }

    AgingResponse:
      type: object
      required: [buckets, overdue_total, overdue, reopened, new_per_week, truncated]
      properties:
        buckets:
          type: array
          description: Always all four buckets, in age order. They count open findings only.
          items: { $ref: "#/components/schemas/AgingBucket" }
        overdue_total:
          type: integer
          description: Every finding past its SLA; the `overdue` list is capped at 100.
        overdue:
          type: array
          description: The oldest overdue findings first.
          items: { $ref: "#/components/schemas/OverdueFinding" }
        reopened: { type: integer, description: Findings ever reopened. }
        new_per_week:
          type: array
          description: >-
            Findings first seen in each of the trailing twelve weeks, oldest
            first, whatever their state today.
          items: { $ref: "#/components/schemas/WeeklyNew" }
        truncated:
          type: boolean
          description: >-
            True when the project has more than 10000 open findings. The
            buckets and the overdue numbers then cover the 10000 oldest.

    AgingBucket:
      type: object
      required: [bucket, count, overdue]
      properties:
        bucket: { type: string, enum: [new, aging, stale, debt] }
        count: { type: integer }
        overdue: { type: integer }

    OverdueFinding:
      type: object
      required: [id, title, severity, age_days, sla_days, due_date, reopened]
      properties:
        id: { type: string, format: uuid }
        title: { type: string }
        severity: { type: string }
        age_days: { type: integer }
        sla_days: { type: integer }
        due_date: { type: string, format: date-time }
        reopened: { type: boolean }

    WeeklyNew:
      type: object
      required: [week, count]
      properties:
        week: { type: string, description: The Monday that starts the week. }
        count: { type: integer }

    AdminStatus:
      type: object
      required: [projects, users, open_findings, reports, cve_providers]
      properties:
        projects: { type: integer, format: int64 }
        users: { type: integer, format: int64 }
        open_findings: { type: integer, format: int64 }
        reports: { type: integer, format: int64 }
        oldest_settled_report_at: { type: [string, "null"], format: date-time }
        cve_providers:
          type: array
          description: Every CVE detail provider the server knows, configured ones first in lookup order.
          items: { $ref: "#/components/schemas/CveProviderStatus" }

    CveProviderStatus:
      type: object
      required: [name, enabled, key_configured, last_success_at, last_error, last_error_at]
      properties:
        name: { type: string, enum: [nvd, vulncheck, osv] }
        enabled: { type: boolean, description: Listed in CVE_DETAIL_PROVIDERS. }
        key_configured: { type: boolean, description: An API key is set. The key itself is never returned. }
        last_success_at: { type: [string, "null"], format: date-time }
        last_error:
          type: [string, "null"]
          enum: [timeout, rate_limited, http_4xx, http_5xx, decode, too_large, tls, network, null]
          description: The category of the last failure, recorded by any replica.
        last_error_at: { type: [string, "null"], format: date-time }

    CveDetail:
      type: object
      required: [cve_id, pending, cvss, epss, kev, cwes, published_at, modified_at, references, providers]
      properties:
        cve_id: { type: string, example: CVE-2024-3094 }
        pending:
          type: boolean
          description: A provider fetch is scheduled or running. Read again later for its answer.
        cvss:
          type: array
          description: Report vectors first, newest report first, then provider vectors.
          items: { $ref: "#/components/schemas/CveCvss" }
        epss:
          oneOf:
            - { $ref: "#/components/schemas/CveEpss" }
            - { type: "null" }
        kev:
          description: Present only when the CVE is listed. Absence is not a negative answer.
          oneOf:
            - { $ref: "#/components/schemas/CveKev" }
            - { type: "null" }
        cwes:
          type: array
          items: { $ref: "#/components/schemas/CveCwe" }
        published_at:
          oneOf:
            - { $ref: "#/components/schemas/CveDate" }
            - { type: "null" }
        modified_at:
          oneOf:
            - { $ref: "#/components/schemas/CveDate" }
            - { type: "null" }
        references:
          type: array
          maxItems: 20
          items: { $ref: "#/components/schemas/CveReference" }
        providers:
          type: array
          description: Every known provider and its part in this answer, configured ones first.
          items: { $ref: "#/components/schemas/CveProviderLookup" }

    CveProvenance:
      type: object
      required: [kind]
      description: Where one value came from.
      properties:
        kind:
          type: string
          enum: [scan_report, watcher, provider, feed]
          description: |
            `scan_report`: a scanner's report. `watcher`: the CVE watcher's OSV advisory.
            `provider`: an external CVE detail provider. `feed`: the EPSS or KEV feed.
        tool: { type: string, description: The scanner, for scan_report and watcher. }
        report_id: { type: string, format: uuid }
        observed_at: { type: string, format: date-time }
        provider: { type: string, description: "The provider or feed: nvd, vulncheck, osv, epss or kev." }
        fetched_at: { type: string, format: date-time }
        detail: { type: string, description: "The scoring party the source names, such as \"nvd@nist.gov primary\"." }

    CveCvss:
      type: object
      required: [version, vector, base_score, reported_score, severity, valid, metrics, provenance]
      properties:
        version: { type: string, enum: ["2.0", "3.0", "3.1", "4.0"], description: Taken from the vector prefix. }
        vector: { type: string, description: The full vector. Bare v2 vectors get the CVSS:2.0/ prefix. }
        base_score: { type: [number, "null"], description: Computed from the vector; null when it does not parse. }
        reported_score: { type: [number, "null"], description: The score the source printed. }
        severity:
          type: [string, "null"]
          enum: [none, low, medium, high, critical, null]
          description: Band of the base score (or of the reported score when the vector does not parse). v2 stops at high.
        valid: { type: boolean }
        metrics:
          type: array
          description: Every metric in vector order. Empty when the vector does not parse.
          items: { $ref: "#/components/schemas/CvssMetric" }
        provenance: { $ref: "#/components/schemas/CveProvenance" }

    CvssMetric:
      type: object
      required: [group, key, value]
      properties:
        group: { type: string, enum: [base, temporal, threat, environmental, supplemental] }
        key: { type: string, example: AV }
        value: { type: string, example: N }

    CveEpss:
      type: object
      required: [probability, percentile, date, provenance]
      properties:
        probability: { type: number, minimum: 0, maximum: 1 }
        percentile: { type: [number, "null"], minimum: 0, maximum: 1 }
        date: { type: [string, "null"], format: date }
        provenance: { $ref: "#/components/schemas/CveProvenance" }

    CveKev:
      type: object
      required: [listed, date_added, due_date, known_ransomware_use, provenance]
      properties:
        listed: { type: boolean }
        date_added: { type: [string, "null"], format: date }
        due_date: { type: [string, "null"], format: date }
        known_ransomware_use: { type: [string, "null"], description: As the KEV catalog spells it, Known or Unknown. }
        provenance: { $ref: "#/components/schemas/CveProvenance" }

    CveCwe:
      type: object
      required: [id, provenance]
      properties:
        id: { type: string, pattern: "^CWE-[0-9]+$", example: CWE-79 }
        provenance: { $ref: "#/components/schemas/CveProvenance" }

    CveDate:
      type: object
      required: [value, provenance]
      properties:
        value: { type: string, format: date-time }
        provenance: { $ref: "#/components/schemas/CveProvenance" }

    CveReference:
      type: object
      required: [url, provenance]
      properties:
        url: { type: string, format: uri, description: Always https. }
        provenance: { $ref: "#/components/schemas/CveProvenance" }

    CveProviderLookup:
      type: object
      required: [name, status]
      properties:
        name: { type: string, enum: [nvd, vulncheck, osv] }
        status:
          type: string
          enum: [found, not_found, error, pending, skipped, disabled]
          description: |
            `found`: this provider's answer is listed. `not_found`: it has no record.
            `error`: the last fetch failed and is in backoff. `pending`: a fetch is
            scheduled or running. `skipped`: not asked, because the report is complete
            or an earlier provider answered. `disabled`: not configured.
        fetched_at: { type: string, format: date-time }

    RetentionPreview:
      type: object
      required: [older_than_days, cutoff, stale_reports]
      properties:
        older_than_days: { type: integer }
        cutoff: { type: string, format: date-time }
        stale_reports: { type: integer, format: int64 }

    PurgeRetentionRequest:
      type: object
      required: [older_than_days]
      properties:
        older_than_days: { type: integer, minimum: 1, maximum: 3650 }

    RetentionResult:
      type: object
      required: [older_than_days, cutoff, deleted_reports]
      properties:
        older_than_days: { type: integer }
        cutoff: { type: string, format: date-time }
        deleted_reports: { type: integer, format: int64 }
        deleted_report_ids:
          type: array
          items: { type: string, format: uuid }
        truncated: { type: boolean }

    WatcherStatus:
      type: object
      required: [consecutive_failures, healthy, stale]
      properties:
        last_successful_poll_at: { type: string, format: date-time }
        last_poll_attempt_at: { type: string, format: date-time }
        last_error: { type: string }
        consecutive_failures: { type: integer }
        healthy: { type: boolean }
        stale: { type: boolean }
        staleness_window: { type: string, example: 2h0m0s }
