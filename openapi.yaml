  /api/v1/users:
    get:
      tags: [Users]
      operationId: listUsers
      summary: List accounts
      description: |
        The directory an admin picks from when granting project membership or
        adding a team member, so a UI never has to ask for a raw user id.
        Session admins only — a project-scoped key has no business
        enumerating the organization. The response carries no credential
        material.
      x-auth: session
      x-required-role: admin
      security:
        - sessionAuth: []
