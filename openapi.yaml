openapi: 3.1.0

info:
  title: Specht API
  version: 1.0.0
  summary: Vulnerability management for SCA, SAST, and IaC scan results.
  description: |
    Specht ingests scanner reports, tracks findings across scans, evaluates a
    deployment gate, and manages waivers, policy, teams, and threat intel.

    Everything lives under `/api/v1`. Authentication is always an
    `Authorization: Bearer <credential>` header carrying either a session JWT
    (from `/auth/login`, `/auth/refresh`, or the SSO callback) or a
    project-scoped API key (prefix `vuln_`, from `/auth/apikeys`).

    ## Authorization model

    Three gates apply, in order:

    1. **Credential type** — some routes require a session and reject API keys
       entirely (`x-auth: session`), because a project key cannot represent the
       authority they carry.
    2. **Role or scope** — session roles are `admin`, `editor`, `viewer`
       (`x-required-role`); API key scopes are `ingest`, `read`, `admin`
       (`x-required-scope`). Sessions pass scope checks and are then subject to
       project membership instead.
    3. **Project access** — the caller must be a member of the project (session)
       or the key must be bound to it (API key), otherwise the request fails
       with `403 project_access_denied`, or `404 not_found` when an admin asks
       about a project that does not exist.

    ## Conventions

    - List endpoints return a **bare JSON array**; pagination is
      `limit`/`offset` (default 20, maximum 500). A malformed, negative, or
      oversized limit falls back to the default rather than erroring.
    - Paginated lists carry **`X-Total-Count`**, the size of the filtered set
      independent of the page window, so a client can render "n of m" without
      walking the pages. Findings serves it today; a missing header means the
      total is unknown, not zero.
    - Timestamps are RFC 3339 with a UTC offset. Durations are Go duration
      strings (`30d` is not valid; use `720h`).
    - Errors share one envelope: `{"error": {"code": ..., "message": ...}}`.
    - Request bodies over 1 MiB are rejected with `413`; ingest bodies are
      capped at 25 MiB.
  license:
    name: AGPL-3.0
    identifier: AGPL-3.0-only

servers:
  - url: "{scheme}://{host}:{port}"
    description: |
      A Specht server. The defaults match a local development run; override
      them for a self-hosted deployment.
    variables:
      scheme:
        default: http
        enum: [http, https]
      host:
        default: localhost
      port:
        default: "8080"

tags:
  - name: Meta
    description: Liveness and build identity. Unauthenticated.
  - name: Authentication
    description: Account lifecycle, token rotation, and SSO.
  - name: Profile
    description: The signed-in user's own account.
  - name: API keys
    description: Project-scoped credentials for CI pipelines and agents.
  - name: Projects
    description: The tenancy root. Every finding, report, and waiver belongs to one.
  - name: Scanners
    description: The registered scanner catalog.
  - name: Reports
    description: Scan ingestion and report history.
  - name: Findings
    description: The consolidated finding record and its triage lifecycle.
  - name: Previews
    description: Side-effect-free planning endpoints used by the CLI, the adapter, and MCP tools.
  - name: Evidence
    description: Analyst-attached supporting artifacts.
  - name: Reachability
    description: Whether a vulnerable code path is actually reachable.
  - name: Signoff
    description: Reviewer approval records.
  - name: Gate
    description: The deployment / pull-request decision.
  - name: Policy
    description: Policy templates, project policy, and per-project overrides.
  - name: Waivers
    description: Time-boxed, conditioned suppressions with a live match check.
  - name: Teams
    description: Organization groups and their project links.
  - name: Project members
    description: Direct per-project grants.
  - name: Users
    description: The account directory that admin surfaces pick a user from.
  - name: Context
    description: Environments, targets, and artifacts derived from scan context.
  - name: Insights
    description: Aggregate statistics and SLA aging.
  - name: Admin
    description: Platform operations reserved for admins.
  - name: Watcher
    description: The CVE feed watcher daemon's health.

security: []

paths:
  /api/v1/health:
    get:
      tags: [Meta]
      operationId: getHealth
      summary: Liveness probe
      description: Unauthenticated. Reports the served version and commit.
      security: []
      responses:
        "200":
          description: The server is up.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Health" }

  /api/v1/version:
    get:
      tags: [Meta]
      operationId: getVersion
      summary: Build identity
      description: Unauthenticated, so deployment tooling can verify what is running.
      security: []
      responses:
        "200":
          description: Build metadata.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Version" }

  /api/v1/auth/register:
    post:
      tags: [Authentication]
      operationId: register
      summary: Create an account
      description: |
        Public signup. The first account created is promoted to admin by the
        `ADMIN_EMAILS` bootstrap on the next boot, not by this endpoint.
        A duplicate email is indistinguishable from any other failure, by
        design, so this cannot enumerate accounts.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EmailPasswordRequest" }
      responses:
        "201":
          description: Account created and signed in.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "413": { $ref: "#/components/responses/BodyTooLarge" }
        "422":
          description: Registration failed (generic).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              example: { error: { code: registration_failed, message: registration failed } }

  /api/v1/auth/login:
    post:
      tags: [Authentication]
      operationId: login
      summary: Exchange credentials for tokens
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EmailPasswordRequest" }
      responses:
        "200":
          description: Signed in.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401":
          description: |
            Invalid email or password. Unknown accounts are deliberately
            indistinguishable from wrong passwords.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              example: { error: { code: login_failed, message: invalid email or password } }

  /api/v1/auth/refresh:
    post:
      tags: [Authentication]
      operationId: refreshToken
      summary: Rotate a refresh token
      description: |
        Returns a new access token and a new refresh token. The presented
        refresh token is invalidated; presenting it again revokes the whole
        token family, so a stolen token cannot be replayed silently.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RefreshRequest" }
      responses:
        "200":
          description: Rotated.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401":
          description: Invalid, expired, revoked, or replayed refresh token.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              example: { error: { code: refresh_failed, message: invalid refresh token } }

  /api/v1/auth/logout:
    post:
      tags: [Authentication]
      operationId: logout
      summary: Revoke a session
      description: |
        Revokes the refresh token family. When a bearer access token is also
        supplied, that token is retired immediately instead of waiting for its
        normal expiry. Works with only a refresh token in the body.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RefreshRequest" }
      responses:
        "204": { $ref: "#/components/responses/NoContent" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "500": { $ref: "#/components/responses/InternalError" }

  /api/v1/auth/sso/login:
    get:
      tags: [Authentication]
      operationId: ssoLogin
      summary: Start the SSO authorization-code flow
      description: |
        Redirects to the identity provider's authorization endpoint and sets an
        `HttpOnly` `sso_state` cookie binding the CSRF state (and the OIDC
        nonce) to this browser. `Secure` is set only when the transport is
        verified secure — TLS in-process, or `X-Forwarded-Proto: https` from a
        configured trusted proxy. Available only when `SSO_ENABLE` is on; the
        route is absent otherwise.
      security: []
      responses:
        "302":
          description: Redirect to the identity provider.
          headers:
            Set-Cookie:
              schema: { type: string }
              description: "`sso_state=<token>`; HttpOnly, SameSite=Lax, 10-minute lifetime."

  /api/v1/auth/sso/callback:
    get:
      tags: [Authentication]
      operationId: ssoCallback
      summary: Complete the SSO flow
      description: |
        Exchanges the authorization code, validates the ID token (signature,
        issuer, audience, expiry, nonce) against the state cookie, resolves the
        IdP subject to a local account, and redirects to the SPA with the
        session token in the URL **fragment** so it never reaches a server log
        or `Referer` header.

        Unknown IdP subjects are provisioned only when their email domain is in
        `SSO_ALLOWED_DOMAINS`; otherwise the request is refused. An existing
        account keeps its local role regardless of IdP group membership.
      security: []
      parameters:
        - name: code
          in: query
          required: true
          schema: { type: string }
        - name: state
          in: query
          required: true
          schema: { type: string }
      responses:
        "302":
          description: "Redirect to `/#sso_token=<jwt>`."
          headers:
            Location:
              schema: { type: string }
        "400":
          description: Missing code, or the state cookie did not match.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "403":
          description: |
            The IdP subject is not provisioned and its email domain is not
            allowlisted, or the asserted email is empty.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "500":
          description: Token exchange or identity extraction failed.

  /api/v1/me:
    get:
      tags: [Profile]
      operationId: getProfile
      summary: Read the signed-in account
      x-auth: session
      security:
        - sessionAuth: []
      responses:
        "200":
          description: The current profile.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UserProfile" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/SessionRequired" }
    put:
      tags: [Profile]
      operationId: updateProfile
      summary: Update the signed-in account
      description: |
        Updates the display name. The field is a pointer: omit it to leave the
        stored name alone, send `""` to clear it.
      x-auth: session
      security:
        - sessionAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ProfileUpdateRequest" }
      responses:
        "200":
          description: The updated profile.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UserProfile" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/SessionRequired" }

  /api/v1/auth/apikeys:
    post:
      tags: [API keys]
      operationId: createApiKey
      summary: Mint a project API key
      description: |
        Creates a key bound to exactly one project. The secret is returned once,
        in `raw_key`, and never again — later reads expose only the prefix and
        the last four characters.

        Reachable by an admin session, or by an API key that itself holds the
        `admin` scope.
      x-required-role: admin
      x-required-scope: admin
      security:
        - sessionAuth: []
        - apiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateApiKeyRequest" }
      responses:
        "201":
          description: Key created. `raw_key` appears only here.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiKey" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/Unprocessable" }
    get:
      tags: [API keys]
      operationId: listApiKeys
      summary: List API keys
      description: Lists the caller's key set with the secret masked.
      x-required-role: admin
      x-required-scope: admin
      security:
        - sessionAuth: []
        - apiKeyAuth: []
      responses:
        "200":
          description: The keys.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ApiKey" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/v1/auth/apikeys/{id}:
    delete:
      tags: [API keys]
      operationId: revokeApiKey
      summary: Revoke an API key
      x-required-role: admin
      x-required-scope: admin
      security:
        - sessionAuth: []
        - apiKeyAuth: []
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "204": { $ref: "#/components/responses/NoContent" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/Unprocessable" }

  /api/v1/projects:
    get:
      tags: [Projects]
      operationId: listProjects
      summary: List visible projects
      description: |
        Scoped to the caller's identity: an admin sees every project, an API key
        sees exactly the project it is bound to, and a member sees only the
        projects they belong to.
      x-required-scope: read
      security:
        - sessionAuth: []
        - apiKeyAuth: []
      responses:
        "200":
          description: The visible projects.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Project" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags: [Projects]
      operationId: createProject
      summary: Create a project
      description: Session admins only; a project key can never create tenancy.
      x-auth: session
      x-required-role: admin
      security:
        - sessionAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateProjectRequest" }
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Project" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/SessionRequired" }
        "409":
          description: The slug is taken.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              example: { error: { code: slug_taken, message: project slug already exists } }

  /api/v1/projects/{slug}:
    get:
      tags: [Projects]
      operationId: getProject
      summary: Read a project
      x-required-scope: read
      security:
        - sessionAuth: []
        - apiKeyAuth: []
      parameters:
        - $ref: "#/components/parameters/Slug"
      responses:
        "200":
          description: The project.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Project" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/ProjectAccessDenied" }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      tags: [Projects]
      operationId: updateProject
      summary: Update a project
      description: Both fields are pointers; omit one to leave it unchanged.
      x-required-scope: admin
      security:
        - sessionAuth: []
        - apiKeyAuth: []
      parameters:
        - $ref: "#/components/parameters/Slug"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateProjectRequest" }
      responses:
        "200":
          description: The updated project.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Project" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      tags: [Projects]
      operationId: deleteProject
      summary: Delete a project
      description: Deletes the project and everything hanging off it. Returns the deleted project.
      x-required-scope: admin
      security:
        - sessionAuth: []
        - apiKeyAuth: []
      parameters:
        - $ref: "#/components/parameters/Slug"
      responses:
        "200":
          description: The project as it was before deletion.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Project" }
        "403": { $ref: "#/components/responses/ProjectAccessDenied" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/scanners:
    get:
      tags: [Scanners]
      operationId: listScanners
      summary: List the scanner catalog
      description: |
        Every registered scanner with its version, the finding kinds it emits,
        the scan types it accepts, and whether it can detect its own format.
        Session admins only — project keys are refused.
      x-auth: session
      x-required-role: admin
      security:
        - sessionAuth: []
      responses:
        "200":
          description: The catalog, in registration order.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Scanner" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/SessionRequired" }

  /api/v1/users:
    get:
      tags: [Users]
      operationId: listUsers
      summary: List accounts
      description: |
        The directory an admin picks from when granting project membership or
        adding a team member, so a UI never has to ask for a raw user id.
        Session admins only — a project-scoped key has no business
        enumerating the organization. The response carries no credential
        material.
      x-auth: session
      x-required-role: admin
      security:
        - sessionAuth: []
      parameters:
        - name: email
          in: query
          description: Case-insensitive substring match on the email address. Empty lists every account.
          schema: { type: string }
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
      responses:
        "200":
          description: Accounts, ordered by email so pages are stable.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/UserProfile" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/SessionRequired" }
        "500": { $ref: "#/components/responses/InternalError" }

  /api/v1/reports:
    post:
      tags: [Reports]
      operationId: ingestReport
      summary: Ingest a scanner report
      description: |
        The core write path. The raw scanner output is hashed; re-posting
        identical bytes for the same project is a `409`. The payload is parsed
        by the named scanner, findings are upserted by fingerprint, and the gate
        is evaluated inline so the response is the post-ingest verdict. A parse
        failure persists no report row.

        Set `scan_mode: incremental` with `base_revision` to classify findings
        against a baseline; `gate_introduced_only: true` then scopes the verdict
        to what the change introduced. When a baseline cannot be resolved the
        scan falls back to full and explains itself in `fallback_reason`.
      x-required-scope: ingest
      security:
        - sessionAuth: []
        - apiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/IngestRequest" }
      responses:
        "201":
          description: Ingested and evaluated.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/IngestResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/ProjectAccessDenied" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: Identical report bytes already ingested for this project.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              example: { error: { code: duplicate_report, message: report already exists for this project and data } }
        "413": { $ref: "#/components/responses/BodyTooLarge" }
        "422":
          description: Ingestion failed (unknown scanner, parse error, bad revision).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              example: { error: { code: ingest_failed, message: report ingestion failed } }

  /api/v1/projects/{slug}/reports:
    get:
      tags: [Reports]
      operationId: listReports
      summary: List a project's reports
      x-required-scope: read
      security:
        - sessionAuth: []
        - apiKeyAuth: []
      parameters:
        - $ref: "#/components/parameters/Slug"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
      responses:
        "200":
          description: The reports, newest first.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Report" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/reports/{id}:
    get:
      tags: [Reports]
      operationId: getReport
      summary: Read a report
      description: A foreign report is indistinguishable from a missing one.
      x-required-scope: read
      security:
        - sessionAuth: []
        - apiKeyAuth: []
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: The report.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Report" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/projects/{slug}/findings:
    get:
      tags: [Findings]
      operationId: listFindings
      summary: List a project's findings
      description: |
        Every filter is a comma-separated list, and separate filters intersect.
        An unknown value in any list simply selects nothing.
      x-required-scope: read
      security:
        - sessionAuth: []
        - apiKeyAuth: []
      parameters:
        - $ref: "#/components/parameters/Slug"
        - name: severity
          in: query
          description: Comma-separated severities (critical, high, medium, low, none).
          schema: { type: string, example: "critical,high" }
        - name: status
          in: query
          description: Comma-separated lifecycle states (open, fixed, reopened).
          schema: { type: string, example: open }
        - name: kind
          in: query
          description: Comma-separated finding kinds (sca, sast, iac, secret, dast).
          schema: { type: string, example: "sca,sast" }
        - name: environment
          in: query
          description: Comma-separated environment names.
          schema: { type: string }
        - name: target
          in: query
          description: Comma-separated target names.
          schema: { type: string }
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
      responses:
        "200":
          description: |
            The matching findings. `X-Total-Count` carries the size of the
            filtered set, independent of `limit`/`offset`.
          headers:
            X-Total-Count:
              description: Size of the filtered set across every page.
              schema: { type: integer }
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Finding" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/findings/{id}:
    get:
      tags: [Findings]
      operationId: getFinding
      summary: Read a finding
      description: Includes scan context, remediation, location, suggestion, and CVE intel when known.
      x-required-scope: read
      security:
        - sessionAuth: []
        - apiKeyAuth: []
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: The finding.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Finding" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/ProjectAccessDenied" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      tags: [Findings]
      operationId: triageFinding
      summary: Record an analyst decision
      description: |
        Moves the finding's triage standing and returns the resulting gate
        effect. `state` is deliberately absent: it tracks the scan lifecycle and
        only ingest, verification, and the expiry sweeps move it.

        States that ignore the gate (`false_positive`, `not_affected`,
        `accepted_risk`, `wont_fix`) require a `reason`; `accepted_risk` and
        `wont_fix` also require `analysis_expires_at`.
      x-required-scope: admin
      security:
        - sessionAuth: []
        - apiKeyAuth: []
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TriageRequest" }
      responses:
        "200":
          description: Decided.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TriageResult" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/Unprocessable" }

  /api/v1/findings/bulk-analysis:
    post:
      tags: [Findings]
      operationId: bulkTriage
      summary: Apply one decision to many findings
      description: |
        Same analysis-state vocabulary and validation as the single-finding
        path, applied atomically across up to 1000 findings. Partial success is
        not reported: any invalid id, unknown finding, or missing reason fails
        the whole batch.
      x-required-scope: admin
      security:
        - sessionAuth: []
        - apiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BulkTriageRequest" }
      responses:
        "200":
          description: Applied.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BulkTriageResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/Unprocessable" }

  /api/v1/findings/{id}/events:
    get:
      tags: [Findings]
      operationId: listFindingEvents
      summary: Read a finding's audit trail
      description: State changes, triage decisions, and system events left by the expiry sweeps.
      x-required-scope: read
      security:
        - sessionAuth: []
        - apiKeyAuth: []
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: The events, oldest first.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/FindingEvent" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/findings/{id}/verify:
    post:
      tags: [Findings]
      operationId: verifyFix
      summary: Ask whether the finding is still present
      description: |
        Compares the finding against the latest **complete** scan of the same
        scope. Returns `still_present`, `inconclusive` when the newest evidence
        cannot vouch for completeness, or `verified_fixed`, which also moves the
        scan-derived state to `fixed` while leaving any analyst decision intact.
      x-required-scope: admin
      security:
        - sessionAuth: []
        - apiKeyAuth: []
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: The verdict.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/VerifyResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/findings/{id}/patch-preview:
    get:
      tags: [Previews]
      operationId: previewPatch
      summary: Plan a remediation patch
      description: |
        Plans a dependency bump without applying anything. Findings whose class
        has no mechanical fix return `supported: false` with a reason instead of
        a partial patch.
      x-required-scope: read
      security:
        - sessionAuth: []
        - apiKeyAuth: []
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: The plan or a refusal.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PatchPreview" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/ProjectAccessDenied" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/findings/{id}/notify-preview:
    get:
      tags: [Previews]
      operationId: previewNotification
      summary: Plan a tracker notification
      description: Plans the issue or message that would be created, without calling any tracker.
      x-required-scope: read
      security:
        - sessionAuth: []
        - apiKeyAuth: []
      parameters:
        - $ref: "#/components/parameters/Id"
        - name: channel
          in: query
          required: true
          description: "`issue` or `message`."
          schema: { type: string, enum: [issue, message] }
        - name: target
          in: query
          required: true
          description: Integration and scope to notify, as `integration:scope`.
          schema: { type: string }
        - name: linked
          in: query
          description: Set when the finding is already linked, so the plan describes an update.
          schema: { type: boolean }
      responses:
        "200":
          description: The plan or a refusal.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NotifyPreview" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/ProjectAccessDenied" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/findings/{findingID}/evidence:
    post:
      tags: [Evidence]
      operationId: createEvidence
      summary: Attach evidence
      x-required-scope: admin
      security:
        - sessionAuth: []
        - apiKeyAuth: []
      parameters:
        - $ref: "#/components/parameters/FindingID"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateEvidenceRequest" }
      responses:
        "201":
          description: Attached.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Evidence" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    get:
      tags: [Evidence]
      operationId: listEvidence
      summary: List evidence
      x-required-scope: read
      security:
        - sessionAuth: []
        - apiKeyAuth: []
      parameters:
        - $ref: "#/components/parameters/FindingID"
      responses:
        "200":
          description: The attached evidence.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Evidence" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/findings/{findingID}/evidence/{evidenceID}:
    delete:
      tags: [Evidence]
      operationId: deleteEvidence
      summary: Detach evidence
      x-required-scope: admin
      security:
        - sessionAuth: []
        - apiKeyAuth: []
      parameters:
        - $ref: "#/components/parameters/FindingID"
        - name: evidenceID
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "204": { $ref: "#/components/responses/NoContent" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/findings/{findingID}/reachability:
    post:
      tags: [Reachability]
      operationId: upsertReachability
      summary: Record a reachability assessment
      description: |
        Upserts in place, so one finding has at most one assessment. An expert
        `not_reachable` claim exempts the finding from the gate — including the
        ingress gate and the watcher's `require_triage` mode — until the
        assessment is lifted.
      x-required-scope: admin
      security:
        - sessionAuth: []
        - apiKeyAuth: []
      parameters:
        - $ref: "#/components/parameters/FindingID"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpsertReachabilityRequest" }
      responses:
        "200":
          description: Assessed.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Reachability" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    get:
      tags: [Reachability]
      operationId: listReachability
      summary: List reachability assessments
      x-required-scope: read
      security:
        - sessionAuth: []
        - apiKeyAuth: []
      parameters:
        - $ref: "#/components/parameters/FindingID"
      responses:
        "200":
          description: The assessments for this finding.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Reachability" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/v1/findings/{findingID}/signoff:
    post:
      tags: [Signoff]
      operationId: upsertSignoff
      summary: Record a reviewer decision
      x-required-scope: admin
      security:
        - sessionAuth: []
        - apiKeyAuth: []
      parameters:
        - $ref: "#/components/parameters/FindingID"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpsertSignoffRequest" }
      responses:
        "200":
          description: Recorded.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Signoff" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    get:
      tags: [Signoff]
      operationId: getSignoff
      summary: Read the reviewer decision
      x-required-scope: read
      security:
        - sessionAuth: []
        - apiKeyAuth: []
      parameters:
        - $ref: "#/components/parameters/FindingID"
      responses:
        "200":
          description: The signoff.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Signoff" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/projects/{slug}/gate:
    get:
      tags: [Gate]
      operationId: getGateStatus
      summary: Evaluate the deployment gate
      description: |
        With no `severity` parameter the project's effective policy supplies the
        floor. With `introduced_only` the verdict covers only the findings
        `report_id` introduced, so pre-existing debt on the long-lived branch
        never fails a pull request.
      x-required-scope: read
      security:
        - sessionAuth: []
        - apiKeyAuth: []
      parameters:
        - $ref: "#/components/parameters/Slug"
        - name: severity
          in: query
          description: Overrides the policy floor. A list floors at its lowest-named severity.
          schema: { type: string, example: "high,critical" }
        - name: introduced_only
          in: query
          description: Scope the verdict to what one report introduced.
          schema: { type: boolean }
        - name: report_id
          in: query
          description: Required when `introduced_only` is set.
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: The verdict.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GateStatus" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/projects/{slug}/pr-check:
    get:
      tags: [Gate]
      operationId: previewPRCheck
      summary: Plan the pull-request check
      description: |
        Returns the conclusion and annotations a provider check would publish,
        with no side effects — nothing is created, updated, or posted.
      x-required-scope: read
      security:
        - sessionAuth: []
        - apiKeyAuth: []
      parameters:
        - $ref: "#/components/parameters/Slug"
        - name: commit
          in: query
          required: true
          description: The commit under review.
          schema: { type: string }
        - name: provider
          in: query
          description: The CI provider whose annotation format to emit. Empty selects `github`, the only provider this build registers.
          schema: { type: string, enum: [github], default: github }
        - name: report_id
          in: query
          description: Ties the check to one exact scan; otherwise scoped by commit.
          schema: { type: string, format: uuid }
        - name: severity
          in: query
          description: Floor for the findings the check considers. Defaults to high.
          schema: { type: string }
      responses:
        "200":
          description: The plan.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PRCheckPreview" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/ProjectAccessDenied" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/policy-templates:
    get:
      tags: [Policy]
      operationId: listPolicyTemplates
      summary: List policy templates
      x-auth: session
      x-required-role: admin
      security:
        - sessionAuth: []
      responses:
        "200":
          description: The templates.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/PolicyTemplate" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/SessionRequired" }
    post:
      tags: [Policy]
      operationId: createPolicyTemplate
      summary: Create a policy template
      description: |
        The definition is a flat string map. An unknown key or value is rejected
        with `400 invalid_policy` rather than being dropped, so a typo can never
        silently widen a floor. Redefining an existing name bumps its version.
      x-auth: session
      x-required-role: admin
      security:
        - sessionAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PolicyTemplateRequest" }
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PolicyTemplate" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/SessionRequired" }
        "409":
          description: A template with that name already exists.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              example: { error: { code: policy_conflict, message: policy template already exists } }

  /api/v1/policy-templates/{id}:
    put:
      tags: [Policy]
      operationId: updatePolicyTemplate
      summary: Redefine a policy template
      description: Bumps the template's version.
      x-auth: session
      x-required-role: admin
      security:
        - sessionAuth: []
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PolicyTemplateRequest" }
      responses:
        "200":
          description: Updated.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PolicyTemplate" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/SessionRequired" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: The new name collides with another template.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
    delete:
      tags: [Policy]
      operationId: deletePolicyTemplate
      summary: Delete a policy template
      description: Projects linked to it fall back to their overrides and then the default.
      x-auth: session
      x-required-role: admin
      security:
        - sessionAuth: []
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "204": { $ref: "#/components/responses/NoContent" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/SessionRequired" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/projects/{slug}/policy:
    get:
      tags: [Policy]
      operationId: getEffectivePolicy
      summary: Read the effective policy
      description: Returns the resolved policy plus which layer supplied each value.
      x-required-scope: read
      security:
        - sessionAuth: []
        - apiKeyAuth: []
      parameters:
        - $ref: "#/components/parameters/Slug"
      responses:
        "200":
          description: The effective policy.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PolicyEffective" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/ProjectAccessDenied" }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      tags: [Policy]
      operationId: setProjectPolicy
      summary: Link a policy template
      description: Precedence is override > template > default.
      x-required-scope: admin
      security:
        - sessionAuth: []
        - apiKeyAuth: []
      parameters:
        - $ref: "#/components/parameters/Slug"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SetPolicyRequest" }
      responses:
        "200":
          description: The resulting effective policy.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PolicyEffective" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/projects/{slug}/policy/overrides:
    put:
      tags: [Policy]
      operationId: setProjectPolicyOverrides
      summary: Set per-project overrides
      description: Overrides win over the linked template. An invalid key or value is rejected.
      x-required-scope: admin
      security:
        - sessionAuth: []
        - apiKeyAuth: []
      parameters:
        - $ref: "#/components/parameters/Slug"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SetPolicyOverridesRequest" }
      responses:
        "200":
          description: The resulting effective policy.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PolicyEffective" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/v1/projects/{slug}/waivers:
    get:
      tags: [Waivers]
      operationId: listWaivers
      summary: List a project's waivers
      x-required-scope: read
      security:
        - sessionAuth: []
        - apiKeyAuth: []
      parameters:
        - $ref: "#/components/parameters/Slug"
      responses:
        "200":
          description: The waivers.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Waiver" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    post:
      tags: [Waivers]
      operationId: createWaiver
      summary: Create a waiver
      description: |
        A waiver suppresses the findings it targets, or the findings its
        conditions match, until it expires or is disabled. An expiry sweep
        disables it automatically and records why.
      x-required-scope: admin
      security:
        - sessionAuth: []
        - apiKeyAuth: []
      parameters:
        - $ref: "#/components/parameters/Slug"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateWaiverRequest" }
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Waiver" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "500": { $ref: "#/components/responses/InternalError" }

  /api/v1/projects/{slug}/waivers/{id}:
    get:
      tags: [Waivers]
      operationId: getWaiver
      summary: Read a waiver
      x-required-scope: read
      security:
        - sessionAuth: []
        - apiKeyAuth: []
      parameters:
        - $ref: "#/components/parameters/Slug"
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: The waiver with its conditions, contexts, and finding targets.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Waiver" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      tags: [Waivers]
      operationId: updateWaiver
      summary: Update a waiver
      description: |
        `expires_at` is a tri-state: omitting it keeps the stored expiry, `""`
        clears it, and an RFC 3339 value sets it.
      x-required-scope: admin
      security:
        - sessionAuth: []
        - apiKeyAuth: []
      parameters:
        - $ref: "#/components/parameters/Slug"
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateWaiverRequest" }
      responses:
        "200":
          description: Updated.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Waiver" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      tags: [Waivers]
      operationId: deleteWaiver
      summary: Delete a waiver
      description: The gate re-blocks the findings it was suppressing.
      x-required-scope: admin
      security:
        - sessionAuth: []
        - apiKeyAuth: []
      parameters:
        - $ref: "#/components/parameters/Slug"
        - $ref: "#/components/parameters/Id"
      responses:
        "204": { $ref: "#/components/responses/NoContent" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/projects/{slug}/waivers/{id}/toggle:
    post:
      tags: [Waivers]
      operationId: toggleWaiver
      summary: Enable or disable a waiver
      description: Disables an active waiver, or re-enables a disabled one, without deleting it.
      x-required-scope: admin
      security:
        - sessionAuth: []
        - apiKeyAuth: []
      parameters:
        - $ref: "#/components/parameters/Slug"
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: The waiver in its new state.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Waiver" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/projects/{slug}/waivers/{id}/events:
    get:
      tags: [Waivers]
      operationId: listWaiverEvents
      summary: Read a waiver's audit trail
      description: "`created`, `updated`, `enabled`, `disabled`, and `auto_disabled` events."
      x-required-scope: read
      security:
        - sessionAuth: []
        - apiKeyAuth: []
      parameters:
        - $ref: "#/components/parameters/Slug"
