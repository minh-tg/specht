  /api/v1/projects/{slug}/stats:
    get:
      tags: [Insights]
      operationId: getProjectStats
      summary: Read the project roll-up
      description: |
        Counts findings by severity, with the blocking subset, plus waiver and
        report totals and the newest report.
      x-required-scope: read
      security:
        - sessionAuth: []
        - apiKeyAuth: []
      parameters:
        - $ref: "#/components/parameters/Slug"
      responses:
        "200":
          description: The roll-up.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProjectStats" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/ProjectAccessDenied" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/InternalError" }

  /api/v1/projects/{slug}/aging:
    get:
      tags: [Insights]
      operationId: getAging
      summary: Read the aging and SLA snapshot
      description: |
        Buckets open findings by age (`new` under 7 days, `aging` under 30,
        `stale` under 90, `debt` beyond), reports which have passed their
        severity's SLA, and trends new findings over the trailing twelve weeks.

        The SLA table is critical 7 days, high 30, medium 90, low 180, unknown
        90. Only open and reopened findings can be overdue.
      x-required-scope: read
      security:
        - sessionAuth: []
        - apiKeyAuth: []
      parameters:
        - $ref: "#/components/parameters/Slug"
      responses:
        "200":
          description: The snapshot.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AgingResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/ProjectAccessDenied" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/InternalError" }

  /api/v1/admin/status:
    get:
      tags: [Admin]
      operationId: getAdminStatus
      summary: Read the platform snapshot
      x-auth: session
      x-required-role: admin
      security:
        - sessionAuth: []
      responses:
        "200":
          description: The snapshot.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminStatus" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/SessionRequired" }

  /api/v1/admin/retention/preview:
    get:
      tags: [Admin]
      operationId: previewRetention
      summary: Preview a retention purge
      description: Reports how many settled reports fall outside the window, deleting nothing.
      x-auth: session
      x-required-role: admin
      security:
        - sessionAuth: []
      parameters:
        - name: days
          in: query
          required: true
          description: Retention window in days, 1–3650.
          schema: { type: integer, minimum: 1, maximum: 3650 }
      responses:
        "200":
          description: The preview.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RetentionPreview" }
        "400":
          description: The window is missing or out of range.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              example: { error: { code: invalid_window, message: days must be between 1 and 3650 } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/SessionRequired" }

  /api/v1/admin/retention/purge:
    post:
      tags: [Admin]
      operationId: purgeRetention
      summary: Purge reports outside the window
      description: Deletes settled reports past the window. Findings survive their reports.
      x-auth: session
      x-required-role: admin
      security:
        - sessionAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PurgeRetentionRequest" }
      responses:
        "200":
          description: The result.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RetentionResult" }
        "400":
          description: The window is out of range.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              example: { error: { code: invalid_window, message: older_than_days must be between 1 and 3650 } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/SessionRequired" }
        "500": { $ref: "#/components/responses/InternalError" }

  /api/v1/watcher/status:
    get:
      tags: [Watcher]
      operationId: getWatcherStatus
      summary: Read the CVE watcher's health
      description: |
        Daemon-wide state, so it is session-admin only — a project key is
        refused. Reports the last successful and attempted polls, the last
        error, consecutive failures, and whether the watermark is stale.
      x-auth: session
      x-required-role: admin
      security:
        - sessionAuth: []
      responses:
        "200":
          description: The health snapshot.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WatcherStatus" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/SessionRequired" }
        "500": { $ref: "#/components/responses/InternalError" }

components:
  securitySchemes:
    sessionAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        Session JWT from `/auth/login`, `/auth/refresh`, or the SSO callback.
        Carries a role: `admin`, `editor`, or `viewer`. Rejected on routes
        marked `x-auth: session` only when the credential is actually an API
        key — a session is always accepted there.
    apiKeyAuth:
      type: http
      scheme: bearer
      description: |
        Project-scoped API key from `/auth/apikeys`, always prefixed `vuln_`.
        Carries any of the scopes `ingest`, `read`, `admin`, and is bound to one
        project, so it can never read another. Routes marked `x-auth: session`
        refuse it outright.

  parameters:
    Slug:
      name: slug
      in: path
      required: true
      description: Project slug. Chosen by the caller and unique across the platform; lowercase with hyphens is the convention, but the server only requires it to be non-empty.
      schema: { type: string, example: my-app }
    Id:
      name: id
      in: path
      required: true
      description: Resource identifier.
      schema: { type: string, format: uuid }
    FindingID:
      name: findingID
      in: path
      required: true
      description: Finding identifier.
      schema: { type: string, format: uuid }
    Limit:
      name: limit
      in: query
      description: Page size. Default 20, maximum 500. A malformed, negative, or oversized value falls back to the default.
      schema: { type: integer, minimum: 0, maximum: 500, default: 20 }
    Offset:
      name: offset
      in: query
      description: Items to skip.
      schema: { type: integer, minimum: 0, default: 0 }

  responses:
    NoContent:
      description: Done; no body.
    BadRequest:
      description: The request body or parameters were rejected.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          examples:
            invalidJson:
              value: { error: { code: invalid_json, message: invalid request body } }
            missingField:
              value: { error: { code: missing_field, message: name and slug are required } }
            invalidId:
              value: { error: { code: invalid_id, message: invalid finding id format } }
    Unauthorized:
      description: Missing or invalid credential.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          examples:
            missingToken:
              value: { error: { code: missing_token, message: authorization header required } }
            invalidToken:
              value: { error: { code: invalid_token, message: invalid or expired token } }
    Forbidden:
      description: Authenticated but not allowed.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          examples:
            insufficientRole:
              value: { error: { code: insufficient_role, message: requires admin role } }
            insufficientScope:
              value: { error: { code: insufficient_scope, message: API key does not have the required scope for this route } }
    SessionRequired:
      description: This route needs an authenticated session; project API keys are refused.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          example: { error: { code: insufficient_role, message: session authentication required } }
    ProjectAccessDenied:
      description: The caller is not a member of the project, or the key is bound to another one.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          example: { error: { code: project_access_denied, message: project access denied } }
    NotFound:
      description: The resource does not exist, or is not visible to the caller.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          example: { error: { code: not_found, message: not found } }
    BodyTooLarge:
      description: The request body exceeded the size cap.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          example: { error: { code: body_too_large, message: request body too large } }
    Unprocessable:
      description: The request was understood but rejected on a domain rule.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          examples:
            reasonRequired:
              value: { error: { code: reason_required, message: reason is required for this analysis state } }
            expiryRequired:
              value: { error: { code: expiry_required, message: expiry is required for accepted_risk and wont_fix } }
            invalidState:
              value: { error: { code: invalid_state, message: invalid analysis state } }
    InternalError:
      description: Unexpected server error.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          example: { error: { code: internal_error, message: internal server error } }

  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              description: Stable machine-readable code; branch on this, not on `message`.
              example: not_found
            message: { type: string, example: project not found }

    Health:
      type: object
      required: [status, version, commit]
      properties:
        status: { type: string, example: ok }
        version: { type: string, example: 1.0.0 }
        commit: { type: string, example: 54b60df }

    Version:
      type: object
      required: [version, commit]
      properties:
        version: { type: string }
        commit: { type: string }

    EmailPasswordRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email }
        password: { type: string, format: password, minLength: 8 }

    RefreshRequest:
      type: object
      required: [refresh_token]
      properties:
        refresh_token: { type: string }

    AuthResponse:
      type: object
      required: [token, user_id, email]
      properties:
        token: { type: string, description: "Access token for `Authorization: Bearer`." }
        refresh_token: { type: string, description: Absent on refresh responses that do not rotate. }
        user_id: { type: string, format: uuid }
        email: { type: string, format: email }

    UserProfile:
      type: object
      required: [id, email, role, created_at]
      properties:
        id: { type: string, format: uuid }
        email: { type: string, format: email }
        display_name:
          type: string
          description: Omitted when the account has no display name.
        role:
          type: string
          description: |
            The stored account role. `member` is the legacy value written by
            self-service registration; token issuance maps it to `viewer`, and
            an operator promotion writes `admin`.
          enum: [admin, member]
        created_at: { type: string, format: date-time }

    ProfileUpdateRequest:
      type: object
      properties:
        display_name:
          type: [string, "null"]
          description: Omit to leave unchanged; `""` clears it.

    ApiKey:
      type: object
      required: [id, name, key_prefix, created_at]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        key_prefix: { type: string, example: vuln }
        raw_key:
          type: string
          description: The secret. Present only in the creation response.
          example: vuln_9f8c7d6e5b4a39281706
        last_four: { type: [string, "null"] }
        created_at: { type: string, format: date-time }
        expires_at: { type: [string, "null"], format: date-time }

    CreateApiKeyRequest:
      type: object
      required: [project, name]
      properties:
        project: { type: string, description: Slug of the project the key is bound to. }
        name: { type: string }
        expires_at:
          type: string
          description: RFC 3339. Omit for a key that never expires.
          example: "2026-12-31T00:00:00Z"

    Project:
      type: object
      required: [id, slug, name, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        slug: { type: string }
        name: { type: string }
        description: { type: [string, "null"] }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    CreateProjectRequest:
      type: object
      required: [name, slug]
      properties:
        name: { type: string }
        slug:
          type: string
          description: Unique URL-safe identifier for the project. The server requires only that it is non-empty and unused.
          example: my-app
        description: { type: string }

    UpdateProjectRequest:
      type: object
      properties:
        name: { type: [string, "null"], description: Omit to leave unchanged. }
        description: { type: [string, "null"], description: Omit to leave unchanged. }

    Scanner:
      type: object
      required: [name, version, finding_kinds, scan_types, provides_packages, supports_auto_detection]
      properties:
        name: { type: string, example: trivy }
        version: { type: string }
        finding_kinds:
          type: array
          items: { type: string, enum: [sca, sast, iac, secret, dast] }
        scan_types:
          type: array
          items: { type: string, example: image }
        provides_packages: { type: boolean }
        supports_auto_detection: { type: boolean }

    IngestRequest:
      type: object
      required: [project, scanner, raw_data]
      properties:
        project: { type: string, description: Project slug. }
        scanner:
          type: string
          description: Registered scanner name.
          example: trivy
        scanner_version: { type: string, description: Recorded for provenance. }
        parser_version: { type: string, description: Recorded for provenance. }
        raw_data:
          description: The scanner's output, byte for byte. JSONL may be sent as a JSON array.
          oneOf:
            - type: object
            - type: array
        branch: { type: string }
        commit_sha: { type: string }
        base_revision:
          type: string
          description: Required when `scan_mode` is `incremental`; the revision to compare against.
        changed_files:
          type: array
          items: { type: string }
        scan_mode: { type: string, enum: [full, incremental], default: full }
        gate_severity: { type: string, description: Comma-separated override for the post-ingest threshold check. }
        gate_status: { type: string, description: Comma-separated status override for the post-ingest threshold check. }
        gate_introduced_only:
          type: boolean
          description: Scope the post-ingest threshold check to what this report introduced.
        environment: { type: string, description: Deployment environment. Derived from the report when empty. }
        owner: { type: string, description: "Repository identity as `provider://owner/repo`." }
        digest: { type: string, description: "Content digest of the scanned artifact, e.g. `sha256:...`." }
        artifact_name: { type: string }
        artifact_version: { type: string }
        artifact_type: { type: string, example: container-image }

    IngestResponse:
      type: object
      required: [report_id, total_findings, threshold_breached, scan_mode, introduced_count, pre_existing_count]
      properties:
        report_id: { type: string, format: uuid }
        total_findings: { type: integer, description: "Every entry the scanner reported, before fingerprint deduplication." }
        threshold_breached: { type: boolean }
        scan_mode: { type: string, enum: [full, incremental], description: The mode actually used. }
        fallback_reason:
          type: string
          description: Present when an incremental scan had to fall back to full.
          enum: [unsupported_scanner, missing_baseline]
        introduced_count: { type: integer }
        pre_existing_count: { type: integer }

    Report:
      type: object
      required: [id, project_id, tool_name, scan_type, status, created_at]
      properties:
        id: { type: string, format: uuid }
        project_id: { type: string, format: uuid }
        tool_name: { type: string, example: trivy }
        tool_version: { type: [string, "null"] }
        scan_type: { type: string, example: image }
        scan_target: { type: [string, "null"] }
        status: { type: string, enum: [pending, completed, failed] }
        total_findings: { type: [integer, "null"] }
        branch: { type: [string, "null"] }
        commit_sha: { type: [string, "null"] }
        base_revision: { type: string }
        scan_mode: { type: string, enum: [full, incremental] }
        changed_files:
          type: array
          items: { type: string }
        created_at: { type: string, format: date-time }
        completed_at: { type: [string, "null"], format: date-time }

    Finding:
      type: object
      required: [id, project_id, finding_kind, fingerprint, current_title, current_severity, state, analysis_state, gate_effect, first_seen_at, last_seen_at]
      properties:
        id: { type: string, format: uuid }
        project_id: { type: string, format: uuid }
        finding_kind: { type: string, enum: [sca, sast, iac, secret, dast] }
        fingerprint: { type: string, description: Stable identity across scans; the dedupe key. }
        current_title: { type: string }
        current_severity: { type: string, enum: [critical, high, medium, low, none] }
        current_score: { type: [number, "null"], description: CVSS score when the scanner supplied one. }
        state:
          type: string
          description: Scan lifecycle. Moved only by ingest, verification, and the expiry sweeps.
        triage_status: { type: string }
        analysis_state:
          type: string
          description: The analyst's standing.
          enum: [unanalyzed, in_triage, exploitable, false_positive, not_affected, accepted_risk, wont_fix]
        gate_effect: { type: string, enum: [block, ignore] }
        first_seen_at: { type: string, format: date-time }
        last_seen_at: { type: string, format: date-time }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        introduced_by_report_id: { type: string, format: uuid }
        introduced_commit_sha: { type: string }
        context: { $ref: "#/components/schemas/FindingContext" }
        remediation: { $ref: "#/components/schemas/Remediation" }
        location: { $ref: "#/components/schemas/Location" }
        suggestion: { $ref: "#/components/schemas/Suggestion" }
        intel:
          $ref: "#/components/schemas/Intel"
          description: Present for CVE-shaped findings whose identifier a configured feed knows.

    FindingContext:
      type: object
      properties:
        target_name: { type: string }
        target_kind: { type: string }
        target_owner: { type: string }
        environment_name: { type: string }
        branch: { type: string }
        commit_sha: { type: string }
        source_link: { type: string, format: uri }

    Remediation:
      type: object
      properties:
        summary: { type: string }
        url: { type: string, format: uri }
        source: { type: string }
        fallback: { type: boolean }

    Location:
      type: object
      properties:
        file: { type: string }
        start_line: { type: integer }
        end_line: { type: integer }
        resource: { type: string }
        summary: { type: string }

    Suggestion:
      type: object
      required: [action, confidence]
      properties:
        action: { type: string }
        target: { type: string }
        detail: { type: string }
        confidence: { type: string, enum: [low, medium, high] }
        source: { type: string }

    Intel:
      type: object
      required: [cve_id, kev, sources, fetched_at]
      properties:
        cve_id: { type: string, example: CVE-2026-1234 }
        epss:
          type: [number, "null"]
          minimum: 0
          maximum: 1
          description: EPSS exploit probability.
        epss_date: { type: string }
        kev: { type: boolean, description: Listed in CISA's Known Exploited Vulnerabilities catalog. }
        kev_added: { type: string }
        sources:
          type: array
          items: { type: string, example: epss }
        fetched_at: { type: string, format: date-time }
        stale:
          type: boolean
          description: True when a refresh failed and the served record is past its TTL.

    FindingEvent:
      type: object
      required: [id, finding_id, user_id, event_type, created_at]
      properties:
        id: { type: string, format: uuid }
        finding_id: { type: string, format: uuid }
        user_id: { type: string, description: Empty for system events left by the expiry sweeps. }
        event_type: { type: string, example: state_changed }
        old_value: { type: string }
        new_value: { type: string }
        comment: { type: string }
        changes:
          type: string
          description: Base64-encoded JSON with the structured detail of the change.
        created_at: { type: string, format: date-time }

    TriageRequest:
      type: object
      required: [analysis_state]
      properties:
        analysis_state:
          type: string
          enum: [unanalyzed, in_triage, exploitable, false_positive, not_affected, accepted_risk, wont_fix]
        reason:
          type: string
          description: Required for states that ignore the gate.
        analysis_expires_at:
          type: string
          format: date-time
          description: Required for `accepted_risk` and `wont_fix`; the expiry sweep resets those findings.

    TriageResult:
      type: object
      required: [finding_id, analysis_state, gate_effect]
      properties:
        finding_id: { type: string, format: uuid }
        analysis_state: { type: string }
        gate_effect: { type: string, enum: [block, ignore] }

    BulkTriageRequest:
      type: object
      required: [finding_ids, analysis_state]
      properties:
        finding_ids:
          type: array
          maxItems: 1000
          items: { type: string, format: uuid }
        analysis_state: { type: string }
        reason: { type: string }
        analysis_expires_at: { type: string, format: date-time }

    BulkTriageResponse:
      type: object
      required: [results]
      properties:
        results:
          type: array
          items: { $ref: "#/components/schemas/TriageResult" }

    VerifyResponse:
      type: object
      required: [finding_id, outcome, detail]
      properties:
        finding_id: { type: string, format: uuid }
        outcome: { type: string, enum: [still_present, verified_fixed, inconclusive] }
        report_id:
          type: string
          format: uuid
          description: The report that supplied the verdict.
        detail: { type: string }

    PatchPreview:
      type: object
      required: [supported]
      properties:
        supported: { type: boolean }
        reason: { type: string, description: "Why no patch was planned, when `supported` is false." }
        proposal: { $ref: "#/components/schemas/PatchProposal" }

    PatchProposal:
      type: object
      required: [id, finding_id, class, confidence, rationale, evidence, edits, apply_mode, verify_by]
      properties:
        id: { type: string }
        finding_id: { type: string, format: uuid }
        class: { type: string, example: dependency-bump }
        confidence: { type: string, enum: [low, medium, high] }
        rationale: { type: string }
        evidence: { $ref: "#/components/schemas/PatchEvidence" }
        edits:
          type: array
          items: { $ref: "#/components/schemas/PatchFileEdit" }
        apply_mode: { type: string }
        verify_by: { type: string }

    PatchEvidence:
      type: object
      properties:
        report_id: { type: string, format: uuid }
        scanner: { type: string }
        commit_sha: { type: string }
        package: { type: string }
        installed_version: { type: string }
        fixed_version: { type: string }
        manifest_file: { type: string }

    PatchFileEdit:
      type: object
      required: [operation, package, to_version]
      properties:
        file: { type: string }
        operation: { type: string, enum: [bump] }
        package: { type: string }
        from_version: { type: string }
        to_version: { type: string }

    NotifyPreview:
      type: object
      required: [supported]
      properties:
        supported: { type: boolean }
        reason: { type: string, description: "Why nothing would be sent, when `supported` is false." }
        plan: { $ref: "#/components/schemas/NotifyPlan" }

    NotifyPlan:
      type: object
      required: [id, channel, target, action, title, body, links, dedupe_key, reason]
      properties:
        id: { type: string }
        channel: { type: string, enum: [issue, message] }
        target: { type: string }
        action: { type: string, enum: [create, update] }
        title: { type: string }
        body: { type: string }
        links: { $ref: "#/components/schemas/NotifyLinks" }
        dedupe_key: { type: string }
        reason: { type: string }

    NotifyLinks:
      type: object
      properties:
        finding: { type: string, format: uri }
        project: { type: string, format: uri }
        fix: { type: string, format: uri }

    Evidence:
      type: object
      required: [id, finding_id, type, url, description, created_at]
      properties:
        id: { type: string, format: uuid }
        finding_id: { type: string, format: uuid }
        type: { type: string, example: ticket }
        url: { type: string }
        description: { type: string }
        uploaded_by: { type: [string, "null"], format: uuid }
        created_at: { type: string, format: date-time }

    CreateEvidenceRequest:
      type: object
      required: [type]
      properties:
        type: { type: string, description: "Evidence kind, for example `ticket`, `screenshot`, or `log`." }
        url: { type: string, format: uri }
        description: { type: string }

    Reachability:
      type: object
      required: [id, finding_id, state, evidence, assessed_by, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        finding_id: { type: string, format: uuid }
        state: { type: string, enum: [reachable, not_reachable, unknown, not_applicable], description: "Expert verdict. `not_reachable` exempts the finding from the gate." }
        evidence: { type: string }
        assessed_by: { type: string, format: uuid }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    UpsertReachabilityRequest:
      type: object
      required: [state]
      properties:
        state: { type: string, enum: [reachable, not_reachable, unknown, not_applicable] }
        evidence: { type: string }

    Signoff:
      type: object
      required: [id, finding_id, status, reviewed_by, comment, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        finding_id: { type: string, format: uuid }
        status: { type: string, enum: [pending, approved, rejected] }
        reviewed_by: { type: string, format: uuid }
        comment: { type: string }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    UpsertSignoffRequest:
      type: object
      required: [status]
      properties:
        status: { type: string, enum: [pending, approved, rejected] }
        comment: { type: string }

    GateStatus:
      type: object
      required: [threshold_breached, blocking_count]
      properties:
        threshold_breached:
          type: boolean
          description: The pipeline verdict. True means at least one finding blocks.
        blocking_count: { type: integer, format: int64 }
        blocked_by:
          type: array
          description: IDs of the findings that block.
          items: { type: string, format: uuid }
        blocked_by_reachability:
          type: object
          description: Each blocked finding's latest reachability assessment.
          additionalProperties: { type: string }
        waived_count: { type: integer, description: Blocking findings silenced by an active waiver. }
        policy: { $ref: "#/components/schemas/PolicyEffective" }

    PolicyEffective:
      type: object
      required: [template_version, severity_floor, severity_source, watcher_gate, watcher_source]
      properties:
        template_name: { type: [string, "null"] }
        template_version: { type: integer }
        severity_floor: { type: string, enum: [critical, high, medium, low, none] }
        severity_source:
          type: string
          description: The layer that supplied the floor.
          enum: [default, template, override]
        watcher_gate: { type: string, enum: [require_triage, immediate, off] }
        watcher_source: { type: string, enum: [default, template, override] }

    PRCheckPreview:
      type: object
      required: [provider, commit_sha, conclusion, title, summary, annotations, summary_counts, truncated, total_mappable, waived_count]
      properties:
        provider: { type: string, enum: [github] }
        commit_sha: { type: string }
        report_id: { type: string, format: uuid }
        conclusion: { type: string, enum: [success, failure, neutral] }
        title: { type: string }
        summary: { type: string }
        annotations:
          type: array
          items: { $ref: "#/components/schemas/PRCheckAnnotation" }
        summary_counts:
          type: object
          additionalProperties: { type: integer }
        truncated: { type: boolean }
        total_mappable: { type: integer }
        supersedes: { type: string }
        waived_count: { type: integer }

    PRCheckAnnotation:
      type: object
      required: [external_id, finding_id, file, start_line, end_line, level, title, message]
      properties:
        external_id: { type: string }
        finding_id: { type: string, format: uuid }
        file: { type: string }
        start_line: { type: integer }
        end_line: { type: integer }
        level: { type: string, enum: [info, warning, error] }
        title: { type: string }
        message: { type: string }

    PolicyTemplate:
      type: object
      required: [id, name, description, definition, version]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        description: { type: string }
        definition:
          type: object
          description: Flat string map of policy keys to values.
          additionalProperties: { type: string }
        version: { type: integer }

    PolicyTemplateRequest:
      type: object
      required: [name, definition]
      properties:
        name: { type: string }
        description: { type: string }
        definition:
          type: object
          additionalProperties: { type: string }

    SetPolicyRequest:
      type: object
      required: [template_name]
      properties:
        template_name: { type: string, description: Empty unlinks the template. }

    SetPolicyOverridesRequest:
      type: object
      required: [overrides]
      properties:
        overrides:
          type: object
          additionalProperties: { type: string }

    Waiver:
      type: object
      required: [id, project_id, name, description, enabled, conditions, contexts, targets, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        project_id: { type: string, format: uuid }
        name: { type: string }
        description: { type: string }
        enabled: { type: boolean }
        expires_at: { type: [string, "null"], format: date-time }
        conditions:
          type: array
          items: { $ref: "#/components/schemas/WaiverCondition" }
        contexts:
          type: array
          items: { $ref: "#/components/schemas/WaiverContext" }
        targets:
          type: array
          items: { $ref: "#/components/schemas/WaiverFindingTarget" }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    WaiverCondition:
      type: object
      required: [id, field, operator, value]
      properties:
        id: { type: string, format: uuid }
        field: { type: string, example: component.purl }
        operator: { type: string, example: equals }
        value: { type: string }

    WaiverContext:
      type: object
      required: [id]
      properties:
        id: { type: string, format: uuid }
        environment_id: { type: string, format: uuid }
        target_id: { type: string, format: uuid }
        artifact_id: { type: string, format: uuid }

    WaiverFindingTarget:
      type: object
      required: [id, finding_id]
      properties:
        id: { type: string, format: uuid }
        finding_id: { type: string, format: uuid }

    CreateWaiverRequest:
      type: object
      required: [name]
      properties:
        name: { type: string }
        description: { type: string }
        expires_at:
          type: string
          description: RFC 3339. Omit for a waiver that never expires.
          example: "2026-12-31T00:00:00Z"
        conditions:
          type: array
          items:
            type: object
            required: [field, operator, value]
            properties:
              field: { type: string }
              operator: { type: string }
              value: { type: string }
        contexts:
          type: array
          items:
            type: object
            properties:
              environment_id: { type: string, format: uuid }
              target_id: { type: string, format: uuid }
              artifact_id: { type: string, format: uuid }
        target_ids:
          type: array
          description: Finding IDs this waiver suppresses directly.
          items: { type: string, format: uuid }

    UpdateWaiverRequest:
      type: object
      properties:
        name: { type: string }
        description: { type: string }
        expires_at:
          type: [string, "null"]
          description: |
            Tri-state: omit to keep the stored expiry, send `""` to clear it,
            send an RFC 3339 value to set it.
        conditions:
          type: array
          items:
            type: object
            required: [field, operator, value]
            properties:
              field: { type: string }
              operator: { type: string }
              value: { type: string }
        contexts:
          type: array
          items:
            type: object
            properties:
              environment_id: { type: string, format: uuid }
              target_id: { type: string, format: uuid }
              artifact_id: { type: string, format: uuid }
        target_ids:
          type: array
          items: { type: string, format: uuid }

    WaiverEvent:
      type: object
      required: [id, waiver_id, event_type, created_at]
      properties:
        id: { type: string, format: uuid }
        waiver_id: { type: string, format: uuid }
        event_type: { type: string, enum: [created, updated, enabled, disabled, auto_disabled] }
        actor_id: { type: string, format: uuid }
        metadata:
          description: Event-specific detail, such as the reason an expiry sweep disabled the waiver.
        created_at: { type: string, format: date-time }

    CheckMatchRequest:
      type: object
      required: [finding_id]
      properties:
        finding_id: { type: string, format: uuid }

    CheckMatchResponse:
      type: object
      required: [matched]
      properties:
        matched: { type: boolean }

    Team:
      type: object
      required: [id, name, description]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        description: { type: string }

    CreateTeamRequest:
      type: object
      required: [name]
      properties:
        name: { type: string }
        description: { type: string }

    TeamMember:
      type: object
      required: [team_id, user_id, role]
      properties:
        team_id: { type: string, format: uuid }
        user_id: { type: string, format: uuid }
        user_email: { type: string, format: email }
        role: { type: string, enum: [admin, member] }

    AddMemberRequest:
      type: object
      required: [user_id, role]
      properties:
        user_id: { type: string, format: uuid }
        role: { type: string, enum: [admin, editor, viewer] }

    ProjectTeam:
      type: object
      required: [project_id, team_id, team_name, role]
      properties:
        project_id: { type: string, format: uuid }
        team_id: { type: string, format: uuid }
        team_name: { type: string }
        role: { type: string, enum: [admin, editor, viewer] }

    ProjectMember:
      type: object
      required: [project_id, user_id, role, created_at]
      properties:
        project_id: { type: string, format: uuid }
        user_id: { type: string, format: uuid }
        role: { type: string, enum: [admin, editor, viewer] }
        created_at: { type: string, format: date-time }

    Environment:
      type: object
      required: [id, project_id, name, tier, internet_facing, data_sensitivity, created_at]
      properties:
        id: { type: string, format: uuid }
        project_id: { type: string, format: uuid }
        name: { type: string }
        tier: { type: string }
        internet_facing: { type: boolean }
        data_sensitivity: { type: string }
        created_at: { type: string, format: date-time }

    Target:
      type: object
      required: [id, project_id, name, kind, created_at]
      properties:
        id: { type: string, format: uuid }
        project_id: { type: string, format: uuid }
        name: { type: string }
        kind: { type: string, example: container-image }
        locator: { type: string }
        created_at: { type: string, format: date-time }

    Artifact:
      type: object
      required: [id, project_id, artifact_type, name, created_at]
      properties:
        id: { type: string, format: uuid }
        project_id: { type: string, format: uuid }
        target_id: { type: string, format: uuid }
        artifact_type: { type: string, example: container-image }
        name: { type: string }
        version: { type: string }
        digest: { type: string }
        locator: { type: string }
        created_at: { type: string, format: date-time }

    ProjectStats:
      type: object
      required: [total_findings, blocking_count, waiver_count, report_count, by_severity]
      properties:
        total_findings: { type: integer }
        blocking_count:
          type: integer
          description: Findings not in an ignoring analysis state.
        waiver_count: { type: integer, description: Enabled waivers only. }
        report_count: { type: integer }
        by_severity:
          type: array
          items: { $ref: "#/components/schemas/SeverityCount" }
        latest_report: { $ref: "#/components/schemas/Report" }

    SeverityCount:
      type: object
      required: [severity, count, blocking_count]
      properties:
        severity: { type: string }
        count: { type: integer }
        blocking_count: { type: integer }

    AgingResponse:
      type: object
      required: [buckets, overdue_total, overdue, reopened, new_per_week]
      properties:
        buckets:
          type: array
          description: Always all four buckets, in age order.
          items: { $ref: "#/components/schemas/AgingBucket" }
        overdue_total:
          type: integer
          description: Every finding past its SLA; the `overdue` list is capped at 100.
        overdue:
          type: array
          description: The oldest overdue findings first.
          items: { $ref: "#/components/schemas/OverdueFinding" }
        reopened: { type: integer, description: Findings ever reopened. }
        new_per_week:
          type: array
          description: The trailing twelve weeks, oldest first.
          items: { $ref: "#/components/schemas/WeeklyNew" }

    AgingBucket:
      type: object
      required: [bucket, count, overdue]
      properties:
        bucket: { type: string, enum: [new, aging, stale, debt] }
        count: { type: integer }
        overdue: { type: integer }

    OverdueFinding:
      type: object
      required: [id, title, severity, age_days, sla_days, due_date, reopened]
      properties:
        id: { type: string, format: uuid }
        title: { type: string }
        severity: { type: string }
        age_days: { type: integer }
        sla_days: { type: integer }
        due_date: { type: string, format: date-time }
        reopened: { type: boolean }

    WeeklyNew:
      type: object
      required: [week, count]
      properties:
        week: { type: string, description: The Monday that starts the week. }
        count: { type: integer }

    AdminStatus:
      type: object
      required: [projects, users, open_findings, reports]
      properties:
        projects: { type: integer, format: int64 }
        users: { type: integer, format: int64 }
        open_findings: { type: integer, format: int64 }
        reports: { type: integer, format: int64 }
        oldest_settled_report_at: { type: [string, "null"], format: date-time }

    RetentionPreview:
      type: object
      required: [older_than_days, cutoff, stale_reports]
      properties:
        older_than_days: { type: integer }
        cutoff: { type: string, format: date-time }
        stale_reports: { type: integer, format: int64 }

    PurgeRetentionRequest:
      type: object
      required: [older_than_days]
      properties:
        older_than_days: { type: integer, minimum: 1, maximum: 3650 }

    RetentionResult:
      type: object
      required: [older_than_days, cutoff, deleted_reports]
      properties:
        older_than_days: { type: integer }
        cutoff: { type: string, format: date-time }
        deleted_reports: { type: integer, format: int64 }
        deleted_report_ids:
          type: array
          items: { type: string, format: uuid }
        truncated: { type: boolean }

    WatcherStatus:
      type: object
      required: [consecutive_failures, healthy, stale]
      properties:
        last_successful_poll_at: { type: string, format: date-time }
        last_poll_attempt_at: { type: string, format: date-time }
        last_error: { type: string }
        consecutive_failures: { type: integer }
        healthy: { type: boolean }
        stale: { type: boolean }
        staleness_window: { type: string, example: 2h0m0s }
