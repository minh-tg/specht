        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/ProjectAccessDenied" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/findings/{findingID}/evidence:
