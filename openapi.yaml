openapi: 3.1.0

info:
  title: Specht API
  version: 1.0.0
  summary: Vulnerability management for SCA, SAST, and IaC scan results.
  description: |
    Specht ingests scanner reports, tracks findings across scans, evaluates a
    deployment gate, and manages waivers, policy, teams, and threat intel.

    Everything lives under `/api/v1`. Authentication is always an
    `Authorization: Bearer <credential>` header carrying either a session JWT
    (from `/auth/login`, `/auth/refresh`, or the SSO callback) or a
    project-scoped API key (prefix `vuln_`, from `/auth/apikeys`).

    ## Authorization model

    Three gates apply, in order:

    1. **Credential type** — some routes require a session and reject API keys
       entirely (`x-auth: session`), because a project key cannot represent the
       authority they carry.
    2. **Role or scope** — session roles are `admin`, `manager`, `member`
       (`x-required-role`); API key scopes are `ingest` and `read`
       (`x-required-scope`). No key scope covers project management, so routes
       that need a manager or admin role are session only. Sessions pass scope
       checks and are then subject to project membership instead.
    3. **Project access** — the caller must be a member of the project (session)
       or the key must be bound to it (API key), otherwise the request fails
       with `403 project_access_denied`, or `404 not_found` when an admin asks
       about a project that does not exist.

    ## Conventions

    - List endpoints return a **bare JSON array**; pagination is
      `limit`/`offset` (default 20, maximum 500). A malformed, negative, or
      oversized limit falls back to the default rather than erroring.
    - Paginated lists carry **`X-Total-Count`**, the size of the filtered set
      independent of the page window, so a client can render "n of m" without
      walking the pages. Findings serves it today; a missing header means the
      total is unknown, not zero.
    - Timestamps are RFC 3339 with a UTC offset. Durations are Go duration
      strings (`30d` is not valid; use `720h`).
    - Errors share one envelope: `{"error": {"code": ..., "message": ...}}`.
    - Request bodies over 1 MiB are rejected with `413`; ingest bodies are
      capped at 25 MiB.
  license:
    name: AGPL-3.0
    identifier: AGPL-3.0-only

servers:
  - url: "{scheme}://{host}:{port}"
    description: |
      A Specht server. The defaults match a local development run; override
      them for a self-hosted deployment.
    variables:
      scheme:
        default: http
        enum: [http, https]
      host:
        default: localhost
      port:
        default: "8080"

tags:
  - name: Meta
    description: Liveness and build identity. Unauthenticated.
  - name: Authentication
    description: Account lifecycle, token rotation, and SSO.
  - name: Profile
    description: The signed-in user's own account.
  - name: API keys
    description: Project-scoped credentials for CI pipelines and agents.
  - name: Projects
    description: The tenancy root. Every finding, report, and waiver belongs to one.
  - name: Scanners
    description: The registered scanner catalog.
  - name: Reports
    description: Scan ingestion and report history.
  - name: Findings
    description: The consolidated finding record and its triage lifecycle.
  - name: Previews
    description: Side-effect-free planning endpoints used by the CLI, the adapter, and MCP tools.
  - name: Evidence
    description: Analyst-attached supporting artifacts.
  - name: Reachability
    description: Whether a vulnerable code path is actually reachable.
  - name: Signoff
    description: Reviewer approval records.
  - name: Gate
    description: The deployment / pull-request decision.
  - name: Policy
    description: Policy templates, project policy, and per-project overrides.
  - name: Waivers
    description: Time-boxed, conditioned suppressions with a live match check.
  - name: Teams
    description: Organization groups and their project links.
  - name: Project members
    description: Direct per-project grants.
  - name: Invites
    description: Single-use links that bring a person into a project, including while registration is closed.
  - name: Users
    description: The account directory that admin surfaces pick a user from.
  - name: Context
    description: Environments, targets, and artifacts derived from scan context.
  - name: Insights
    description: Aggregate statistics and SLA aging.
  - name: Admin
    description: Platform operations reserved for admins.
  - name: Watcher
    description: The CVE feed watcher daemon's health.

security: []

paths:
  /api/v1/health:
    get:
      tags: [Meta]
      operationId: getHealth
      summary: Liveness probe
      description: Unauthenticated. Reports the served version and commit.
      security: []
      responses:
        "200":
          description: The server is up.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Health" }

  /api/v1/ready:
    get:
      tags: [Meta]
      operationId: getReady
      summary: Readiness probe
      description: |
        Unauthenticated. Answers 200 when the instance can serve requests and
        503 while its database is unreachable. The body never says why; the
        reason goes to the server log. The answer is reused for one second, so
        probing it cannot load the database. The container HEALTHCHECK and load
        balancers use this; `/api/v1/health` stays a pure liveness probe.
      security: []
      responses:
        "200":
          description: Ready to serve.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Ready" }
        "503":
          description: Not ready.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Ready" }

  /api/v1/version:
    get:
      tags: [Meta]
      operationId: getVersion
      summary: Build identity
      description: Unauthenticated, so deployment tooling can verify what is running.
      security: []
      responses:
        "200":
          description: Build metadata.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Version" }

  /api/v1/capabilities:
    get:
      tags: [Meta]
      operationId: getCapabilities
      summary: Sign-in options this server offers
      description: |
        Unauthenticated, so a signed-out page can show a Register link or an
        SSO button only when they work, and the setup screen on a fresh
        install. Carries no secrets and no identity provider details. The
        flags change only when the server restarts, so the response may be
        cached for a minute. While `setup.required` is true it is sent with
        `Cache-Control: no-store`, because the answer flips as soon as setup
        completes.
      security: []
      responses:
        "200":
          description: The sign-in options and the build version.
          headers:
            Cache-Control:
              description: public, max-age=60, or no-store while first-run setup is required.
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Capabilities" }

  /api/v1/setup:
    post:
      tags: [Authentication]
      operationId: setup
      summary: Create the first administrator
      description: |
        First-run setup for a server with no global admin. Accounts that
        registered earlier do not close it. The caller proves access
        to the server with the setup token it logs at startup (or the value of
        `SETUP_TOKEN`). The account is created as a global admin and signed in.
        Two requests at once create one admin. Once a global admin exists the
        route answers 404, the same as a server that offers no setup.
        Shares the credential rate limit with login and registration.

        Password rules: at least 8 characters and at most 72 bytes of UTF-8 (some characters, such as emoji, take more than one), at least one visible character, and not on a list of about 2,000 commonly used passwords (`400 password_too_common`). It must also differ from the account's email address, the part before the @, and its display name (`400 password_matches_account`).
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SetupRequest" }
      responses:
        "201":
          description: Administrator created and signed in.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthResponse" }
        "400":
          description: The request is malformed, the password is refused (`password_too_common`, `password_matches_account`), or the address holds a character the reader cannot see (`invalid_email_characters`).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "403":
          description: The setup token is missing or wrong.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              example: { error: { code: invalid_setup_token, message: invalid setup token } }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: The address already belongs to an account, for example one registered before setup. Use another address.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              example: { error: { code: email_in_use, message: that email address already belongs to an account } }
        "413": { $ref: "#/components/responses/BodyTooLarge" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /api/v1/auth/register:
    post:
      tags: [Authentication]
      operationId: register
      summary: Create an account
      description: |
        Public signup. This endpoint never creates an admin: the first
        administrator comes from `POST /api/v1/setup`, later ones from a role
        change by an admin, or from the `ADMIN_EMAILS` bootstrap for an
        account that proved its address through setup or SSO. A registered
        account is never promoted by `ADMIN_EMAILS`.
        A duplicate email is indistinguishable from any other failure, by
        design, so this cannot enumerate accounts. The password is judged
        before the address is looked up, so a refused password answers the same
        way for a taken address and a free one. An address with a character the
        reader cannot see is refused before the lookup too, with
        `422 invalid_email_characters`.

        Password rules: at least 8 characters and at most 72 bytes of UTF-8 (some characters, such as emoji, take more than one), at least one visible character, and not on a list of about 2,000 commonly used passwords (`400 password_too_common`). It must also differ from the account's email address, the part before the @, and its display name (`400 password_matches_account`). Any other password
        problem, such as one with no visible character, answers the generic 422
        below.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EmailPasswordRequest" }
      responses:
        "201":
          description: Account created and signed in.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthResponse" }
        "400":
          description: The request is malformed, or the password is refused (`password_too_common`, `password_matches_account`).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "413": { $ref: "#/components/responses/BodyTooLarge" }
        "422":
          description: Registration failed (generic), or the address holds a character the reader cannot see (`invalid_email_characters`).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              example: { error: { code: registration_failed, message: registration failed } }

  /api/v1/auth/reset:
    post:
      tags: [Authentication]
      operationId: resetPassword
      summary: Set a new password from a reset link
      description: |
        The link an administrator hands over is the credential, so the route is
        public. A link works once; issuing a new link for the account retires
        the older ones, and a link ends after 24 hours. Redeeming ends every
        session of the account. A link that is unknown, used, retired or
        expired answers 400 `reset_link_invalid`, all alike. The password is
        checked before the link is spent, so a refused password costs nothing.
        The rules are the registration rules (at least 8 characters, at most
        72 bytes, a visible character, not a common password:
        `400 password_too_common`), except
        that the match against the account's email and name is not checked,
        because the account is not known until the link is spent. The route
        shares the sign-in rate limit per client address.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ResetPasswordRequest" }
      responses:
        "204":
          description: The password is set. The person signs in with it.
        "400":
          description: The link is not valid (`reset_link_invalid`) or the password breaks the rules (`invalid_password`, `password_too_common`).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /api/v1/auth/login:
    post:
      tags: [Authentication]
      operationId: login
      summary: Exchange credentials for tokens
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EmailPasswordRequest" }
      responses:
        "200":
          description: Signed in.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401":
          description: |
            Invalid email or password. Unknown accounts are deliberately
            indistinguishable from wrong passwords.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              example: { error: { code: login_failed, message: invalid email or password } }
        "429":
          description: |
            Either the client address is over its sign-in budget
            (`rate_limited`), or the account is waiting after repeated failed
            sign-ins (`too_many_attempts`). After three consecutive failures
            for an email, each further failure doubles the wait (1 s, 2 s,
            4 s, up to 60 s). An attempt made during the wait is refused
            without checking the password, so the right password is refused
            too. A successful sign-in resets the count, and it also drops to
            zero after 15 minutes without a failure. There is no lockout.
            Unknown emails are counted the same way, so the response does not
            reveal whether an account exists. `Retry-After` gives the seconds
            to wait.
          headers:
            Retry-After:
              description: Seconds until the next attempt is evaluated.
              schema: { type: integer, minimum: 1 }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              examples:
                accountWaiting:
                  value: { error: { code: too_many_attempts, message: "too many failed sign-in attempts, retry later" } }
                addressLimited:
                  value: { error: { code: rate_limited, message: "rate limit exceeded, retry later" } }

  /api/v1/auth/refresh:
    post:
      tags: [Authentication]
      operationId: refreshToken
      summary: Rotate a refresh token
      description: |
        Returns a new access token and a new refresh token. The presented
        refresh token is invalidated and is single-use. Presenting it again,
        however soon, revokes the sign-in it belongs to (its whole token
        family), so a stolen token cannot be replayed silently. A client must
        keep one refresh in flight at a time and use the token it gets back.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RefreshRequest" }
      responses:
        "200":
          description: Rotated.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401":
          description: |
            Invalid, expired, or revoked refresh token, or one past the
            session's absolute lifetime (`refresh_failed`). A token that was
            already used answers `refresh_reused` and revokes the sign-in it
            belongs to, successor included, but not the user's other devices.
            The client should sign the user out and say the session ended.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              examples:
                failed:
                  value: { error: { code: refresh_failed, message: invalid refresh token } }
                reused:
                  value: { error: { code: refresh_reused, message: refresh token was already used } }

  /api/v1/auth/logout:
    post:
      tags: [Authentication]
      operationId: logout
      summary: Revoke a session
      description: |
        Revokes the refresh token family. A refresh token that was already
        rotated is treated as a replay, as it is by refresh: the sign-in it
        belongs to is revoked and the call still answers 204. When a bearer
        access token is also supplied, that token is retired immediately
        instead of waiting for its normal expiry. Works with only a refresh
        token in the body.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RefreshRequest" }
      responses:
        "204": { $ref: "#/components/responses/NoContent" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "500": { $ref: "#/components/responses/InternalError" }

  /api/v1/auth/sso/login:
    get:
      tags: [Authentication]
      operationId: ssoLogin
      summary: Start the SSO authorization-code flow
      description: |
        Redirects to the identity provider's authorization endpoint and sets an
        `HttpOnly` `sso_state_<id>` cookie that binds this login to this
        browser. The cookie is signed by the server and carries a random
        per-login secret, from which the PKCE verifier and the OIDC nonce are
        derived, and the validated return path; none of these is sent to the
        identity provider. Each login has its own cookie, so several tabs can
        sign in at once, and a browser keeps at most four pending logins (the
        oldest is dropped). An optional, validated same-origin `redirect` path
        is held in that cookie. `Secure` is set only when the transport is
        verified secure: TLS in-process, or `X-Forwarded-Proto: https` from a
        configured trusted proxy. Available only when `SSO_ENABLE` is on; the
        route is absent otherwise.
      security: []
      parameters:
        - name: redirect
          in: query
          description: Optional same-origin SPA path and query to return to after sign-in; invalid or longer than 1024 bytes falls back to `/`.
          schema: { type: string, maxLength: 1024 }
      responses:
        "302":
          description: Redirect to the identity provider.
          headers:
            Set-Cookie:
              schema: { type: string }
              description: "Sets `sso_state_<id>`; HttpOnly, SameSite=Lax, 10-minute lifetime."

  /api/v1/auth/sso/callback:
    get:
      tags: [Authentication]
      operationId: ssoCallback
      summary: Complete the SSO flow
      description: |
        Exchanges the authorization code, validates the ID token (signature,
        issuer, audience, expiry, nonce) against the login's state cookie, resolves the
        IdP subject to a local account, and redirects to the validated SPA path
        with a short-lived single-use code in the URL **fragment** so it never
        reaches a server log or `Referer` header. The SPA trades the code for
        tokens at `/api/v1/auth/sso/exchange`. The login's state cookie stays in
        the browser until that exchange redeems the code.

        Unknown IdP subjects are provisioned only when their email domain is in
        `SSO_ALLOWED_DOMAINS`; otherwise the request is refused. An existing
        account keeps its local role regardless of IdP group membership.
      security: []
      parameters:
        - name: code
          in: query
          required: true
          schema: { type: string }
        - name: state
          in: query
          required: true
          schema: { type: string }
      responses:
        "302":
          description: "Redirect to `<validated-path>#sso_code=<code>`; defaults to `/` when no safe return path was supplied."
          headers:
            Location:
              schema: { type: string }
        "400":
          description: Missing code, or the state cookie did not match.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "403":
          description: |
            The IdP subject is not provisioned and its email domain is not
            allowlisted, or the asserted email is empty.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "500":
          description: Token exchange or identity extraction failed.

  /api/v1/auth/sso/exchange:
    post:
      tags: [Authentication]
      operationId: ssoExchange
      summary: Exchange a single-use SSO authorization code for tokens
      description: |
        Exchanges a short-lived single-use authorization code delivered via URL
        fragment upon completing the OIDC callback. Returns both a 15-minute
        access token and a 7-day refresh token. Replayed or expired codes fail
        closed with 401.

        The code is spent only by the browser that started the login. The request
        must carry that login's `sso_state_<id>` cookie, which the exchange clears
        on success. A request without the matching cookie, or with an expired one,
        gets 403 `sso_browser_mismatch` and the code stays redeemable, so a
        login started on one device must finish on that device.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              properties:
                code:
                  type: string
                  description: The single-use authorization code delivered in #sso_code.
      responses:
        "200":
          description: Session tokens minted.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401":
          description: Invalid, replayed, or expired authorization code.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "403":
          description: |
            `sso_browser_mismatch`: the request does not carry the login cookie of
            the browser that started this login. The code is not spent. Start the
            sign-in again from this browser.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "500":
          description: Internal exchange error.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /api/v1/me:
    get:
      tags: [Profile]
      operationId: getProfile
      summary: Read the signed-in account
      x-auth: session
      security:
        - sessionAuth: []
      responses:
        "200":
          description: The current profile.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UserProfile" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/SessionRequired" }
    put:
      tags: [Profile]
      operationId: updateProfile
      summary: Update the signed-in account
      description: |
        Updates the display name. The field is a pointer: omit it to leave the
        stored name alone, send `""` to clear it.
      x-auth: session
      security:
        - sessionAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ProfileUpdateRequest" }
      responses:
        "200":
          description: The updated profile.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UserProfile" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/SessionRequired" }

  /api/v1/me/password:
    put:
      tags: [Profile]
      operationId: changePassword
      summary: Change the signed-in account's password
      description: |
        Checks the current password, then replaces it. The new hash, a new
        token generation and the revocation of every refresh token and pending
        reset link are one transaction under a lock on the account, so every
        other open session ends and a sign-in in flight cannot keep one. The
        response is a fresh session for the caller, who stays signed in. If
        the account changes again (an SSO link, for one) after the password was
        written and before that session is stored, the password stays changed,
        no session is issued and the call answers 409 `account_changed`.

        Password rules: at least 8 characters and at most 72 bytes of UTF-8 (some characters, such as emoji, take more than one), at least one visible character, and not on a list of about 2,000 commonly used passwords (`400 password_too_common`). It must also differ from the account's email address, the part before the @, and its display name (`400 password_matches_account`). The new password must also differ from the current one.
        An account that signs in through SSO and has no password is told so
        (409 `no_local_password`) before the new password is judged. A wrong
        current password answers
        400 `wrong_password`, never 401, so a client does not read it as an
        expired session. An account that signs in through SSO has no password
        and answers 409 `no_local_password`. The route shares the sign-in rate
        limit per client address. Wrong current passwords also count per
        account, together with failed sign-ins for the same email, whichever
        address they come from: after three failures in a row each further
        failure doubles the wait (1 s, 2 s, 4 s, up to 60 s), and an attempt
        during the wait answers 429 `too_many_attempts` without checking the
        password. A correct current password resets the count.
      x-auth: session
      security:
        - sessionAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ChangePasswordRequest" }
      responses:
        "200":
          description: A new session for the caller.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthResponse" }
        "400":
          description: The current password is wrong (`wrong_password`), or the new one breaks the rules (`invalid_password`, `password_too_common`, `password_matches_account`).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/SessionRequired" }
        "409":
          description: The account has no local password (`no_local_password`), or it changed right after the password was written and the caller must sign in again (`account_changed`).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "429":
          description: |
            Either the client address is over its budget (`rate_limited`), or
            the account is waiting after repeated wrong current passwords or
            failed sign-ins (`too_many_attempts`). The password is not checked
            during the wait, so the right one is refused too. `Retry-After`
            gives the seconds to wait.
          headers:
            Retry-After:
              description: Seconds until the next attempt is evaluated.
              schema: { type: integer, minimum: 1 }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              examples:
                accountWaiting:
                  value: { error: { code: too_many_attempts, message: "too many failed password attempts, retry later" } }
                addressLimited:
                  value: { error: { code: rate_limited, message: "rate limit exceeded, retry later" } }

  /api/v1/auth/apikeys:
    post:
      tags: [API keys]
      operationId: createApiKey
      summary: Mint a project API key
      description: |
        Creates a key bound to exactly one project. The secret is returned once,
        in `raw_key`, and never again — later reads expose only the prefix and
        the last four characters.

        Needs the manager or admin role on the project. An API key, or a person
        with no role on the project or with the member role, gets 403.
      x-required-role: manager
      x-auth: session
      security:
        - sessionAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateApiKeyRequest" }
      responses:
        "201":
          description: Key created. `raw_key` appears only here.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiKey" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/Unprocessable" }
    get:
      tags: [API keys]
      operationId: listApiKeys
      summary: List API keys
      description: |
        Lists a project's keys with the secret masked. Each key carries
