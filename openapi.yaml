          description: Assessed.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Reachability" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    get:
      tags: [Reachability]
      operationId: listReachability
      summary: List reachability assessments
      x-required-scope: read
      security:
        - sessionAuth: []
        - apiKeyAuth: []
      parameters:
        - $ref: "#/components/parameters/FindingID"
      responses:
        "200":
          description: The assessments for this finding.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Reachability" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/v1/findings/{findingID}/signoff:
    post:
      tags: [Signoff]
      operationId: upsertSignoff
      summary: Record a reviewer decision
      x-auth: session
      security:
        - sessionAuth: []
