# Specht security gate.
#
# Downloads the specht-adapter release for the runner platform, verifies the
# checksum manifest with cosign (keyless by default, pinned to the release
# workflow identity) and the archive against its SHA256SUMS line, then runs
# the adapter against the Specht API. Nothing is executed before verification
# succeeds, so a tampered or unsigned archive never runs.
#
# The download origin and the keyless verification identity are fixed in
# action/specht-gate.sh; this action exposes no input that can change them.
#
# Usage:
#
#   permissions:
#     contents: read
#     checks: write        # optional, only to publish the check run
#
#   steps:
#     - uses: minh-tg/specht@v1.2.3
#       with:
#         api-url: https://specht.example.com
#         api-key: ${{ secrets.SPECHT_API_KEY }}
#         project: my-app
#         file: trivy.json
#         tool: trivy
#
# Pin the action to a release tag (vX.Y.Z): v1.2.3 runs the v1.2.3 adapter.
# A branch or commit ref must set the version input, because there is no
# "latest" fallback. Bare versions ("1.2.3") are accepted and mean the same
# release tag as "v1.2.3".
#
# The step exit code is the adapter's: 0 pass, 1 blocked (findings), 2 error.
# A non-zero exit fails the job, so use continue-on-error when the gate should
# report without blocking.
#
# Fork pull requests do not receive repository secrets. An empty api-key on a
# pull_request from a fork logs a notice and exits 0 with output skipped=true;
# an empty api-key anywhere else fails. Never use pull_request_target to hand
# secrets to untrusted code.
#
# github-token is used only to publish the check run and needs checks: write.
# The adapter warns when publishing fails; the gate verdict is unaffected.
name: Specht security gate
description: Download, verify and run the Specht adapter to gate a change on its scan findings
branding:
  icon: shield
  color: purple

inputs:
  api-url:
    description: Base URL of the Specht API, for example https://specht.example.com
    required: true
  api-key:
    description: Specht API key. May be empty on pull_request events from forks.
    required: true
  project:
    description: Specht project slug
    required: false
    default: ""
  file:
    description: Path to the scanner output file to ingest
    required: true
  tool:
    description: Scanner name, for example trivy or semgrep
    required: true
  introduced-only:
    description: Gate only on findings introduced by this change. Defaults to true on pull_request events and false otherwise.
    required: false
    default: ""
  base-ref:
    description: Baseline git ref for the change scope. Defaults to GITHUB_BASE_REF.
    required: false
    default: ""
  github-token:
    description: GitHub token used to publish the check run
    required: false
    default: ${{ github.token }}
  version:
    description: Release tag to download, for example v1.2.3. Defaults to the action ref when it is a release tag.
    required: false
    default: ""

outputs:
  skipped:
    description: "true when the action skipped, which happens only for a fork pull request without an API key"
    value: ${{ steps.setup.outputs.skipped }}
  version:
    description: The adapter release version that ran, without the leading v
    value: ${{ steps.setup.outputs.version }}

runs:
  using: composite
  steps:
    - name: Resolve the release, platform and skip state
      id: setup
      shell: bash
      env:
        # The public action clears the test-only overrides, so only the
        # self-test action can redirect the download origin or the keyless
        # verification policy.
        SPECHT_SELFTEST: ""
        SPECHT_RELEASE_BASE_URL: ""
        SPECHT_COSIGN_PUBLIC_KEY: ""
        SPECHT_CERTIFICATE_IDENTITY: ""
        SPECHT_INPUT_VERSION: ${{ inputs.version }}
        SPECHT_INPUT_API_KEY: ${{ inputs.api-key }}
        SPECHT_ACTION_REF: ${{ github.action_ref }}
        SPECHT_EVENT_NAME: ${{ github.event_name }}
        SPECHT_PR_HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
        SPECHT_PR_BASE_REPO: ${{ github.event.pull_request.base.repo.full_name }}
      run: bash "${{ github.action_path }}/action/specht-gate.sh" prepare

    - name: Install cosign
      id: cosign
      if: steps.setup.outputs.skipped != 'true'
      uses: sigstore/cosign-installer@053f9b74638557590800a301da1ba82351507e2c # v3.8.1

    - name: Download, verify and run the Specht adapter
      id: gate
      if: steps.setup.outputs.skipped != 'true'
      shell: bash
      env:
        SPECHT_SELFTEST: ""
        SPECHT_RELEASE_BASE_URL: ""
        SPECHT_COSIGN_PUBLIC_KEY: ""
        SPECHT_CERTIFICATE_IDENTITY: ""
        SPECHT_INPUT_VERSION: ${{ inputs.version }}
        SPECHT_INPUT_API_URL: ${{ inputs.api-url }}
        SPECHT_INPUT_API_KEY: ${{ inputs.api-key }}
        SPECHT_INPUT_PROJECT: ${{ inputs.project }}
        SPECHT_INPUT_FILE: ${{ inputs.file }}
        SPECHT_INPUT_TOOL: ${{ inputs.tool }}
        SPECHT_INPUT_INTRODUCED_ONLY: ${{ inputs.introduced-only }}
        SPECHT_INPUT_BASE_REF: ${{ inputs.base-ref }}
        SPECHT_INPUT_GITHUB_TOKEN: ${{ inputs.github-token }}
        SPECHT_ACTION_REF: ${{ github.action_ref }}
        SPECHT_EVENT_NAME: ${{ github.event_name }}
        SPECHT_PR_HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
        SPECHT_PR_BASE_REPO: ${{ github.event.pull_request.base.repo.full_name }}
        SPECHT_EVENT_BASE_REF: ${{ github.base_ref }}
      run: bash "${{ github.action_path }}/action/specht-gate.sh" run
