# Specht security gate.
#
# Downloads the specht-adapter release for the runner platform, verifies the
# checksum manifest with cosign (keyless by default, pinned to the release
# workflow identity) and the archive against its SHA256SUMS line, then runs
# the adapter against the Specht API. Nothing is executed before verification
# succeeds, so a tampered or unsigned archive never runs.
#
# Usage:
#
#   permissions:
#     contents: read
#     checks: write        # optional, only to publish the check run
#
#   steps:
#     - uses: minh-tg/specht@v1.2.3
#       with:
#         api-url: https://specht.example.com
#         api-key: ${{ secrets.SPECHT_API_KEY }}
#         project: my-app
#         file: trivy.json
#         tool: trivy
#
# Pin the action to a release tag (vX.Y.Z): v1.2.3 runs the v1.2.3 adapter.
# A branch or commit ref must set the version input, because there is no
# "latest" fallback. Bare versions ("1.2.3") are accepted and mean the same
# release tag as "v1.2.3".
#
# The step exit code is the adapter's: 0 pass, 1 blocked (findings), 2 error.
# A non-zero exit fails the job, so use continue-on-error when the gate should
# report without blocking.
#
# Fork pull requests do not receive repository secrets. An empty api-key on a
# pull_request from a fork logs a notice and exits 0 with output skipped=true;
# an empty api-key anywhere else fails. Never use pull_request_target to hand
# secrets to untrusted code.
#
# github-token is used only to publish the check run and needs checks: write.
# The adapter warns when publishing fails; the gate verdict is unaffected.
name: Specht security gate
description: Download, verify and run the Specht adapter to gate a change on its scan findings
branding:
  icon: shield
  color: purple

inputs:
  api-url:
    description: Base URL of the Specht API, for example https://specht.example.com
    required: true
  api-key:
    description: Specht API key. May be empty on pull_request events from forks.
    required: true
  project:
    description: Specht project slug
    required: false
    default: ""
  file:
    description: Path to the scanner output file to ingest
    required: true
  tool:
    description: Scanner name, for example trivy or semgrep
    required: true
  introduced-only:
    description: Gate only on findings introduced by this change. Defaults to true on pull_request events and false otherwise.
    required: false
    default: ""
  base-ref:
    description: Baseline git ref for the change scope. Defaults to GITHUB_BASE_REF.
    required: false
    default: ""
  github-token:
    description: GitHub token used to publish the check run
    required: false
    default: ${{ github.token }}
  version:
    description: Release tag to download, for example v1.2.3. Defaults to the action ref when it is a release tag.
    required: false
    default: ""
  release-base-url:
    description: Where release assets are downloaded from. Self-test only.
    required: false
    default: https://github.com/minh-tg/specht/releases/download
  cosign-public-key:
    description: PEM public key for cosign verify-blob. Empty (the default) verifies keyless. Self-test only.
    required: false
    default: ""

outputs:
  skipped:
    description: "true when the action skipped, which happens only for a fork pull request without an API key"
    value: ${{ steps.setup.outputs.skipped }}
  version:
    description: The adapter release version that ran, without the leading v
    value: ${{ steps.setup.outputs.version }}

runs:
  using: composite
  steps:
    - name: Resolve the release, platform and skip state
      id: setup
      shell: bash
      env:
        INPUT_VERSION: ${{ inputs.version }}
        INPUT_API_KEY: ${{ inputs.api-key }}
        ACTION_REF: ${{ github.action_ref }}
        EVENT_NAME: ${{ github.event_name }}
        PR_HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
        PR_BASE_REPO: ${{ github.event.pull_request.base.repo.full_name }}
      run: |
        set -euo pipefail

        version="${INPUT_VERSION:-}"
        if [[ -z "$version" && "$ACTION_REF" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
          version="$ACTION_REF"
        fi
        if [[ -z "$version" ]]; then
          echo "::error::no Specht release tag resolved. Pin the action to a release tag (uses: minh-tg/specht@v1.2.3) or set the version input to one, such as v1.2.3. There is no latest fallback."
          exit 1
        fi
        if [[ ! "$version" =~ ^v?[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
          echo "::error::version '${version}' is not a release tag such as v1.2.3"
          exit 1
        fi
        tag="v${version#v}"
        file_version="${tag#v}"

        case "${RUNNER_OS:-}" in
          Linux) os=linux ;;
          macOS) os=darwin ;;
          Windows) os=windows ;;
          *)
            echo "::error::unsupported RUNNER_OS '${RUNNER_OS:-}'; Specht supports Linux, macOS and Windows runners"
            exit 1
            ;;
        esac
        case "${RUNNER_ARCH:-}" in
          X64) arch=amd64 ;;
          ARM64) arch=arm64 ;;
          *)
            echo "::error::unsupported RUNNER_ARCH '${RUNNER_ARCH:-}'; Specht supports X64 and ARM64 runners"
            exit 1
            ;;
        esac
        if [[ "$os" == windows && "$arch" != amd64 ]]; then
          echo "::error::Specht publishes no windows/${arch} adapter archive; only windows/amd64 is supported"
          exit 1
        fi

        ext=tar.gz
        if [[ "$os" == windows ]]; then
          ext=zip
        fi
        asset="specht-adapter_${file_version}_${os}_${arch}.${ext}"

        skipped=false
        if [[ -z "${INPUT_API_KEY:-}" ]]; then
          if [[ "$EVENT_NAME" == pull_request && -n "$PR_HEAD_REPO" && "$PR_HEAD_REPO" != "$PR_BASE_REPO" ]]; then
            echo "::notice::Specht skipped: pull requests from forks do not receive the api-key secret."
            skipped=true
          else
            echo "::error::Specht needs the api-key input; set it from a repository secret, for example secrets.SPECHT_API_KEY. Only pull_request events from forks may leave it empty."
            exit 1
          fi
        fi

        {
          echo "version=$file_version"
          echo "tag=$tag"
          echo "os=$os"
          echo "arch=$arch"
          echo "asset=$asset"
          echo "skipped=$skipped"
        } >>"$GITHUB_OUTPUT"

    - name: Download the release assets
      id: download
      if: steps.setup.outputs.skipped != 'true'
      shell: bash
      env:
        RELEASE_BASE_URL: ${{ inputs.release-base-url }}
        COSIGN_PUBLIC_KEY: ${{ inputs.cosign-public-key }}
        TAG: ${{ steps.setup.outputs.tag }}
        ASSET: ${{ steps.setup.outputs.asset }}
      run: |
        set -euo pipefail

        base="${RELEASE_BASE_URL%/}"
        case "$base" in
          https://*)
            proto="=https"
            ;;
          http://127.0.0.1 | http://127.0.0.1[:/]* | http://localhost | http://localhost[:/]*)
            proto="=https,http"
            ;;
          *)
            echo "::error::release-base-url must use https; plain http is allowed only for 127.0.0.1 or localhost"
            exit 1
            ;;
        esac

        tmp="$RUNNER_TEMP/specht-action"
        rm -rf "$tmp"
        mkdir -p "$tmp"

        # The keyless certificate only exists on keyless releases, so a
        # key-verified self-test release does not need it.
        files=("$ASSET" SHA256SUMS SHA256SUMS.sig)
        if [[ -z "$COSIGN_PUBLIC_KEY" ]]; then
          files+=(SHA256SUMS.pem)
        fi
        for f in "${files[@]}"; do
          echo "downloading ${base}/${TAG}/${f}"
          curl --fail --location --retry 3 --retry-delay 2 --silent --show-error \
            --proto "$proto" --proto-redir "$proto" \
            --output "$tmp/$f" "${base}/${TAG}/${f}"
        done

    - name: Install cosign
      id: cosign
      if: steps.setup.outputs.skipped != 'true'
      uses: sigstore/cosign-installer@053f9b74638557590800a301da1ba82351507e2c # v3.8.1

    - name: Verify the signature and the archive checksum
      id: verify
      if: steps.setup.outputs.skipped != 'true'
      shell: bash
      env:
        TAG: ${{ steps.setup.outputs.tag }}
        ASSET: ${{ steps.setup.outputs.asset }}
        OS: ${{ steps.setup.outputs.os }}
        COSIGN_PUBLIC_KEY: ${{ inputs.cosign-public-key }}
      run: |
        set -euo pipefail

        tmp="$RUNNER_TEMP/specht-action"
        if [[ -n "$COSIGN_PUBLIC_KEY" ]]; then
          key="$tmp/cosign.pub"
          if [[ -f "$COSIGN_PUBLIC_KEY" ]]; then
            key="$COSIGN_PUBLIC_KEY"
          else
            printf '%s\n' "$COSIGN_PUBLIC_KEY" >"$key"
          fi
          cosign verify-blob \
            --key "$key" \
            --signature "$tmp/SHA256SUMS.sig" \
            "$tmp/SHA256SUMS"
        else
          # Keyless: the signature must come from this repository's release
          # workflow at the tag the action downloads.
          cosign verify-blob \
            --certificate "$tmp/SHA256SUMS.pem" \
            --signature "$tmp/SHA256SUMS.sig" \
            --certificate-identity "https://github.com/minh-tg/specht/.github/workflows/release.yml@refs/tags/${TAG}" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            "$tmp/SHA256SUMS"
        fi

        cd "$tmp"
        line="$(awk -v asset="$ASSET" '$2 == asset { print }' SHA256SUMS)"
        if [[ -z "$line" ]]; then
          echo "::error::SHA256SUMS has no entry for ${ASSET}"
          exit 1
        fi
        if [[ "$OS" == darwin ]]; then
          printf '%s\n' "$line" | shasum -a 256 -c -
        else
          printf '%s\n' "$line" | sha256sum -c -
        fi

    - name: Run the adapter
      id: run
      if: steps.setup.outputs.skipped != 'true'
      shell: bash
      env:
        INPUT_API_URL: ${{ inputs.api-url }}
        INPUT_API_KEY: ${{ inputs.api-key }}
        INPUT_PROJECT: ${{ inputs.project }}
        INPUT_FILE: ${{ inputs.file }}
        INPUT_TOOL: ${{ inputs.tool }}
        INPUT_INTRODUCED_ONLY: ${{ inputs.introduced-only }}
        INPUT_BASE_REF: ${{ inputs.base-ref }}
        INPUT_GITHUB_TOKEN: ${{ inputs.github-token }}
        EVENT_NAME: ${{ github.event_name }}
        EVENT_BASE_REF: ${{ github.base_ref }}
        ASSET: ${{ steps.setup.outputs.asset }}
        OS: ${{ steps.setup.outputs.os }}
        # The adapter reads SPECHT_* today and the plain names on older
        # releases; both are set. The key is never echoed.
        SPECHT_API_URL: ${{ inputs.api-url }}
        SPECHT_API_KEY: ${{ inputs.api-key }}
        API_URL: ${{ inputs.api-url }}
        API_KEY: ${{ inputs.api-key }}
        GITHUB_TOKEN: ${{ inputs.github-token }}
      run: |
        set -euo pipefail

        tmp="$RUNNER_TEMP/specht-action"
        mkdir -p "$tmp/adapter"
        case "$OS" in
          windows) unzip -q -o "$tmp/$ASSET" -d "$tmp/adapter" ;;
          *) tar -xzf "$tmp/$ASSET" -C "$tmp/adapter" ;;
        esac
        bin="$tmp/adapter/specht-adapter"
        if [[ "$OS" == windows ]]; then
          bin="${bin}.exe"
        fi
        chmod +x "$bin"

        args=(-file "$INPUT_FILE" -tool "$INPUT_TOOL")
        if [[ -n "$INPUT_PROJECT" ]]; then
          args+=(-project "$INPUT_PROJECT")
        fi

        introduced="$INPUT_INTRODUCED_ONLY"
        if [[ -z "$introduced" ]]; then
          if [[ "$EVENT_NAME" == pull_request* ]]; then
            introduced=true
          else
            introduced=false
          fi
        fi
        if [[ "$introduced" == "true" ]]; then
          args+=(-introduced-only)
        fi

        base_ref="$INPUT_BASE_REF"
        if [[ -z "$base_ref" ]]; then
          base_ref="${EVENT_BASE_REF:-}"
        fi
        if [[ -n "$base_ref" ]]; then
          args+=(-base-ref "$base_ref")
        fi

        # The step exit code is the adapter's: 0 pass, 1 blocked, 2 error.
        "$bin" "${args[@]}"
