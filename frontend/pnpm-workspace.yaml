allowBuilds:
  dprint: true

# Transitive advisories reached through ajv and the shadcn CLI. Each pin stays
# on the major line the dependent already uses, so the API does not change:
#   fast-uri: ajv 8 needs 3.x; 3.1.8 patches GHSA-qw65-cvwx-89v3 and
#     GHSA-hrr3-gc8f-f4qj (3.1.6 itself is now affected by GHSA-58mr-gqgx-xq4g).
#   brace-expansion: only the 5.x copy (via minimatch 10 / ts-morph) is affected;
#     the 2.x copy under openapi-typescript is not, so the pin is scoped to ^5.
#   ip-address: 10.7.1+ patches GHSA-h3mg-xc3c-68pw and GHSA-j6r3-76f7-8jcv.
overrides:
  fast-uri: 3.1.8
  "brace-expansion@^5.0.0": 5.0.12
  ip-address: 10.7.2

# braces <=3.0.3 (GHSA-vfj7-8cjw-p6xm, DoS from deeply nested brace patterns) has no
# published fix yet: the advisory names 3.0.4, but npm's latest is 3.0.3, so an override
# cannot clear it. It is reached only through the shadcn CLI (fast-glob > micromatch), which
# expands its own fixed globs at development time; nothing ships to the browser or runs on
# untrusted input. Remove this ignore as soon as braces 3.0.4 is published.
auditConfig:
  ignoreGhsas:
    - GHSA-vfj7-8cjw-p6xm
