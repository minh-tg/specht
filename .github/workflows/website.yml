name: website

on:
  pull_request:
    paths:
      - "website/**"
      - "frontend/**"
      - "dprint.json"
      - ".github/workflows/website.yml"
  push:
    branches: [main]
    paths:
      - "website/**"
      - "frontend/**"
      - "dprint.json"
      - ".github/workflows/website.yml"

permissions:
  contents: read

jobs:
  website:
    name: website (build, links and accessibility)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      ASTRO_TELEMETRY_DISABLED: "1"
      SITE_URL: https://specht.example.com
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v6
        with:
          node-version: 26
          cache: pnpm
          cache-dependency-path: |
            website/pnpm-lock.yaml
            frontend/pnpm-lock.yaml
      - run: pnpm --dir ../frontend install --frozen-lockfile
      - run: pnpm install --frozen-lockfile
      - run: pnpm check && pnpm format:check
      - run: pnpm audit --audit-level=high
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm --dir ../frontend exec playwright install chromium
      - name: Build normal application for isolation checks
        run: pnpm --dir ../frontend build
      - name: Build and test root hosting
        run: |
          pnpm build
          pnpm test
          pnpm --dir ../frontend test:demo
          node ../frontend/scripts/check-demo-isolation.mjs
      - name: Build and test subdirectory hosting
        run: |
          pnpm build
          pnpm test
          pnpm --dir ../frontend test:demo
          node ../frontend/scripts/check-demo-isolation.mjs
        env:
          SITE_BASE: /specht/
          DEMO_BASE: /specht/demo/
