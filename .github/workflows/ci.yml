name: ci

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: test (unit + integration)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # go.sum is deliberately untracked (regenerated by the go mod tidy
      # pre-commit hook), so CI must resolve the module graph before tests.
      - name: Resolve module graph
        env:
          GOFLAGS: -mod=mod
        run: go mod download

      - name: Vet
        run: go vet ./...

      - name: Unit tests (offline)
        run: go test ./... -count=1 -short

      - name: Integration tests (real Postgres via testcontainers)
        run: go test -tags integration ./internal/repo/ -count=1 -timeout 15m
        env:
          DOCKER_HOST: unix:///var/run/docker.sock

  lint:
    name: lint + format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Resolve module graph
        env:
          GOFLAGS: -mod=mod
        run: go mod download

      - name: gofumpt
        run: |
          test -z "$(go run mvdan.cc/gofumpt@v0.7.0 -l .)"

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: v1.64.8
          args: --timeout=5m

      - name: Build
        run: go build ./...

  build:
    name: docker build (clean clone)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Simulate a fresh clone with no go.sum: build the image the way a
      # release would, proving the Dockerfile works without the gitignored
      # go.sum present in the build context.
      - name: Build image from clean tree
        run: |
          rm -f go.sum
          docker build -f deploy/Dockerfile -t specht:ci .
