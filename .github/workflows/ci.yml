name: ci

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: test (unit + integration)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # go.sum is deliberately untracked (regenerated by the go mod tidy
      # pre-commit hook), so CI must regenerate it before running Go tooling.
      # go mod tidy reproduces go.sum deterministically from the committed
      # go.mod (verified byte-identical); go mod download does NOT write it.
      - name: Resolve module graph
        run: go mod tidy

      - name: Vet
        run: go vet ./...

      - name: Unit tests (offline)
        run: go test ./... -count=1 -short

      - name: Integration tests (real Postgres via testcontainers)
        run: go test -tags integration ./internal/repo/ -count=1 -timeout 15m
        env:
          DOCKER_HOST: unix:///var/run/docker.sock

  lint:
    name: lint + format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Resolve module graph
        run: go mod tidy

      - name: gofumpt
        run: |
          test -z "$(go run mvdan.cc/gofumpt@v0.7.0 -l .)"

      # Build golangci-lint from source with CI's Go rather than using its
      # prebuilt binary: the prebuilt v1.64.8 ships compiled with Go 1.24,
      # which refuses to analyse a Go 1.26 module ("Go language version used
      # to build golangci-lint is lower than the targeted Go version"). The
      # repo's own pre-commit hook builds the same rev from source in the dev
      # shell (Go 1.26.5), so CI mirrors that.
      - name: golangci-lint
        run: go run github.com/golangci/golangci-lint/cmd/golangci-lint@v1.64.8 run ./... --timeout=5m

      - name: Build
        run: go build ./...

  build:
    name: docker build (clean clone)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Simulate a fresh clone with no go.sum: build the image the way a
      # release would, proving the Dockerfile works without the gitignored
      # go.sum present in the build context.
      - name: Build image from clean tree
        run: |
          rm -f go.sum
          docker build -f deploy/Dockerfile -t specht:ci .
