name: ci

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: test (unit + integration)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Verify dependencies
        run: go mod verify

      - name: Vet
        run: go vet ./...

      - name: Unit tests (offline)
        run: go test ./... -count=1 -short

      - name: Integration tests (real Postgres via testcontainers)
        run: go test -tags integration ./internal/repo/ -count=1 -timeout 15m
        env:
          DOCKER_HOST: unix:///var/run/docker.sock

  lint:
    name: lint + format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Resolve module graph
        run: go mod tidy

      - name: gofumpt
        run: |
          test -z "$(go run mvdan.cc/gofumpt@v0.7.0 -l .)"

      # Build golangci-lint from source with CI's Go rather than using its
      # prebuilt binary: the prebuilt v1.64.8 ships compiled with Go 1.24,
      # which refuses to analyse a Go 1.26 module ("Go language version used
      # to build golangci-lint is lower than the targeted Go version"). The
      # repo's own pre-commit hook builds the same rev from source in the dev
      # shell (Go 1.26.5), so CI mirrors that. The args mirror the repo's
      # pre-commit hook exactly --disable-all --enable=staticcheck -- so CI
      # enforces the same bar developers get locally.
      - name: golangci-lint
        run: |
          go run github.com/golangci/golangci-lint/cmd/golangci-lint@v1.64.8 \
            run --disable-all --enable=staticcheck ./... --timeout=5m

      - name: Build
        run: go build ./...

  frontend:
    name: frontend (vitest + tsc + dprint + oxlint)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 11

      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Unit tests (vitest)
        run: pnpm test

      - name: Typecheck
        run: npx tsc -b

      - name: Format check (dprint)
        run: npx dprint check

      - name: Lint (oxlint)
        run: pnpm lint

  build:
    name: docker build (clean clone)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Build image
        run: docker build -f deploy/Dockerfile -t specht:ci .

  security-scan:
    name: security scan (Semgrep)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Semgrep
        run: |
          python3 -m pip install --user semgrep

      - name: Run Semgrep important-only scan
        run: |
          semgrep --metrics=off \
            --config p/secrets \
            --config p/security-audit \
            --config p/golang \
            --config p/typescript \
            --config p/javascript \
            --config p/dockerfile \
            --severity WARNING --severity ERROR \
            --json -o semgrep-results.json \
            --sarif-output=semgrep-results.sarif \
            .

      - name: Upload Semgrep SARIF
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: semgrep-results.sarif
        continue-on-error: true

      - name: Upload SARIF artifact (dogfood ingest)
        uses: actions/upload-artifact@v7
        with:
          name: semgrep-sarif
          path: semgrep-results.sarif
          retention-days: 1

  govulncheck:
    name: govulncheck (Go SCA)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      # go.mod pins the toolchain floor (go1.26.6); setup-go plus
      # GOTOOLCHAIN=auto resolves a patched toolchain, so the scan runs
      # against fixed stdlib.
      - name: govulncheck
        run: |
          go run golang.org/x/vuln/cmd/govulncheck@latest ./...

  trivy:
    name: trivy (fs + misconfig)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v7

      - name: Scan filesystem
        uses: aquasecurity/trivy-action@v0.36.0
        env:
          # The chart deliberately requires an explicit database password.
          # Trivy renders Helm charts during filesystem misconfiguration scans,
          # so provide a throwaway scan-only value without weakening the chart.
          TRIVY_HELM_SET_STRING: postgresql.password=ci-scan-placeholder
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          severity: HIGH,CRITICAL
          limit-severities-for-sarif: true
          format: sarif
          output: trivy-results.sarif
          exit-code: "1"

      - name: Upload Trivy SARIF
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-results.sarif
        continue-on-error: true

      - name: Upload SARIF artifact (dogfood ingest)
        uses: actions/upload-artifact@v7
        with:
          name: trivy-sarif
          path: trivy-results.sarif
          retention-days: 1

  dogfood:
    # Specht scans itself: the scanner SARIF reports feed a live instance
    # so introduced-by-change, gates, and verified-fixed closure run on
    # real data every pipeline. Gate verdict is advisory until a green
    # baseline is observed for a while; flip GATE_MODE to block after.
    name: dogfood (self-ingest)
    runs-on: ubuntu-latest
    needs: [security-scan, trivy]
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: specht
          POSTGRES_PASSWORD: specht
          POSTGRES_DB: specht
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U specht"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5
    env:
      DATABASE_URL: postgres://specht:specht@localhost:5432/specht?sslmode=disable
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Download scanner SARIF
        uses: actions/download-artifact@v8
        with:
          path: sarif-reports
          pattern: "*-sarif"
          merge-multiple: true

      - name: Migrate and start server
        run: |
          go run ./cmd/server migrate
          JWT_SECRET="$(openssl rand -hex 32)"
          export JWT_SECRET
          echo "JWT_SECRET=$JWT_SECRET" >> "$GITHUB_ENV"
          go build -o /tmp/specht-ci ./cmd/server
          DB_MIGRATE=true /tmp/specht-ci >> /tmp/specht-ci.log 2>&1 &
          for _ in $(seq 1 30); do
            curl -sf http://127.0.0.1:8080/api/v1/health && break
            sleep 2
          done

      - name: Register admin and restart with bootstrap
        run: |
          curl -sf -X POST http://127.0.0.1:8080/api/v1/auth/register \
            -H 'Content-Type: application/json' \
            -d '{"email":"ci-dogfood@example.com","password":"ci-dogfood-password-123"}'
          pkill -f specht-ci
          sleep 2
          ADMIN_EMAILS=ci-dogfood@example.com DB_MIGRATE=true /tmp/specht-ci >> /tmp/specht-ci.log 2>&1 &
          for _ in $(seq 1 30); do
            curl -sf http://127.0.0.1:8080/api/v1/health && break
            sleep 2
          done

      - name: Ingest scanner reports into Specht
        env:
          SPECHT_API_URL: http://127.0.0.1:8080
          SPECHT_ADMIN_EMAIL: ci-dogfood@example.com
          SPECHT_ADMIN_PASSWORD: ci-dogfood-password-123
          SPECHT_PROJECT: specht-self
          SARIF_FILES: sarif-reports/semgrep-results.sarif sarif-reports/trivy-results.sarif
          GATE_MODE: advisory
        run: bash scripts/ci-dogfood.sh
