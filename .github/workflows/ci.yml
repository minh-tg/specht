name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  packages: read

env:
  # Repository variable, for example ghcr.io/minh-tg/mirror. Unset, jobs pull from Docker Hub. Set,
  # they pull from the mirror filled by the mirror-images workflow, and fall back to Docker Hub with
  # a warning when the mirror lacks an image. See .github/actions/image-source.
  IMAGE_MIRROR: ${{ vars.IMAGE_MIRROR }}

jobs:
  # The unit and integration suites run as separate jobs so they overlap. The
  # `test` job below keeps the original check name that branch protection
  # requires and passes only when both of them pass.
  unit:
    name: unit tests (race)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: ./.github/actions/setup-go
        with:
          scope: test

      - name: Verify dependencies
        run: go mod verify

      - name: Unit tests (offline)
        run: go test -race ./... -count=1 -short

      - if: github.ref == 'refs/heads/main'
        uses: ./.github/actions/save-go-cache
        with:
          scope: test

  integration:
    name: integration + migrations
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # Anonymous Docker Hub pulls share a per-IP limit that hosted runners exhaust. When the
      # repository has credentials (variable DOCKERHUB_USERNAME, secret DOCKERHUB_TOKEN) pulls are
      # authenticated. Forks and Dependabot have no secret; the step then fails softly and the job
      # pulls anonymously, as before.
      - name: Log in to Docker Hub
        if: ${{ vars.DOCKERHUB_USERNAME != '' }}
        continue-on-error: true
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Pulls from the GHCR mirror when IMAGE_MIRROR is set and complete, else from Docker Hub.
      - uses: ./.github/actions/image-source

      # Started here, after the login above, because a service container is pulled before any step
      # runs and its credentials cannot be optional.
      - name: Start PostgreSQL
        run: |
          docker run -d --name postgres -p 5432:5432 \
            -e POSTGRES_USER=postgres -e POSTGRES_PASSWORD=postgres -e POSTGRES_DB=specht \
            --health-cmd="pg_isready -U postgres -d specht" \
            --health-interval=5s --health-timeout=3s --health-retries=10 \
            "$CI_POSTGRES_17_IMAGE"
          for _ in $(seq 1 60); do
            [ "$(docker inspect -f '{{.State.Health.Status}}' postgres)" = healthy ] && exit 0
            sleep 2
          done
          docker logs postgres
          exit 1

      - uses: ./.github/actions/setup-go
        with:
          scope: build

      - name: Vet
        run: go vet ./...

      # Ryuk is testcontainers' cleanup container, pulled from Docker Hub. The runner is discarded
      # after the job and the suite stops its own container, so it is not needed here.
      - name: Integration tests (real Postgres via testcontainers)
        run: go test -tags integration ./internal/repo/ -count=1 -timeout 15m
        env:
          DOCKER_HOST: unix:///var/run/docker.sock
          TESTCONTAINERS_RYUK_DISABLED: "true"

      - name: Apply complete migration chain
        run: go run ./cmd/server migrate
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/specht?sslmode=disable

      # Each migrate-down call must undo exactly one migration: the applied
      # version drops to the previous file's number after every call, and the
      # schema is empty only after the last one.
      - name: Roll back every migration, one per call
        run: |
          applied() {
            docker exec postgres psql -U postgres -d specht -tAc \
              "SELECT COALESCE((SELECT version FROM schema_migrations), 0)"
          }
          mapfile -t versions < <(find migrations -name '*.up.sql' -printf '%f\n' | cut -d_ -f1 | sort -n | sed 's/^0*//')
          test "${#versions[@]}" -gt 0
          test "$(applied)" = "${versions[-1]}"
          for ((i = ${#versions[@]} - 1; i >= 0; i--)); do
            go run ./cmd/server migrate-down
            want=0
            if [ "$i" -gt 0 ]; then want=${versions[i - 1]}; fi
            got=$(applied)
            if [ "$got" != "$want" ]; then
              echo "after rolling back ${versions[i]} the schema is at version $got, want $want"
              exit 1
            fi
          done
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/specht?sslmode=disable

      - name: Re-apply complete migration chain
        run: go run ./cmd/server migrate
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/specht?sslmode=disable

      - if: github.ref == 'refs/heads/main'
        uses: ./.github/actions/save-go-cache
        with:
          scope: build

  test:
    name: test (unit + integration + migrations)
    needs: [unit, integration]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Require the unit and integration jobs
        env:
          UNIT: ${{ needs.unit.result }}
          INTEGRATION: ${{ needs.integration.result }}
        run: |
          echo "unit=$UNIT integration=$INTEGRATION"
          [ "$UNIT" = success ] && [ "$INTEGRATION" = success ]

  e2e:
    name: "e2e (full stack: API + adapter + CLI)"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # Optional authenticated Docker Hub pulls; see the integration job.
      - name: Log in to Docker Hub
        if: ${{ vars.DOCKERHUB_USERNAME != '' }}
        continue-on-error: true
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Pulls from the GHCR mirror when IMAGE_MIRROR is set and complete, else from Docker Hub.
      - uses: ./.github/actions/image-source

      - uses: ./.github/actions/setup-go
        with:
          scope: build

      # Real PostgreSQL (testcontainers), real server/adapter/CLI
      # binaries, HTTP contracts and documented exit codes end to end.
      - name: Full-stack E2E suite
        run: make e2e-split
        env:
          DOCKER_HOST: unix:///var/run/docker.sock

      - if: github.ref == 'refs/heads/main'
        uses: ./.github/actions/save-go-cache
        with:
          scope: build

  ui-e2e:
    name: "ui e2e (browser smoke)"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # Optional authenticated Docker Hub pulls; see the integration job.
      - name: Log in to Docker Hub
        if: ${{ vars.DOCKERHUB_USERNAME != '' }}
        continue-on-error: true
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Pulls from the GHCR mirror when IMAGE_MIRROR is set and complete, else from Docker Hub.
      - uses: ./.github/actions/image-source

      - uses: ./.github/actions/setup-go
        with:
          scope: build

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v6
        with:
          node-version: 26
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile
        working-directory: frontend

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium
        working-directory: frontend

      # Real Postgres + the real server with the embedded React build,
      # driven through register → login → dashboard in a real browser.
      - name: Browser smoke suite
        run: make e2e-ui
        env:
          DOCKER_HOST: unix:///var/run/docker.sock

      - if: github.ref == 'refs/heads/main'
        uses: ./.github/actions/save-go-cache
        with:
          scope: build

  restore-smoke:
    name: "restore smoke (backup and restore procedure)"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # Optional authenticated Docker Hub pulls; see the integration job.
      - name: Log in to Docker Hub
        if: ${{ vars.DOCKERHUB_USERNAME != '' }}
        continue-on-error: true
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Pulls from the GHCR mirror when IMAGE_MIRROR is set and complete, else from Docker Hub.
      - uses: ./.github/actions/image-source

      - uses: ./.github/actions/setup-go
        with:
          scope: build

      # Dumps a seeded database, restores it into an empty one and boots the
      # server on it, following deploy/README.md "Backup and restore".
      - name: Restore smoke
        run: ./scripts/restore-smoke.sh
        env:
          DOCKER_HOST: unix:///var/run/docker.sock

      - if: github.ref == 'refs/heads/main'
        uses: ./.github/actions/save-go-cache
        with:
          scope: build

  compose-smoke:
    name: "compose smoke (documented first start)"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # Optional authenticated Docker Hub pulls; see the integration job.
      - name: Log in to Docker Hub
        if: ${{ vars.DOCKERHUB_USERNAME != '' }}
        continue-on-error: true
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Pulls from the GHCR mirror when IMAGE_MIRROR is set and complete, else from Docker Hub.
      - uses: ./.github/actions/image-source

      # Builds the image from source with the build override and walks the "Start" section of
      # deploy/README.md: setup token, first admin, project, scan, verdict, restart.
      - name: Compose smoke
        run: ./scripts/compose-smoke.sh

  upgrade-smoke:
    name: "upgrade smoke (older database, current server)"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # The old revisions it builds come from the history, so the clone must be complete.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      # Optional authenticated Docker Hub pulls; see the integration job.
      - name: Log in to Docker Hub
        if: ${{ vars.DOCKERHUB_USERNAME != '' }}
        continue-on-error: true
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Pulls from the GHCR mirror when IMAGE_MIRROR is set and complete, else from Docker Hub.
      - uses: ./.github/actions/image-source

      - uses: ./.github/actions/setup-go
        with:
          scope: build

      # Lets an older release fill a database through its own API, then starts this build on it:
      # the account, project, scan, triage decision and API key must all survive the migrations.
      - name: Upgrade smoke
        run: ./scripts/upgrade-smoke.sh

      - if: github.ref == 'refs/heads/main'
        uses: ./.github/actions/save-go-cache
        with:
          scope: build

  lint:
    name: lint + format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: ./.github/actions/setup-go
        with:
          scope: lint

      - name: Resolve module graph
        run: go mod tidy

      - name: gofumpt
        run: |
          test -z "$(go run mvdan.cc/gofumpt@86bffd62437a3c437c0b84d5d5ab244824e762fc -l .)"

      # Build golangci-lint from source with CI's Go rather than using its
      # prebuilt binary: the prebuilt v1.64.8 ships compiled with Go 1.24,
      # which refuses to analyse a Go 1.26 module ("Go language version used
      # to build golangci-lint is lower than the targeted Go version"). The
      # repo's own pre-commit hook builds the same rev from source in the dev
      # shell (Go 1.26.5), so CI mirrors that. The args mirror the repo's
      # pre-commit hook exactly --disable-all --enable=staticcheck -- so CI
      # enforces the same bar developers get locally.
      - name: golangci-lint
        run: |
          go run github.com/golangci/golangci-lint/cmd/golangci-lint@v1.64.8 \
            run --disable-all --enable=staticcheck ./... --timeout=5m

      - name: Build
        run: go build ./...

      - if: github.ref == 'refs/heads/main'
        uses: ./.github/actions/save-go-cache
        with:
          scope: lint

  frontend:
    name: frontend (vitest + tsc + dprint + oxlint)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 26
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Unit tests (vitest)
        run: pnpm test

      - name: API types in sync
        run: pnpm api:check

      - name: Audit dependencies
        run: pnpm audit --audit-level high

      - name: Typecheck
        run: npx tsc -b

      - name: Format check (dprint)
        run: npx dprint check

      - name: Lint (oxlint)
        run: pnpm lint

  build:
    name: docker build (clean clone)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # Optional authenticated Docker Hub pulls; see the integration job.
      - name: Log in to Docker Hub
        if: ${{ vars.DOCKERHUB_USERNAME != '' }}
        continue-on-error: true
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Pulls from the GHCR mirror when IMAGE_MIRROR is set and complete, else from Docker Hub.
      - uses: ./.github/actions/image-source

      - name: Build image with version metadata
        run: |
          docker build -f "$(scripts/mirror-dockerfile.sh deploy/Dockerfile)" \
            --build-arg VERSION=ci-validation \
            --build-arg COMMIT="$(git rev-parse --short HEAD)" \
            -t specht:ci .

  release-dry-run:
    # Exercises the whole release path (archives, checksums, adapter image,
    # extraction) on pull requests without publishing or pushing anything.
    # Not a required check: it is advisory for release changes.
    name: release dry-run (no publish)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # Optional authenticated Docker Hub pulls; see the integration job.
      - name: Log in to Docker Hub
        if: ${{ vars.DOCKERHUB_USERNAME != '' }}
        continue-on-error: true
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Pulls from the GHCR mirror when IMAGE_MIRROR is set and complete, else from Docker Hub.
      - uses: ./.github/actions/image-source

      - uses: ./.github/actions/setup-go
        with:
          scope: release

      # The same script the tag release runs, with a synthetic version so the
      # packaging path is covered before any tag exists.
      - name: Build release archives
        run: ./scripts/build-release.sh 0.0.0-dryrun dist

      - name: Rebuild and compare (reproducibility)
        run: |
          ./scripts/build-release.sh 0.0.0-dryrun dist-rebuild
          diff -u dist/SHA256SUMS dist-rebuild/SHA256SUMS

      - name: Build the adapter image
        run: |
          docker build --load -f "$(scripts/mirror-dockerfile.sh deploy/Dockerfile.adapter)" \
            --build-arg VERSION=0.0.0-dryrun \
            --build-arg COMMIT="$(git rev-parse --short HEAD)" \
            -t specht-adapter:dryrun .

      - name: Smoke test the adapter image
        run: |
          docker run --rm specht-adapter:dryrun -help
          # GitLab Runner clears the entrypoint and runs the binary from the
          # job script, so the image must carry a shell as well.
          docker run --rm --entrypoint "" specht-adapter:dryrun sh -c 'specht-adapter -help'

      - name: Verify archives and checksums
        run: |
          ls -l dist
          cd dist
          sha256sum -c SHA256SUMS
          for a in *.tar.gz; do
            case "$a" in
              specht-adapter_*) bin=specht-adapter ;;
              specht-mcp_*) bin=specht-mcp ;;
              specht_*) bin=specht ;;
              *) echo "::error::unexpected archive $a"; exit 1 ;;
            esac
            for want in "$bin" LICENSE; do
              if ! tar -tzf "$a" | grep -qx "$want"; then
                echo "::error::$a does not contain $want"
                exit 1
              fi
            done
          done
          for a in *.zip; do
            case "$a" in
              specht-adapter_*) bin=specht-adapter.exe ;;
              specht-mcp_*) bin=specht-mcp.exe ;;
              specht_*) bin=specht.exe ;;
              *) echo "::error::unexpected archive $a"; exit 1 ;;
            esac
            for want in "$bin" LICENSE; do
              if ! unzip -Z1 "$a" | grep -qx "$want"; then
                echo "::error::$a does not contain $want"
                exit 1
              fi
            done
          done

      - name: Extract one archive per OS
        run: |
          rm -rf extracted
          mkdir -p extracted/linux extracted/darwin extracted/windows
          tar -xzf dist/specht-adapter_0.0.0-dryrun_linux_amd64.tar.gz -C extracted/linux
          tar -xzf dist/specht_0.0.0-dryrun_darwin_arm64.tar.gz -C extracted/darwin
          tar -xzf dist/specht-mcp_0.0.0-dryrun_linux_amd64.tar.gz -C extracted/linux
          unzip -q dist/specht-adapter_0.0.0-dryrun_windows_amd64.zip -d extracted/windows
          test -x extracted/linux/specht-adapter
          test -x extracted/darwin/specht
          test -f extracted/windows/specht-adapter.exe
          # Linux is the only one of the three this runner can execute.
          ./extracted/linux/specht-adapter -help
          ./extracted/linux/specht-mcp -version

      - name: Upload dry-run release artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: release-dryrun
          path: dist/
          if-no-files-found: error
          retention-days: 7

      - if: github.ref == 'refs/heads/main'
        uses: ./.github/actions/save-go-cache
        with:
          scope: release

  security-scan:
    name: security scan (Semgrep)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Semgrep
        run: |
          python3 -m pip install --user \
            "https://files.pythonhosted.org/packages/b3/bf/5bc9cc1b1e1650467ceb6361306d170dd3641b911efa2a89bc7129be4d54/semgrep-1.178.0-cp310.cp311.cp312.cp313.cp314.py310.py311.py312.py313.py314-none-manylinux_2_34_x86_64.whl#sha256=b7c4a4ba5cad1a6b0e76f7143c164b3f2853b9d0f902f2db2f64006257c941f2"

      - name: Run Semgrep important-only scan
        run: |
          semgrep --metrics=off \
            --config p/secrets \
            --config p/security-audit \
            --config p/golang \
            --config p/typescript \
            --config p/javascript \
            --config p/dockerfile \
            --severity WARNING --severity ERROR \
            --json -o semgrep-results.json \
            --sarif-output=semgrep-results.sarif \
            .

      - name: Upload Semgrep SARIF
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4
        with:
          sarif_file: semgrep-results.sarif
        continue-on-error: true

      - name: Upload SARIF artifact (dogfood ingest)
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: semgrep-sarif
          path: semgrep-results.sarif
          retention-days: 1

  govulncheck:
    name: govulncheck (Go SCA)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: ./.github/actions/setup-go
        with:
          scope: build

      # go.mod pins the patched toolchain; setup-go plus
      # GOTOOLCHAIN=auto resolves a patched toolchain, so the scan runs
      # against fixed stdlib.
      - name: govulncheck
        run: |
          go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 ./...

      - if: github.ref == 'refs/heads/main'
        uses: ./.github/actions/save-go-cache
        with:
          scope: build

  dco:
    name: dco (sign-off)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Test the DCO scripts
        run: bash scripts/dco_test.sh

      - name: Check commit sign-off
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: bash scripts/check-dco.sh "$BASE_SHA" "$HEAD_SHA"

  trivy:
    name: trivy (fs + misconfig)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Scan filesystem
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          severity: HIGH,CRITICAL
          limit-severities-for-sarif: true
          format: sarif
          output: trivy-results.sarif
          exit-code: "1"

      - name: Upload Trivy SARIF
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4
        with:
          sarif_file: trivy-results.sarif
        continue-on-error: true

      - name: Upload SARIF artifact (dogfood ingest)
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: trivy-sarif
          path: trivy-results.sarif
          retention-days: 1

  dogfood:
    # Specht scans itself: the scanner SARIF reports feed a live instance
    # so introduced-by-change, gates, and verified-fixed closure run on
    # real data every pipeline. Gate verdict is advisory until a green
    # baseline is observed for a while; flip GATE_MODE to block after.
    name: dogfood (self-ingest)
    runs-on: ubuntu-latest
    needs: [security-scan, trivy]
    env:
      DATABASE_URL: postgres://specht:${{ github.run_id }}@localhost:5432/specht?sslmode=disable
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # Optional authenticated Docker Hub pulls; see the first job in this file.
      - name: Log in to Docker Hub
        if: ${{ vars.DOCKERHUB_USERNAME != '' }}
        continue-on-error: true
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Pulls from the GHCR mirror when IMAGE_MIRROR is set and complete, else from Docker Hub.
      - uses: ./.github/actions/image-source

      # Started here, after the login above, because a service container is pulled before any step
      # runs and its credentials cannot be optional.
      - name: Start PostgreSQL
        run: |
          docker run -d --name postgres -p 5432:5432 \
            -e POSTGRES_USER=specht -e POSTGRES_PASSWORD=${{ github.run_id }} -e POSTGRES_DB=specht \
            --health-cmd="pg_isready -U specht -d specht" \
            --health-interval=5s --health-timeout=3s --health-retries=10 \
            "$SPECHT_TEST_POSTGRES_IMAGE"
          for _ in $(seq 1 60); do
            [ "$(docker inspect -f '{{.State.Health.Status}}' postgres)" = healthy ] && exit 0
            sleep 2
          done
          docker logs postgres
          exit 1

      - uses: ./.github/actions/setup-go
        with:
          scope: build

      - name: Download scanner SARIF
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          path: sarif-reports
          pattern: "*-sarif"
          merge-multiple: true

      - name: Migrate and start server
        run: |
          go run ./cmd/server migrate
          JWT_SECRET="$(openssl rand -hex 32)"
          echo "::add-mask::$JWT_SECRET"
          export JWT_SECRET
          echo "JWT_SECRET=$JWT_SECRET" >> "$GITHUB_ENV"
          go build -o /tmp/specht-ci ./cmd/server
          DB_MIGRATE=true SETUP_TOKEN=ci-dogfood-setup-token /tmp/specht-ci >> /tmp/specht-ci.log 2>&1 &
          for _ in $(seq 1 30); do
            curl -sf http://127.0.0.1:8080/api/v1/health && break
            sleep 2
          done

      - name: Create the admin with first-run setup
        run: |
          curl -sf -X POST http://127.0.0.1:8080/api/v1/setup \
            -H 'Content-Type: application/json' \
            -d '{"token":"ci-dogfood-setup-token","email":"ci-dogfood@example.com","password":"ci-dogfood-password-123"}'

      - name: Ingest scanner reports into Specht
        env:
          SPECHT_API_URL: http://127.0.0.1:8080
          SPECHT_ADMIN_EMAIL: ci-dogfood@example.com
          SPECHT_ADMIN_PASSWORD: ci-dogfood-password-123
          SPECHT_PROJECT: specht-self
          SARIF_FILES: sarif-reports/semgrep-results.sarif sarif-reports/trivy-results.sarif
          GATE_MODE: advisory
        run: bash scripts/ci-dogfood.sh

      - if: github.ref == 'refs/heads/main'
        uses: ./.github/actions/save-go-cache
        with:
          scope: build
