name: ci

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: test (unit + integration)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Verify dependencies
        run: go mod verify

      - name: Vet
        run: go vet ./...

      - name: Unit tests (offline)
        run: go test ./... -count=1 -short

      - name: Integration tests (real Postgres via testcontainers)
        run: go test -tags integration ./internal/repo/ -count=1 -timeout 15m
        env:
          DOCKER_HOST: unix:///var/run/docker.sock

  lint:
    name: lint + format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Resolve module graph
        run: go mod tidy

      - name: gofumpt
        run: |
          test -z "$(go run mvdan.cc/gofumpt@v0.7.0 -l .)"

      # Build golangci-lint from source with CI's Go rather than using its
      # prebuilt binary: the prebuilt v1.64.8 ships compiled with Go 1.24,
      # which refuses to analyse a Go 1.26 module ("Go language version used
      # to build golangci-lint is lower than the targeted Go version"). The
      # repo's own pre-commit hook builds the same rev from source in the dev
      # shell (Go 1.26.5), so CI mirrors that. The args mirror the repo's
      # pre-commit hook exactly --disable-all --enable=staticcheck -- so CI
      # enforces the same bar developers get locally.
      - name: golangci-lint
        run: |
          go run github.com/golangci/golangci-lint/cmd/golangci-lint@v1.64.8 \
            run --disable-all --enable=staticcheck ./... --timeout=5m

      - name: Build
        run: go build ./...

  frontend:
    name: frontend (vitest + tsc + dprint + oxlint)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Unit tests (vitest)
        run: pnpm test

      - name: Typecheck
        run: npx tsc -b

      - name: Format check (dprint)
        run: npx dprint check

      - name: Lint (oxlint)
        run: pnpm lint

  build:
    name: docker build (clean clone)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -f deploy/Dockerfile -t specht:ci .

  security-scan:
    name: security scan (Semgrep)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Semgrep
        run: |
          python3 -m pip install --user semgrep

      - name: Run Semgrep important-only scan
        run: |
          semgrep --metrics=off \
            --config p/secrets \
            --config p/security-audit \
            --config p/golang \
            --config p/dockerfile \
            --severity WARNING --severity ERROR \
            --json -o semgrep-results.json \
            --sarif-output=semgrep-results.sarif \
            .

      - name: Upload Semgrep SARIF
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: semgrep-results.sarif
        continue-on-error: true
