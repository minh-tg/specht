name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  packages: write

jobs:
  build-image:
    name: build + publish versioned image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # go.sum is tracked; resolve the module graph so the Dockerfile's
      # go.mod-only flow (GOFLAGS=-mod=mod go mod download) is fast and
      # deterministic in the image build below.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod

      - name: Resolve module graph
        run: go mod tidy

      - name: Validate version tag and capture build metadata
        id: tag
        run: |
          if [[ ! "$GITHUB_REF_NAME" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::tag must be vMAJOR.MINOR.PATCH with an optional prerelease suffix"
            exit 1
          fi
          echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          echo "commit=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: deploy/Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository }}:${{ steps.tag.outputs.tag }}
          build-args: |
            VERSION=${{ steps.tag.outputs.tag }}
            COMMIT=${{ steps.tag.outputs.commit }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.tag.outputs.tag }}
            org.opencontainers.image.revision=${{ github.sha }}

  verify-image:
    name: boot + verify the published image
    needs: build-image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull the tagged image
        run: docker pull "ghcr.io/${{ github.repository }}:${GITHUB_REF_NAME}"

      - name: Assert OCI labels match the tag
        run: |
          img="ghcr.io/${{ github.repository }}:${GITHUB_REF_NAME}"
          version=$(docker inspect --format '{{index .Config.Labels "org.opencontainers.image.version"}}' "$img")
          revision=$(docker inspect --format '{{index .Config.Labels "org.opencontainers.image.revision"}}' "$img")
          echo "version=$version revision=$revision"
          if [ "$version" != "$GITHUB_REF_NAME" ] || [ "$revision" != "$GITHUB_SHA" ]; then
            echo "::error::image labels do not match the tag"
            exit 1
          fi

      - name: Boot and exercise the image
        run: ./scripts/verify-image.sh "ghcr.io/${{ github.repository }}:${GITHUB_REF_NAME}"
