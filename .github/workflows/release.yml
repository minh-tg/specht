name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  packages: write
  id-token: write

jobs:
  build-image:
    name: build + publish versioned image
    outputs:
      image_digest: ${{ steps.build.outputs.digest }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # Anonymous Docker Hub pulls share a per-IP limit that hosted runners exhaust. When the
      # repository has credentials (variable DOCKERHUB_USERNAME, secret DOCKERHUB_TOKEN) pulls are
      # authenticated. Forks and Dependabot have no secret; the step then fails softly and the job
      # pulls anonymously, as before.
      - name: Log in to Docker Hub
        if: ${{ vars.DOCKERHUB_USERNAME != '' }}
        continue-on-error: true
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # go.sum is tracked; resolve the module graph so the Dockerfile's
      # go.mod-only flow (GOFLAGS=-mod=mod go mod download) is fast and
      # deterministic in the image build below.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod

      - name: Resolve module graph
        run: go mod tidy

      - name: Validate version tag and capture build metadata
        id: tag
        run: |
          if [[ ! "$GITHUB_REF_NAME" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::tag must be vMAJOR.MINOR.PATCH with an optional prerelease suffix"
            exit 1
          fi
          echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          echo "commit=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # build-push-action needs a buildx builder for sbom and provenance
      # attestations; the default docker driver refuses them.
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      # The candidate is pushed by digest only, so no version tag resolves to
      # it while the signature, the labels and the boot test are still
      # unverified. promote-image adds the public tag once verify-image passes.
      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: deploy/Dockerfile
          outputs: type=image,name=ghcr.io/${{ github.repository }},push-by-digest=true,name-canonical=true,push=true
          sbom: true
          provenance: mode=max
          build-args: |
            VERSION=${{ steps.tag.outputs.tag }}
            COMMIT=${{ steps.tag.outputs.commit }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.tag.outputs.tag }}
            org.opencontainers.image.revision=${{ github.sha }}

      - name: Install cosign
        uses: sigstore/cosign-installer@053f9b74638557590800a301da1ba82351507e2c # v3.8.1

      - name: Sign image
        env:
          COSIGN_EXPERIMENTAL: "1"
        run: cosign sign --yes "ghcr.io/${{ github.repository }}@${{ steps.build.outputs.digest }}"

  verify-image:
    name: boot + verify the published image
    needs: build-image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # Optional authenticated Docker Hub pulls; see the first job in this file.
      - name: Log in to Docker Hub
        if: ${{ vars.DOCKERHUB_USERNAME != '' }}
        continue-on-error: true
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Install cosign
        uses: sigstore/cosign-installer@053f9b74638557590800a301da1ba82351507e2c # v3.8.1

      - name: Verify image signature
        run: >-
          cosign verify
          --certificate-identity "${{ github.server_url }}/${{ github.repository }}/.github/workflows/release.yml@refs/tags/${{ github.ref_name }}"
          --certificate-oidc-issuer https://token.actions.githubusercontent.com
          "ghcr.io/${{ github.repository }}@${{ needs['build-image'].outputs.image_digest }}"

      - name: Pull the candidate digest
        run: docker pull "ghcr.io/${{ github.repository }}@${{ needs['build-image'].outputs.image_digest }}"

      - name: Assert OCI labels match the tag
        run: |
          img="ghcr.io/${{ github.repository }}@${{ needs['build-image'].outputs.image_digest }}"
          version=$(docker inspect --format '{{index .Config.Labels "org.opencontainers.image.version"}}' "$img")
          revision=$(docker inspect --format '{{index .Config.Labels "org.opencontainers.image.revision"}}' "$img")
          echo "version=$version revision=$revision"
          if [ "$version" != "$GITHUB_REF_NAME" ] || [ "$revision" != "$GITHUB_SHA" ]; then
            echo "::error::image labels do not match the tag"
            exit 1
          fi

      - name: Boot and exercise the image
        run: ./scripts/verify-image.sh "ghcr.io/${{ github.repository }}@${{ needs['build-image'].outputs.image_digest }}"

  # Publishing is the last step. Only a digest that passed the signature check,
  # the label check and the boot test is promoted to the public version tag.
  promote-image:
    name: tag the verified image
    needs: [build-image, verify-image]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Tag the verified digest
        run: |
          docker buildx imagetools create \
            --tag "ghcr.io/${{ github.repository }}:${{ github.ref_name }}" \
            "ghcr.io/${{ github.repository }}@${{ needs['build-image'].outputs.image_digest }}"

      - name: Assert the published tag resolves to the verified digest
        run: |
          published="$(docker buildx imagetools inspect --format '{{.Manifest.Digest}}' \
            "ghcr.io/${{ github.repository }}:${{ github.ref_name }}")"
          if [ "$published" != "${{ needs['build-image'].outputs.image_digest }}" ]; then
            echo "::error::tag ${{ github.ref_name }} resolves to $published, expected ${{ needs['build-image'].outputs.image_digest }}"
            exit 1
          fi

  build-binaries:
    name: cross-compile release binaries
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod

      # The script rejects a tag that is not vMAJOR.MINOR.PATCH, so a bad tag
      # builds nothing and the release job below publishes nothing.
      - name: Build archives
        run: ./scripts/build-release.sh "${GITHUB_REF_NAME#v}" dist

      - name: Install cosign
        uses: sigstore/cosign-installer@053f9b74638557590800a301da1ba82351507e2c # v3.8.1

      - name: Sign the checksum manifest (keyless)
        run: |
          cosign sign-blob --yes \
            --output-signature dist/SHA256SUMS.sig \
            --output-certificate dist/SHA256SUMS.pem \
            dist/SHA256SUMS

      - name: Upload release artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-binaries
          path: dist/
          if-no-files-found: error

  adapter-image:
    name: build + publish the adapter image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # Optional authenticated Docker Hub pulls; see the first job in this file.
      - name: Log in to Docker Hub
        if: ${{ vars.DOCKERHUB_USERNAME != '' }}
        continue-on-error: true
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Validate version tag and capture build metadata
        id: tag
        run: |
          if [[ ! "$GITHUB_REF_NAME" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::tag must be vMAJOR.MINOR.PATCH with an optional prerelease suffix"
            exit 1
          fi
          echo "commit=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # build-push-action needs a buildx builder for sbom and provenance
      # attestations and for push-by-digest; the default docker driver refuses
      # both.
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      # The candidate is pushed by digest only, so no version tag resolves to
      # it while the signature, the labels and the smoke test are still
      # unverified. The public tag is added at the end of this job, once every
      # check below has passed.
      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: deploy/Dockerfile.adapter
          outputs: type=image,name=ghcr.io/${{ github.repository_owner }}/specht-adapter,push-by-digest=true,name-canonical=true,push=true
          sbom: true
          provenance: mode=max
          build-args: |
            VERSION=${{ github.ref_name }}
            COMMIT=${{ steps.tag.outputs.commit }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ github.ref_name }}
            org.opencontainers.image.revision=${{ github.sha }}

      - name: Install cosign
        uses: sigstore/cosign-installer@053f9b74638557590800a301da1ba82351507e2c # v3.8.1

      - name: Sign image
        env:
          COSIGN_EXPERIMENTAL: "1"
        run: cosign sign --yes "ghcr.io/${{ github.repository_owner }}/specht-adapter@${{ steps.build.outputs.digest }}"

      - name: Verify image signature
        run: >-
          cosign verify
          --certificate-identity "${{ github.server_url }}/${{ github.repository }}/.github/workflows/release.yml@refs/tags/${{ github.ref_name }}"
          --certificate-oidc-issuer https://token.actions.githubusercontent.com
          "ghcr.io/${{ github.repository_owner }}/specht-adapter@${{ steps.build.outputs.digest }}"

      - name: Pull the candidate digest
        run: docker pull "ghcr.io/${{ github.repository_owner }}/specht-adapter@${{ steps.build.outputs.digest }}"

      - name: Smoke test the adapter image
        run: |
          img="ghcr.io/${{ github.repository_owner }}/specht-adapter@${{ steps.build.outputs.digest }}"
          docker run --rm "$img" -help
          # GitLab Runner clears the entrypoint and drives the binary from a
          # shell script, so the image must carry a shell as well.
          docker run --rm --entrypoint "" "$img" sh -c 'specht-adapter -help'

      # Publishing is the last step. Only a digest that passed the signature
      # check and the smoke test is promoted to the public version tag.
      - name: Tag the verified digest
        run: |
          docker buildx imagetools create \
            --tag "ghcr.io/${{ github.repository_owner }}/specht-adapter:${{ github.ref_name }}" \
            "ghcr.io/${{ github.repository_owner }}/specht-adapter@${{ steps.build.outputs.digest }}"

      - name: Assert the published tag resolves to the verified digest
        run: |
          published="$(docker buildx imagetools inspect --format '{{.Manifest.Digest}}' \
            "ghcr.io/${{ github.repository_owner }}/specht-adapter:${{ github.ref_name }}")"
          if [ "$published" != "${{ steps.build.outputs.digest }}" ]; then
            echo "::error::tag ${{ github.ref_name }} resolves to $published, expected ${{ steps.build.outputs.digest }}"
            exit 1
          fi

  publish-release:
    name: publish the GitHub release
    needs: [build-binaries, adapter-image, promote-image]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: release-binaries
          path: dist

      - name: Install cosign
        uses: sigstore/cosign-installer@053f9b74638557590800a301da1ba82351507e2c # v3.8.1

      # The manifest signature is checked against this workflow's own tag
      # identity before anything is published.
      - name: Verify the checksum manifest signature
        working-directory: dist
        run: |
          cosign verify-blob \
            --certificate SHA256SUMS.pem \
            --signature SHA256SUMS.sig \
            --certificate-identity "https://github.com/${{ github.repository }}/.github/workflows/release.yml@${{ github.ref }}" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            SHA256SUMS

      - name: Verify the archives against SHA256SUMS
        working-directory: dist
        run: |
          archives=$(find . -maxdepth 1 -type f \( -name '*.tar.gz' -o -name '*.zip' \) | wc -l)
          if [ "$archives" -ne 10 ]; then
            echo "::error::expected 10 archives, found $archives"
            exit 1
          fi
          sha256sum -c SHA256SUMS

      - name: Publish the release
        working-directory: dist
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # A prerelease tag must not become the release GitHub hands out by
          # default, so mark it and keep it out of the latest slot.
          prerelease=()
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then
            prerelease=(--prerelease --latest=false)
          fi
          gh release create "${GITHUB_REF_NAME}" \
            --repo "${GITHUB_REPOSITORY}" \
            --verify-tag \
            "${prerelease[@]}" \
            --title "Specht ${GITHUB_REF_NAME}" \
            --notes "Adapter and CLI binaries for ${GITHUB_REF_NAME}, plus the adapter image ghcr.io/${GITHUB_REPOSITORY_OWNER}/specht-adapter:${GITHUB_REF_NAME}. Check every download against SHA256SUMS and verify SHA256SUMS with cosign verify-blob and SHA256SUMS.pem." \
            ./*.tar.gz ./*.zip SHA256SUMS SHA256SUMS.sig SHA256SUMS.pem
