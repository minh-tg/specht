name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  packages: write

jobs:
  build-image:
    name: build + publish versioned image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # go.sum is untracked; resolve the module graph so the Dockerfile's
      # go.mod-only flow (GOFLAGS=-mod=mod go mod download) is fast and
      # deterministic in the image build below.
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Resolve module graph
        env:
          GOFLAGS: -mod=mod
        run: go mod download

      - name: Set image tag from git tag
        id: tag
        run: echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:${{ steps.tag.outputs.tag }}
            ghcr.io/${{ github.repository }}:latest
